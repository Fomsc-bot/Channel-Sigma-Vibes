name: Generate Sigma Shorts (2x daily)

on:
  schedule:
    - cron: '0 0,12 * * *'   # Runs at 00:00 and 12:00 UTC daily
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libsm6 libxext6 fonts-dejavu-core
          sudo apt-get clean

      - name: Upgrade pip and install Python dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install --no-cache-dir moviepy imageio imageio-ffmpeg Pillow

      - name: Verify moviepy installation
        run: |
          python -m pip show moviepy
          python -c "import moviepy.editor"

      - name: Create outputs directory
        run: mkdir -p outputs

      - name: Run generator
        run: python generate_short_gemini.py

      - name: Upload Shorts as Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sigma-shorts
          path: outputs/*.mp4
          if-no-files-found: warn
