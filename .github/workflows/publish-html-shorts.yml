name: Publish HTML Shorts

on:
  schedule:
        # 7:00 AM Sri Lanka time -> 01:30 UTC
    #- cron: '30 01 * * *'

    # 6:00 PM Sri Lanka time -> 12:30 UTC
    - cron: '30 12 * * *'

    # Added: 10:00 AM U.S. Eastern Time -> 15:00 UTC
    #- cron: '00 15 * * *'
    
    # 12:30 AM Sri Lanka time (previous day in UTC)
    #- cron: '00 19 * * *'
    
  workflow_dispatch:

concurrency:
  group: html-shorts-publish
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify bundled FFmpeg H.264 encoder
        run: |
          python -c 'import imageio_ffmpeg, subprocess; exe=imageio_ffmpeg.get_ffmpeg_exe(); info=subprocess.check_output([exe, "-hide_banner", "-encoders"], stderr=subprocess.STDOUT, text=True); assert "libx264" in info, "Bundled FFmpeg has no libx264 encoder"; print("Using bundled FFmpeg with libx264:", exe)'

      - name: Get Playwright version
        id: playwright-version
        run: echo "version=$(python -c 'import importlib.metadata; print(importlib.metadata.version("playwright"))')" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-${{ runner.arch }}-playwright-${{ steps.playwright-version.outputs.version }}

      - name: Install Chromium dependencies and browser
        run: |
          python -m playwright install-deps chromium
          python -m playwright install chromium

      - name: Render and publish one Short
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_FALLBACK_MODEL: ${{ vars.GEMINI_FALLBACK_MODEL }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
          FB_GRAPH_API_VERSION: v26.0
          FB_GROUP_IDS: ${{ secrets.FB_GROUP_IDS }}
        run: python html_short_pipeline.py

      - name: Commit delivery state and consumed HTML/music rotation
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "HTML Files That Needed To Convert To Video" content/music_rotation.json content/publish_state.json
          if ! git diff --cached --quiet; then
            git commit -m "Consume published HTML Short"
            git push
          fi
