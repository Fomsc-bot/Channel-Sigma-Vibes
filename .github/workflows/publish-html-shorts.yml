name: Publish HTML Shorts

on:
  schedule:
    - cron: "0 0,18 * * *"
  workflow_dispatch:

concurrency:
  group: html-shorts-publish
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Prepare apt archive cache
        run: mkdir -p "$RUNNER_TEMP/apt-cache/archives/partial"

      - name: Detect Ubuntu release
        id: ubuntu-release
        run: |
          source /etc/os-release
          echo "version=$VERSION_ID" >> "$GITHUB_OUTPUT"

      - name: Cache apt package archives
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/apt-cache/archives
          key: apt-${{ runner.os }}-${{ runner.arch }}-ubuntu-${{ steps.ubuntu-release.outputs.version }}-v1
          restore-keys: |
            apt-${{ runner.os }}-${{ runner.arch }}-ubuntu-${{ steps.ubuntu-release.outputs.version }}-

      - name: Configure apt to keep cached packages
        run: |
          printf 'Dir::Cache::archives "%s/apt-cache/archives";\nAPT::Keep-Downloaded-Packages "true";\n' "$RUNNER_TEMP" | sudo tee /etc/apt/apt.conf.d/99actions-cache

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Get Playwright version
        id: playwright-version
        run: echo "version=$(python -c 'import importlib.metadata; print(importlib.metadata.version("playwright"))')" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-${{ runner.arch }}-playwright-${{ steps.playwright-version.outputs.version }}

      - name: Install Chromium dependencies and browser
        run: |
          python -m playwright install-deps chromium
          python -m playwright install chromium

      - name: Render and publish one Short
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_MODEL: gemini-3.8-flash
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: python html_short_pipeline.py

      - name: Commit consumed HTML and music rotation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "HTML Files That Needed To Convert To Video" content/music_rotation.json
          if ! git diff --cached --quiet; then
            git commit -m "Consume published HTML Short"
            git push
          fi
