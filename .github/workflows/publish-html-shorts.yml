name: Select Content Rewards Campaign and Publish Short

on:
  schedule:
    # 6:00 PM Sri Lanka time
    - cron: '30 12 * * *'
  workflow_dispatch:

concurrency:
  group: content-rewards-publish
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify bundled FFmpeg H.264 encoder
        run: |
          python -c 'import imageio_ffmpeg, subprocess; exe=imageio_ffmpeg.get_ffmpeg_exe(); info=subprocess.check_output([exe, "-hide_banner", "-encoders"], stderr=subprocess.STDOUT, text=True); assert "libx264" in info, "Bundled FFmpeg has no libx264 encoder"; print("Using bundled FFmpeg with libx264:", exe)'

      - name: Get Playwright version
        id: playwright-version
        run: echo "version=$(python -c 'import importlib.metadata; print(importlib.metadata.version("playwright"))')" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-${{ runner.arch }}-playwright-${{ steps.playwright-version.outputs.version }}

      - name: Install Chromium dependencies and browser
        run: |
          python -m playwright install-deps chromium
          python -m playwright install chromium

      - name: Match campaign, render Short, publish and submit
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_FALLBACK_MODEL: ${{ vars.GEMINI_FALLBACK_MODEL }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          CR_STORAGE_STATE_B64: ${{ secrets.CR_STORAGE_STATE_B64 }}
          CR_CAMPAIGNS_URL: ${{ vars.CR_CAMPAIGNS_URL }}
        run: python content_rewards_pipeline.py

      - name: Commit delivery state and consumed HTML/music rotation
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "HTML Files That Needed To Convert To Video" content/music_rotation.json content/content_rewards_delivery.json
          if ! git diff --cached --quiet; then
            git commit -m "Record Content Rewards Short delivery"
            git push
          fi
