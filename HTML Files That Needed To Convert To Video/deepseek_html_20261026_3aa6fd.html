<!-- SCENE 124 | DURATION: 9s | Theme: Boundaries | Design: bold numbers stack -->
<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8">
<title>Scene 124 — The strongest thing</title><style>
*{margin:0;padding:0;box-sizing:border-box}:root{--gold:#f5c542;--soft:#f0e6d3;--font:'Georgia','Times New Roman',serif;--sans:'Helvetica Neue',Arial,sans-serif}html,body{height:100%;background:#000;overflow:hidden;display:flex;align-items:center;justify-content:center;font-family:var(--font)}.frame{position:relative;aspect-ratio:9/16;height:min(100vh,calc(100vw*16/9));width:min(100vw,calc(100vh*9/16));overflow:hidden;background:linear-gradient(180deg,#0a0a10 0%,#050306 100%);box-shadow:0 0 80px rgba(0,0,0,.9)}.track{position:absolute;left:50%;top:8%;bottom:8%;width:1px;background:linear-gradient(to bottom,transparent,rgba(245,197,66,.3) 20%,rgba(245,197,66,.3) 80%,transparent);transform:translateX(-50%);z-index:0;opacity:0;animation:fadeIn 1.8s ease-out .3s forwards}.dot{position:absolute;left:50%;transform:translateX(-50%);width:8px;height:8px;background:var(--gold);border-radius:50%;box-shadow:0 0 20px rgba(245,197,66,.6);animation:travel 8s ease-in-out infinite}@keyframes travel{0%{top:10%;opacity:0}10%{opacity:1}90%{opacity:1}100%{top:88%;opacity:0}}.content{position:relative;z-index:2;padding:20% 12%;text-align:center;width:100%;overflow-wrap:break-word;word-wrap:break-word;hyphens:auto}.quote{font-size:clamp(24px,5.4vw,54px);line-height:1.3;font-weight:700;color:var(--soft);opacity:0;animation:fadeUp 1.6s cubic-bezier(.22,.9,.3,1) .7s forwards}.quote em{color:var(--gold);font-style:italic;font-weight:400;display:inline}.sub{font-family:var(--sans);font-size:clamp(11px,2.2vw,18px);letter-spacing:.18em;text-transform:uppercase;line-height:1.8;color:rgba(240,230,211,.55);margin-top:2.4em;opacity:0;animation:fadeUp 1.4s ease-out 3.2s forwards}.cta{position:absolute;bottom:5%;left:50%;transform:translateX(-50%);font-family:var(--sans);font-size:clamp(9px,1.6vw,13px);letter-spacing:.3em;text-transform:uppercase;color:rgba(255,255,255,.45);z-index:3;opacity:0;animation:fadeIn 1s ease-out 4.8s forwards}@keyframes fadeUp{from{opacity:0;transform:translateY(40px)}to{opacity:1;transform:translateY(0)}}@keyframes fadeIn{to{opacity:1}}
</style></head><body>
<div class="frame">
  <div class="track"></div>
  <div class="dot"></div>
  <div class="content">
    <p class="quote">The strongest thing<br>you will ever do<br>is <em>stay soft</em><br>in a world<br>that keeps<br>hardening.</p>
    <p class="sub">Stay soft · stay you</p>
  </div>
  <div class="cta">Follow · Stay soft</div>
</div></body></html>
