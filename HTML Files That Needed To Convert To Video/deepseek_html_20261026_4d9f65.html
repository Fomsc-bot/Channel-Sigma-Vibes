<!-- SCENE 122 | DURATION: 9s | Theme: Self-love | Design: mirror reflection glow -->
<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8">
<title>Scene 122 — The love you are looking for</title><style>
*{margin:0;padding:0;box-sizing:border-box}:root{--gold:#f5c542;--rose:#ff6b8a;--soft:#f0e6d3;--font:'Georgia','Times New Roman',serif;--sans:'Helvetica Neue',Arial,sans-serif}html,body{height:100%;background:#000;overflow:hidden;display:flex;align-items:center;justify-content:center;font-family:var(--font)}.frame{position:relative;aspect-ratio:9/16;height:min(100vh,calc(100vw*16/9));width:min(100vw,calc(100vh*9/16));overflow:hidden;background:radial-gradient(circle at 50% 50%,#20081a 0%,#080208 85%);box-shadow:0 0 80px rgba(0,0,0,.9)}.mirror{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:70%;aspect-ratio:2/3;border:1px solid rgba(255,107,138,.2);border-radius:50% 50% 45% 45%/55% 55% 45% 45%;z-index:0;opacity:0;animation:fadeIn 2s ease-out .4s forwards}.mirror::before{content:'';position:absolute;inset:10px;border:1px solid rgba(255,107,138,.1);border-radius:50% 50% 45% 45%/55% 55% 45% 45%}.glow{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:55%;aspect-ratio:1;background:radial-gradient(circle,rgba(255,107,138,.15) 0%,transparent 60%);border-radius:50%;animation:breathe 6s ease-in-out infinite}@keyframes breathe{0%,100%{transform:translate(-50%,-50%) scale(1);opacity:.7}50%{transform:translate(-50%,-50%) scale(1.2);opacity:1}}.content{position:relative;z-index:2;padding:18% 12%;text-align:center;width:100%;overflow-wrap:break-word;word-wrap:break-word;hyphens:auto}.quote{font-size:clamp(23px,5.3vw,52px);line-height:1.35;font-weight:400;color:var(--soft);font-style:italic;opacity:0;animation:fadeUp 1.8s cubic-bezier(.22,.9,.3,1) .7s forwards}.quote strong{color:var(--rose);font-style:normal;font-weight:700;display:block;margin-top:.4em}.sub{font-family:var(--sans);font-size:clamp(11px,2.2vw,18px);letter-spacing:.2em;text-transform:uppercase;line-height:1.8;color:rgba(240,230,211,.55);margin-top:2.2em;opacity:0;animation:fadeUp 1.4s ease-out 3.2s forwards}.cta{position:absolute;bottom:5%;left:50%;transform:translateX(-50%);font-family:var(--sans);font-size:clamp(9px,1.6vw,13px);letter-spacing:.3em;text-transform:uppercase;color:rgba(255,255,255,.45);z-index:3;opacity:0;animation:fadeIn 1s ease-out 4.8s forwards}@keyframes fadeUp{from{opacity:0;transform:translateY(40px)}to{opacity:1;transform:translateY(0)}}@keyframes fadeIn{to{opacity:1}}
</style><style id="reel-border-normalization">*,*::before,*::after{border:0!important;outline:0!important;box-shadow:none!important}html,body{width:100%!important;height:100%!important;margin:0!important;overflow:hidden!important}body>.frame{position:fixed!important;inset:0!important;width:100vw!important;height:100vh!important;max-width:none!important;max-height:none!important;aspect-ratio:auto!important;border-radius:0!important}</style></head><body>
<div class="frame">
  <div class="mirror"></div>
  <div class="glow"></div>
  <div class="content">
    <p class="quote">The love you are looking for<br>is not outside you.<strong>It is the love you withhold<br>from yourself.</strong></p>
    <p class="sub">Give it back</p>
  </div>
  <div class="cta">Follow · Self-love daily</div>
</div></body></html>
