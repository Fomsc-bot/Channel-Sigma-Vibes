<!-- SCENE 182 | DURATION: 9s | Theme: The cost of being invisible | Design: dissolving silhouette -->
<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8">
<title>Scene 182 — Some people are only seen in pieces</title><style>
*{margin:0;padding:0;box-sizing:border-box}:root{--gold:#f5c542;--soft:#f0e6d3;--font:'Georgia','Times New Roman',serif;--sans:'Helvetica Neue',Arial,sans-serif}html:root,body{height:100%;background:#000;overflow:hidden;display:flex;align-items:center;justify-content:center;font-family:var(--font)}.frame{position:relative;aspect-ratio:9/16;height:min(100vh,calc(100vw*16/9));width:min(100vw,calc(100vh*9/16));overflow:hidden;background:radial-gradient(circle at 50% 50%,#0c0a18 0%,#020204 85%);box-shadow:0 0 80px rgba(0,0,0,.9)}.silhouette{position:absolute;top:25%;left:50%;transform:translateX(-50%);width:30%;height:50%;background:radial-gradient(ellipse at 50% 30%,rgba(245,197,66,.15) 0%,transparent 70%);border-radius:50% 50% 20% 20%/40% 40% 10% 10%;filter:blur(15px);animation:dissolve 8s ease-in-out infinite}@keyframes dissolve{0%,100%{opacity:.6}50%{opacity:.15}}.content{position:relative;z-index:2;padding:20% 12%;text-align:center;width:100%;overflow-wrap:break-word;word-wrap:break-word;hyphens:auto}.quote{font-size:clamp(22px,5.1vw,50px);line-height:1.4;font-weight:400;color:var(--soft);font-style:italic;opacity:0;animation:fadeUp 1.8s cubic-bezier(.22,.9,.3,1) .7s forwards}.quote strong{color:var(--gold);font-style:normal;font-weight:700;display:block;margin-top:.4em}.sub{font-family:var(--sans);font-size:clamp(11px,2.2vw,18px);letter-spacing:.18em;line-height:1.8;text-transform:uppercase;color:rgba(240,230,211,.55);margin-top:2.4em;opacity:0;animation:fadeUp 1.4s ease-out 3.6s forwards}.cta{position:absolute;bottom:5%;left:50%;transform:translateX(-50%);font-family:var(--sans);font-size:clamp(9px,1.6vw,13px);letter-spacing:.3em;text-transform:uppercase;color:rgba(255,255,255,.45);z-index:3;opacity:0;animation:fadeIn 1s ease-out 5.2s forwards}@keyframes fadeUp{from{opacity:0;transform:translateY(40px)}to{opacity:1;transform:translateY(0)}}@keyframes fadeIn{to{opacity:1}}
</style></head><body>
<div class="frame">
  <div class="silhouette"></div>
  <div class="content">
    <p class="quote">Some people are only<br>seen in pieces.<strong>The rest of them<br>remains invisible<br>even to<br>themselves.</strong></p>
    <p class="sub">Let yourself be whole</p>
  </div>
  <div class="cta">Follow · Be seen · fully</div>
</div></body></html>
