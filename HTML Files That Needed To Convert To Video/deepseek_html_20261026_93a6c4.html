<!-- SCENE 03 | DURATION: 9s | Theme: Stoicism | Hook: Open loop -->
<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8">
<title>Scene 03 — The obstacle is the way</title><style>
*{margin:0;padding:0;box-sizing:border-box}:root{--gold:#f5c542;--ice:#8ecae6;--soft:#f0e6d3;--font:'Georgia','Times New Roman',serif;--sans:'Helvetica Neue',Arial,sans-serif}html,body{height:100%;background:#000;overflow:hidden;display:flex;align-items:center;justify-content:center;font-family:var(--font)}.frame{position:relative;aspect-ratio:9/16;height:min(100vh,calc(100vw*16/9));width:min(100vw,calc(100vh*9/16));overflow:hidden;background:#0a0a0a;display:flex;align-items:center;justify-content:center;box-shadow:0 0 60px rgba(0,0,0,.6)}.bg{position:absolute;inset:0;z-index:0}.bg3{background:radial-gradient(ellipse at 50% 50%,#0a1a2e 0%,#050810 70%)}.bg-zoom{animation:bgZoom 14s ease-out forwards}@keyframes bgZoom{from{transform:scale(1)}to{transform:scale(1.18)}}.content{position:relative;z-index:2;padding:8% 10%;text-align:center;max-width:100%}.quote{font-size:clamp(28px,6.5vw,68px);line-height:1.15;font-weight:700;color:var(--soft);letter-spacing:.02em;text-wrap:balance}.quote em{font-style:italic}.sub{font-family:var(--sans);font-size:clamp(14px,2.8vw,28px);letter-spacing:.15em;text-transform:uppercase;color:rgba(240,230,211,.65);margin-top:1.2em;font-weight:400;line-height:1.5}.cta{position:absolute;bottom:6%;left:50%;transform:translateX(-50%);font-family:var(--sans);font-size:clamp(10px,1.8vw,16px);letter-spacing:.2em;text-transform:uppercase;color:rgba(255,255,255,.5);border:1px solid rgba(255,255,255,.15);padding:.7em 1.6em;border-radius:99px;white-space:nowrap;z-index:3;opacity:0}.a-up{animation:fadeUp 1.2s cubic-bezier(.22,.9,.3,1) forwards;opacity:0}.a-blur{animation:blurIn 1.4s ease-out forwards;opacity:0}.a-cta{animation:ctaPulse 2s ease-in-out infinite}.line{display:block;width:60px;height:2px;background:linear-gradient(90deg,transparent,var(--gold),transparent);margin:1.4em auto 0;transform-origin:center;transform:scaleX(0);animation:lineGrow .9s ease-out forwards}.medium{font-size:clamp(22px,5vw,48px);font-weight:700;line-height:1.2}.small{font-size:clamp(16px,3.5vw,30px);font-weight:400;line-height:1.4}.serif{font-family:var(--font)}.sans{font-family:var(--sans)}.gold{color:var(--gold)}.ice{color:var(--ice)}@keyframes fadeUp{from{opacity:0;transform:translateY(60px)}to{opacity:1;transform:translateY(0)}}@keyframes blurIn{from{opacity:0;filter:blur(16px)}to{opacity:1;filter:blur(0)}}@keyframes ctaPulse{0%,100%{opacity:.7;transform:translateX(-50%) scale(1)}50%{opacity:1;transform:translateX(-50%) scale(1.05)}}@keyframes lineGrow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
</style></head><body>
<div class="frame">
  <div class="bg bg3 bg-zoom"></div>
  <div class="content">
    <p class="quote medium serif a-blur" style="animation-duration:1.5s;">The obstacle<br>is not<br><em class="ice">in your way.</em></p>
    <p class="small sans a-up" style="animation-delay:1.8s;animation-duration:1s;color:rgba(240,230,211,.7);">The obstacle<br><span class="gold">is the way.</span></p>
    <div class="line" style="animation-delay:2.8s;"></div>
  </div>
  <div class="cta a-cta" style="animation-delay:4s;">STOIC RULE — FOLLOW FOR MORE</div>
</div></body></html>
