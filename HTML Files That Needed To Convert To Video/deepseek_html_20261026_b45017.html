<!-- SCENE 129 | DURATION: 9s | Theme: Power | Design: bold typographic grid -->
<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8">
<title>Scene 129 — Real power is quiet</title><style>
*{margin:0;padding:0;box-sizing:border-box}:root{--gold:#f5c542;--warm:#ff8a5c;--soft:#f0e6d3;--font:'Georgia','Times New Roman',serif;--sans:'Helvetica Neue',Arial,sans-serif}html,body{height:100%;background:#000;overflow:hidden;display:flex;align-items:center;justify-content:center;font-family:var(--font)}.frame{position:relative;aspect-ratio:9/16;height:min(100vh,calc(100vw*16/9));width:min(100vw,calc(100vh*9/16));overflow:hidden;background:linear-gradient(180deg,#0a0505 0%,#040202 100%);box-shadow:0 0 80px rgba(0,0,0,.9)}.h-lines{position:absolute;inset:0;background-image:repeating-linear-gradient(0deg,transparent 0,transparent 49px,rgba(245,197,66,.04) 49px,rgba(245,197,66,.04) 50px);z-index:0}.v-bar{position:absolute;left:6%;top:15%;bottom:15%;width:2px;background:linear-gradient(to bottom,var(--warm),transparent);z-index:1;opacity:0;animation:fadeIn 1.8s ease-out .3s forwards}.content{position:relative;z-index:2;padding:20% 12% 20% 18%;text-align:left;width:100%;overflow-wrap:break-word;word-wrap:break-word;hyphens:auto}.tag{font-family:var(--sans);font-size:clamp(9px,1.7vw,13px);letter-spacing:.4em;text-transform:uppercase;color:var(--warm);margin-bottom:1.4em;opacity:0;animation:fadeIn 1.2s ease-out .5s forwards}.quote{font-size:clamp(28px,6.5vw,66px);line-height:1.15;font-weight:900;color:var(--soft);text-transform:uppercase;letter-spacing:.01em;opacity:0;animation:fadeUp 1.6s cubic-bezier(.22,.9,.3,1) .7s forwards}.quote .accent{color:var(--warm);display:inline-block;position:relative}.sub{font-family:var(--sans);font-size:clamp(11px,2.2vw,18px);letter-spacing:.15em;line-height:1.8;text-transform:uppercase;color:rgba(240,230,211,.55);margin-top:2.4em;padding-left:1em;border-left:2px solid rgba(255,138,92,.5);opacity:0;animation:fadeUp 1.4s ease-out 3.2s forwards}.cta{position:absolute;bottom:5%;left:50%;transform:translateX(-50%);font-family:var(--sans);font-size:clamp(9px,1.6vw,13px);letter-spacing:.3em;text-transform:uppercase;color:rgba(255,255,255,.45);z-index:3;opacity:0;animation:fadeIn 1s ease-out 4.8s forwards}@keyframes fadeUp{from{opacity:0;transform:translateY(40px)}to{opacity:1;transform:translateY(0)}}@keyframes fadeIn{to{opacity:1}}
</style></head><body>
<div class="frame">
  <div class="h-lines"></div>
  <div class="v-bar"></div>
  <div class="content">
    <p class="tag">A hard truth</p>
    <p class="quote">Real<br>power<br>is <span class="accent">quiet.</span></p>
    <p class="sub">Loud is scared<br>Silent is sure</p>
  </div>
  <div class="cta">Follow · Dark motivation</div>
</div></body></html>
