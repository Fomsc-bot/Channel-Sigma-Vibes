<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8">
<title>Scene 139 — Outgrowing them is not betrayal</title><style>
*{margin:0;padding:0;box-sizing:border-box}:root{--gold:#f5c542;--soft:#f0e6d3;--font:'Georgia','Times New Roman',serif;--sans:'Helvetica Neue',Arial,sans-serif}html,body{height:100%;background:#000;overflow:hidden;display:flex;align-items:center;justify-content:center;font-family:var(--font)}.frame{position:relative;aspect-ratio:9/16;height:min(100vh,calc(100vw*16/9));width:min(100vw,calc(100vh*9/16));overflow:hidden;background:radial-gradient(circle at 50% 80%,#0a1008 0%,#020403 85%);box-shadow:0 0 80px rgba(0,0,0,.9)}.step{position:absolute;bottom:0;background:linear-gradient(to top,rgba(245,197,66,.15),transparent);border-top:1px solid rgba(245,197,66,.3);opacity:0;animation:rise 1.4s ease-out forwards}.st1{left:15%;width:20%;height:12%;animation-delay:.3s}.st2{left:28%;width:20%;height:22%;animation-delay:.6s}.st3{left:41%;width:20%;height:32%;animation-delay:.9s}.st4{left:54%;width:20%;height:42%;animation-delay:1.2s}.st5{left:67%;width:20%;height:52%;animation-delay:1.5s}@keyframes rise{from{opacity:0;transform:translateY(40px)}to{opacity:1;transform:translateY(0)}}.content{position:relative;z-index:2;padding:20% 12% 42%;text-align:center;width:100%;overflow-wrap:break-word;word-wrap:break-word;hyphens:auto}.quote{font-size:clamp(23px,5.3vw,52px);line-height:1.35;font-weight:400;color:var(--soft);font-style:italic;opacity:0;animation:fadeUp 1.8s cubic-bezier(.22,.9,.3,1) .7s forwards}.quote strong{color:var(--gold);font-style:normal;font-weight:700;display:block;margin-top:.4em}.sub{font-family:var(--sans);font-size:clamp(11px,2.2vw,18px);letter-spacing:.18em;line-height:1.8;text-transform:uppercase;color:rgba(240,230,211,.55);margin-top:2.4em;opacity:0;animation:fadeUp 1.4s ease-out 3.4s forwards}.cta{position:absolute;bottom:5%;left:50%;transform:translateX(-50%);font-family:var(--sans);font-size:clamp(9px,1.6vw,13px);letter-spacing:.3em;text-transform:uppercase;color:rgba(255,255,255,.45);z-index:3;opacity:0;animation:fadeIn 1s ease-out 5s forwards}@keyframes fadeUp{from{opacity:0;transform:translateY(40px)}to{opacity:1;transform:translateY(0)}}@keyframes fadeIn{to{opacity:1}}
</style><style id="reel-border-normalization">*,*::before,*::after{border:0!important;outline:0!important;box-shadow:none!important}html,body{width:100%!important;height:100%!important;margin:0!important;overflow:hidden!important}body>.frame{position:fixed!important;inset:0!important;width:100vw!important;height:100vh!important;max-width:none!important;max-height:none!important;aspect-ratio:auto!important;border-radius:0!important}</style></head><body>
<div class="frame">
