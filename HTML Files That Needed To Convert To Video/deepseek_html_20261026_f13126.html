<!-- SCENE 180 | DURATION: 9s | Theme: The exhaustion of caring | Design: tangled cords -->
<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8">
<title>Scene 180 — Empathy is not infinite</title><style>
*{margin:0;padding:0;box-sizing:border-box}:root{--gold:#f5c542;--soft:#f0e6d3;--font:'Georgia','Times New Roman',serif;--sans:'Helvetica Neue',Arial,sans-serif}html,body{height:100%;background:#000;overflow:hidden;display:flex;align-items:center;justify-content:center;font-family:var(--font)}.frame{position:relative;aspect-ratio:9/16;height:min(100vh,calc(100vw*16/9));width:min(100vw,calc(100vh*9/16));overflow:hidden;background:radial-gradient(circle at 50% 40%,#0a1410 0%,#010303 85%);box-shadow:0 0 80px rgba(0,0,0,.9)}.cord{position:absolute;border:1px solid rgba(245,197,66,.15);border-radius:50%;animation:sway 6s ease-in-out infinite}.co1{top:15%;left:20%;width:40%;height:15%;animation-delay:0s}.co2{top:25%;right:15%;width:35%;height:20%;animation-delay:-1.5s;border-color:rgba(245,197,66,.2)}.co3{bottom:25%;left:15%;width:50%;height:18%;animation-delay:-3s}.co4{bottom:15%;right:20%;width:30%;height:12%;animation-delay:-4.5s;border-color:rgba(245,197,66,.25)}@keyframes sway{0%,100%{transform:rotate(-2deg)}50%{transform:rotate(2deg)}}.content{position:relative;z-index:2;padding:20% 12%;text-align:center;width:100%;overflow-wrap:break-word;word-wrap:break-word;hyphens:auto}.quote{font-size:clamp(22px,5.1vw,50px);line-height:1.4;font-weight:400;color:var(--soft);font-style:italic;opacity:0;animation:fadeUp 1.8s cubic-bezier(.22,.9,.3,1) .7s forwards}.quote strong{color:var(--gold);font-style:normal;font-weight:700;display:block;margin-top:.4em}.sub{font-family:var(--sans);font-size:clamp(11px,2.2vw,18px);letter-spacing:.18em;line-height:1.8;text-transform:uppercase;color:rgba(240,230,211,.55);margin-top:2.4em;opacity:0;animation:fadeUp 1.4s ease-out 3.6s forwards}.cta{position:absolute;bottom:5%;left:50%;transform:translateX(-50%);font-family:var(--sans);font-size:clamp(9px,1.6vw,13px);letter-spacing:.3em;text-transform:uppercase;color:rgba(255,255,255,.45);z-index:3;opacity:0;animation:fadeIn 1s ease-out 5.2s forwards}@keyframes fadeUp{from{opacity:0;transform:translateY(40px)}to{opacity:1;transform:translateY(0)}}@keyframes fadeIn{to{opacity:1}}
</style><style id="reel-border-normalization">*,*::before,*::after{border-color:transparent!important;outline-color:transparent!important}.frame{box-shadow:none!important}</style></head><body>
<div class="frame">
  <div class="cord co1"></div><div class="cord co2"></div><div class="cord co3"></div><div class="cord co4"></div>
  <div class="content">
    <p class="quote">Empathy is not infinite.<strong>You can run out.<br>And running out<br>does not make<br>you cold —<br>it makes you<br>human.</strong></p>
    <p class="sub">Rest · refill</p>
  </div>
  <div class="cta">Follow · Protect your energy</div>
</div></body></html>
