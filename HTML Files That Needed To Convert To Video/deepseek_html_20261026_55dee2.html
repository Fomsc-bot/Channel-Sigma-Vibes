<!-- SCENE 147 | DURATION: 9s | Theme: The person you almost were | Design: parallel floating silhouettes -->
<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8">
<title>Scene 147 — The person you almost were</title><style>
*{margin:0;padding:0;box-sizing:border-box}:root{--gold:#f5c542;--soft:#f0e6d3;--font:'Georgia','Times New Roman',serif;--sans:'Helvetica Neue',Arial,sans-serif}html,body{height:100%;background:#000;overflow:hidden;display:flex;align-items:center;justify-content:center;font-family:var(--font)}.frame{position:relative;aspect-ratio:9/16;height:min(100vh,calc(100vw*16/9));width:min(100vw,calc(100vh*9/16));overflow:hidden;background:radial-gradient(circle at 50% 40%,#0a0616 0%,#020103 85%);box-shadow:0 0 80px rgba(0,0,0,.9)}.you{position:absolute;top:25%;left:30%;width:20%;aspect-ratio:.6;background:linear-gradient(180deg,rgba(245,197,66,.2),rgba(245,197,66,.02));border-radius:50% 50% 20% 20%/30% 30% 10% 10%;filter:blur(15px);animation:drift 6s ease-in-out infinite}.almost{position:absolute;top:25%;right:30%;width:20%;aspect-ratio:.6;background:linear-gradient(180deg,rgba(255,255,255,.15),rgba(255,255,255,.01));border-radius:50% 50% 20% 20%/30% 30% 10% 10%;filter:blur(15px);opacity:.5;animation:drift 6s ease-in-out infinite reverse}@keyframes drift{0%,100%{transform:translateY(0)}50%{transform:translateY(-15px)}}.content{position:relative;z-index:2;padding:20% 12%;text-align:center;width:100%;overflow-wrap:break-word;word-wrap:break-word;hyphens:auto}.quote{font-size:clamp(22px,5.1vw,50px);line-height:1.4;font-weight:400;color:var(--soft);font-style:italic;opacity:0;animation:fadeUp 1.8s cubic-bezier(.22,.9,.3,1) .7s forwards}.quote strong{color:var(--gold);font-style:normal;font-weight:700;display:block;margin-top:.4em}.sub{font-family:var(--sans);font-size:clamp(11px,2.2vw,18px);letter-spacing:.18em;line-height:1.8;text-transform:uppercase;color:rgba(240,230,211,.55);margin-top:2.4em;opacity:0;animation:fadeUp 1.4s ease-out 3.6s forwards}.cta{position:absolute;bottom:5%;left:50%;transform:translateX(-50%);font-family:var(--sans);font-size:clamp(9px,1.6vw,13px);letter-spacing:.3em;text-transform:uppercase;color:rgba(255,255,255,.45);z-index:3;opacity:0;animation:fadeIn 1s ease-out 5.2s forwards}@keyframes fadeUp{from{opacity:0;transform:translateY(40px)}to{opacity:1;transform:translateY(0)}}@keyframes fadeIn{to{opacity:1}}
</style><style id="reel-border-normalization">*,*::before,*::after{border:0!important;outline:0!important;box-shadow:none!important}html,body{width:100%!important;height:100%!important;margin:0!important;overflow:hidden!important}body>.frame{position:fixed!important;inset:0!important;width:100vw!important;height:100vh!important;max-width:none!important;max-height:none!important;aspect-ratio:auto!important;border-radius:0!important}</style></head><body>
<div class="frame">
  <div class="you"></div>
  <div class="almost"></div>
  <div class="content">
    <p class="quote">The person you<br>almost were<br>still exists —<strong>somewhere in the choices<br>you are still afraid<br>to make.</strong></p>
    <p class="sub">Make them</p>
  </div>
  <div class="cta">Follow · Choose the hard way</div>
</div></body></html>
