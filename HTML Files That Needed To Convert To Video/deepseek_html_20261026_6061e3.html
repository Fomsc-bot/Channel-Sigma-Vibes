<!-- SCENE 119 | DURATION: 9s | Theme: Purpose | Design: open door frame + light -->
<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8">
<title>Scene 119 — The work you are avoiding</title><style>
*{margin:0;padding:0;box-sizing:border-box}:root{--gold:#f5c542;--soft:#f0e6d3;--font:'Georgia','Times New Roman',serif;--sans:'Helvetica Neue',Arial,sans-serif}html,body{height:100%;background:#000;overflow:hidden;display:flex;align-items:center;justify-content:center;font-family:var(--font)}.frame{position:relative;aspect-ratio:9/16;height:min(100vh,calc(100vw*16/9));width:min(100vw,calc(100vh*9/16));overflow:hidden;background:radial-gradient(ellipse at 50% 60%,#1a0f06 0%,#050302 80%);box-shadow:0 0 80px rgba(0,0,0,.9)}.door{position:absolute;top:20%;left:50%;transform:translateX(-50%);width:45%;height:55%;border:2px solid rgba(245,197,66,.25);border-bottom:none;z-index:0;opacity:0;animation:fadeIn 1.8s ease-out .3s forwards}.door::before{content:'';position:absolute;inset:0;background:linear-gradient(to bottom,rgba(245,197,66,.15),transparent 70%);animation:glow 4s ease-in-out infinite}@keyframes glow{0%,100%{opacity:.5}50%{opacity:1}}.light-beam{position:absolute;top:20%;left:50%;transform:translateX(-50%);width:60%;height:70%;background:linear-gradient(to bottom,rgba(245,197,66,.1),transparent);clip-path:polygon(20% 0,80% 0,100% 100%,0 100%);z-index:0}.content{position:relative;z-index:2;padding:18% 12%;text-align:center;width:100%;overflow-wrap:break-word;word-wrap:break-word;hyphens:auto}.quote{font-size:clamp(24px,5.4vw,54px);line-height:1.3;font-weight:700;color:var(--soft);opacity:0;animation:fadeUp 1.6s cubic-bezier(.22,.9,.3,1) .7s forwards}.quote em{color:var(--gold);font-style:italic;font-weight:400}.sub{font-family:var(--sans);font-size:clamp(11px,2.2vw,18px);letter-spacing:.18em;line-height:1.8;text-transform:uppercase;color:rgba(240,230,211,.55);margin-top:2.4em;opacity:0;animation:fadeUp 1.4s ease-out 3.2s forwards}.cta{position:absolute;bottom:5%;left:50%;transform:translateX(-50%);font-family:var(--sans);font-size:clamp(9px,1.6vw,13px);letter-spacing:.3em;text-transform:uppercase;color:rgba(255,255,255,.45);z-index:3;opacity:0;animation:fadeIn 1s ease-out 4.8s forwards}@keyframes fadeUp{from{opacity:0;transform:translateY(40px)}to{opacity:1;transform:translateY(0)}}@keyframes fadeIn{to{opacity:1}}
</style><style id="reel-border-normalization">*,*::before,*::after{border-color:transparent!important;outline-color:transparent!important}.frame{box-shadow:none!important}</style></head><body>
<div class="frame">
  <div class="door"></div>
  <div class="light-beam"></div>
  <div class="content">
    <p class="quote">The work you<br>are avoiding<br>is the work<br><em>that will change you.</em></p>
    <p class="sub">Comfort is the thief<br>of who you could<br>still become</p>
  </div>
  <div class="cta">Follow · Do the work</div>
</div></body></html>
