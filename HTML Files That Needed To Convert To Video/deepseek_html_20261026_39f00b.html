<!-- SCENE 166 | DURATION: 9s | Theme: Healing is boring | Design: clock ticks -->
<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8">
<title>Scene 166 — Healing is not poetic</title><style>
*{margin:0;padding:0;box-sizing:border-box}:root{--gold:#f5c542;--soft:#f0e6d3;--font:'Georgia','Times New Roman',serif;--sans:'Helvetica Neue',Arial,sans-serif}html,body{height:100%;background:#000;overflow:hidden;display:flex;align-items:center;justify-content:center;font-family:var(--font)}.frame{position:relative;aspect-ratio:9/16;height:min(100vh,calc(100vw*16/9));width:min(100vw,calc(100vh*9/16));overflow:hidden;background:radial-gradient(circle at 50% 50%,#0c0a14 0%,#020204 85%);box-shadow:0 0 80px rgba(0,0,0,.9)}.tick{position:absolute;top:50%;left:50%;width:2px;height:4px;background:rgba(245,197,66,.3);transform-origin:0 -100px}.t1{transform:translate(-50%,-100px) rotate(0deg)}.t2{transform:translate(-50%,-100px) rotate(30deg)}.t3{transform:translate(-50%,-100px) rotate(60deg)}.t4{transform:translate(-50%,-100px) rotate(90deg)}.t5{transform:translate(-50%,-100px) rotate(120deg)}.t6{transform:translate(-50%,-100px) rotate(150deg)}.t7{transform:translate(-50%,-100px) rotate(180deg)}.t8{transform:translate(-50%,-100px) rotate(210deg)}.t9{transform:translate(-50%,-100px) rotate(240deg)}.t10{transform:translate(-50%,-100px) rotate(270deg)}.t11{transform:translate(-50%,-100px) rotate(300deg)}.t12{transform:translate(-50%,-100px) rotate(330deg)}.circle{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:200px;aspect-ratio:1;border:1px solid rgba(245,197,66,.1);border-radius:50%}.hand{position:absolute;top:50%;left:50%;width:1px;height:60px;background:linear-gradient(to top,var(--gold),transparent);transform-origin:bottom;transform:translate(-50%,-100%);animation:sweep 8s linear infinite}@keyframes sweep{to{transform:translate(-50%,-100%) rotate(360deg)}}.content{position:relative;z-index:2;padding:20% 12%;text-align:center;width:100%;overflow-wrap:break-word;word-wrap:break-word;hyphens:auto}.quote{font-size:clamp(22px,5.1vw,50px);line-height:1.4;font-weight:400;color:var(--soft);font-style:italic;opacity:0;animation:fadeUp 1.8s cubic-bezier(.22,.9,.3,1) .7s forwards}.quote strong{color:var(--gold);font-style:normal;font-weight:700;display:block;margin-top:.4em}.sub{font-family:var(--sans);font-size:clamp(11px,2.2vw,18px);letter-spacing:.18em;line-height:1.8;text-transform:uppercase;color:rgba(240,230,211,.55);margin-top:2.4em;opacity:0;animation:fadeUp 1.4s ease-out 3.6s forwards}.cta{position:absolute;bottom:5%;left:50%;transform:translateX(-50%);font-family:var(--sans);font-size:clamp(9px,1.6vw,13px);letter-spacing:.3em;text-transform:uppercase;color:rgba(255,255,255,.45);z-index:3;opacity:0;animation:fadeIn 1s ease-out 5.2s forwards}@keyframes fadeUp{from{opacity:0;transform:translateY(40px)}to{opacity:1;transform:translateY(0)}}@keyframes fadeIn{to{opacity:1}}
</style></head><body>
<div class="frame">
  <div class="circle"></div>
  <div class="tick t1"></div><div class="tick t2"></div><div class="tick t3"></div><div class="tick t4"></div><div class="tick t5"></div><div class="tick t6"></div><div class="tick t7"></div><div class="tick t8"></div><div class="tick t9"></div><div class="tick t10"></div><div class="tick t11"></div><div class="tick t12"></div>
  <div class="hand"></div>
  <div class="content">
    <p class="quote">Healing is not poetic.<strong>It is boring.<br>It is waking up<br>and choosing<br>the same small<br>kindness again.</strong></p>
    <p class="sub">Choose it · today</p>
  </div>
  <div class="cta">Follow · Small daily healing</div>
</div></body></html>
