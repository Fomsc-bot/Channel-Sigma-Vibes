<!-- SCENE 191 | DURATION: 9s | Theme: Being someone's second choice | Layout: centered quote, warm vertical gradient, gold accent bar -->
<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8">
<title>Scene 191 — Second choice</title><style>
*{margin:0;padding:0;box-sizing:border-box}:root{--gold:#f5c542;--soft:#f0e6d3;--font:'Georgia','Times New Roman',serif;--sans:'Helvetica Neue',Arial,sans-serif}html,body{height:100%;background:#000;overflow:hidden;display:flex;align-items:center;justify-content:center;font-family:var(--font)}.frame{position:relative;aspect-ratio:9/16;height:min(100vh,calc(100vw*16/9));width:min(100vw,calc(100vh*9/16));overflow:hidden;background:radial-gradient(ellipse at 50% 30%,#1a0e08 0%,#050201 80%);box-shadow:0 0 80px rgba(0,0,0,.9)}
.accent{position:absolute;top:8%;left:50%;transform:translateX(-50%);width:1px;height:40px;background:linear-gradient(to bottom,transparent,var(--gold));animation:growDown 1.4s ease-out .3s both}@keyframes growDown{from{height:0;opacity:0}to{height:40px;opacity:.7}}
.halo{position:absolute;top:50%;left:50%;width:70%;aspect-ratio:1;transform:translate(-50%,-50%);background:radial-gradient(circle,rgba(245,197,66,.08) 0%,transparent 60%);border-radius:50%;animation:breathe 7s ease-in-out infinite}@keyframes breathe{0%,100%{transform:translate(-50%,-50%) scale(.95);opacity:.6}50%{transform:translate(-50%,-50%) scale(1.15);opacity:1}}
.content{position:relative;z-index:2;display:flex;flex-direction:column;justify-content:center;align-items:center;height:100%;padding:16% 12% 20%;text-align:center;overflow-wrap:break-word;word-wrap:break-word;hyphens:auto}
.pre{font-family:var(--sans);font-size:clamp(10px,1.8vw,13px);letter-spacing:.4em;text-transform:uppercase;color:rgba(245,197,66,.7);margin-bottom:2em;opacity:0;animation:fadeDown 1.2s ease-out .5s forwards}
.quote{font-size:clamp(20px,5vw,48px);line-height:1.4;font-weight:400;color:var(--soft);font-style:italic;opacity:0;animation:fadeUp 1.8s cubic-bezier(.22,.9,.3,1) .8s forwards}
.quote strong{color:var(--gold);font-style:normal;font-weight:700;display:block;margin-top:.5em;font-size:1.05em}
.sub{font-family:var(--sans);font-size:clamp(10px,2vw,16px);letter-spacing:.2em;text-transform:uppercase;line-height:1.9;color:rgba(240,230,211,.55);margin-top:2.2em;opacity:0;animation:fadeUp 1.4s ease-out 3.4s forwards}
.cta{position:absolute;bottom:6%;left:50%;transform:translateX(-50%);font-family:var(--sans);font-size:clamp(9px,1.6vw,13px);letter-spacing:.3em;text-transform:uppercase;color:rgba(255,255,255,.45);z-index:3;opacity:0;animation:fadeIn 1s ease-out 5s forwards}
@keyframes fadeUp{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:translateY(0)}}
@keyframes fadeDown{from{opacity:0;transform:translateY(-15px)}to{opacity:1;transform:translateY(0)}}
@keyframes fadeIn{to{opacity:1}}
</style></head><body>
<div class="frame">
  <div class="accent"></div>
  <div class="halo"></div>
  <div class="content">
    <p class="pre">A quiet truth</p>
    <p class="quote">You were never<br>their first choice.<strong>You were the one<br>who stayed<br>when the first one<br>didn't.</strong></p>
    <p class="sub">That is not a love story</p>
  </div>
  <div class="cta">Follow · Know your worth</div>
</div></body></html>
