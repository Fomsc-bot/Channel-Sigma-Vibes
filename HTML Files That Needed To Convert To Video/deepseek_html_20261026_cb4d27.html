<!-- SCENE 143 | DURATION: 9s | Theme: Loneliness in a crowd | Design: scattered dots grid -->
<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8">
<title>Scene 143 — Lonely in a crowded room</title><style>
*{margin:0;padding:0;box-sizing:border-box}:root{--gold:#f5c542;--soft:#f0e6d3;--font:'Georgia','Times New Roman',serif;--sans:'Helvetica Neue',Arial,sans-serif}html,body{height:100%;background:#000;overflow:hidden;display:flex;align-items:center;justify-content:center;font-family:var(--font)}.frame{position:relative;aspect-ratio:9/16;height:min(100vh,calc(100vw*16/9));width:min(100vw,calc(100vh*9/16));overflow:hidden;background:radial-gradient(circle at 50% 50%,#0a0c18 0%,#010103 85%);box-shadow:0 0 80px rgba(0,0,0,.9)}.dot{position:absolute;width:6px;height:6px;border-radius:50%;background:rgba(245,197,66,.3);animation:pulse 4s ease-in-out infinite}.d1{top:15%;left:20%;animation-delay:0s}.d2{top:25%;left:35%;animation-delay:.3s}.d3{top:18%;left:55%;animation-delay:.6s}.d4{top:30%;left:75%;animation-delay:.9s}.d5{top:45%;left:15%;animation-delay:1.2s}.d6{top:50%;left:40%;animation-delay:1.5s}.d7{top:55%;left:65%;animation-delay:1.8s}.d8{top:40%;left:85%;animation-delay:2.1s}.d9{top:70%;left:25%;animation-delay:2.4s}.d10{top:75%;left:55%;animation-delay:2.7s}.d11{top:80%;left:80%;animation-delay:3s}.lonely{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:20px;height:20px;border-radius:50%;background:var(--gold);box-shadow:0 0 30px rgba(245,197,66,.8),0 0 60px rgba(245,197,66,.4);animation:glow 3s ease-in-out infinite;z-index:1}@keyframes pulse{0%,100%{opacity:.3;transform:scale(1)}50%{opacity:.7;transform:scale(1.4)}}@keyframes glow{0%,100%{transform:translate(-50%,-50%) scale(1)}50%{transform:translate(-50%,-50%) scale(1.3)}}.content{position:relative;z-index:2;padding:20% 12%;text-align:center;width:100%;overflow-wrap:break-word;word-wrap:break-word;hyphens:auto}.quote{font-size:clamp(22px,5.1vw,50px);line-height:1.4;font-weight:400;color:var(--soft);font-style:italic;opacity:0;animation:fadeUp 1.8s cubic-bezier(.22,.9,.3,1) .7s forwards}.quote strong{color:var(--gold);font-style:normal;font-weight:700;display:block;margin-top:.4em}.sub{font-family:var(--sans);font-size:clamp(11px,2.2vw,18px);letter-spacing:.18em;line-height:1.8;text-transform:uppercase;color:rgba(240,230,211,.55);margin-top:2.4em;opacity:0;animation:fadeUp 1.4s ease-out 3.6s forwards}.cta{position:absolute;bottom:5%;left:50%;transform:translateX(-50%);font-family:var(--sans);font-size:clamp(9px,1.6vw,13px);letter-spacing:.3em;text-transform:uppercase;color:rgba(255,255,255,.45);z-index:3;opacity:0;animation:fadeIn 1s ease-out 5.2s forwards}@keyframes fadeUp{from{opacity:0;transform:translateY(40px)}to{opacity:1;transform:translateY(0)}}@keyframes fadeIn{to{opacity:1}}
</style><style id="reel-border-normalization">*,*::before,*::after{border:0!important;outline:0!important;box-shadow:none!important}html,body{width:100%!important;height:100%!important;margin:0!important;overflow:hidden!important}body>.frame{position:fixed!important;inset:0!important;width:100vw!important;height:100vh!important;max-width:none!important;max-height:none!important;aspect-ratio:auto!important;border-radius:0!important}</style></head><body>
<div class="frame">
  <span class="dot d1"></span><span class="dot d2"></span><span class="dot d3"></span><span class="dot d4"></span><span class="dot d5"></span><span class="dot d6"></span><span class="dot d7"></span><span class="dot d8"></span><span class="dot d9"></span><span class="dot d10"></span><span class="dot d11"></span>
  <div class="lonely"></div>
  <div class="content">
    <p class="quote">The loneliest place<br>on earth<br>is being surrounded<br>by people who<br><strong>only know your name.</strong></p>
    <p class="sub">Being known &gt; being liked</p>
  </div>
  <div class="cta">Follow · Be truly known</div>
</div></body></html>
