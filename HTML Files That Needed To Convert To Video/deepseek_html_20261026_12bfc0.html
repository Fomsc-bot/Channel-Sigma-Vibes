<!-- SCENE 106 | DURATION: 9s | Theme: Loss / Permission | Design: vignette + soft light beam -->
<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8">
<title>Scene 106 — You are allowed to grieve</title><style>
*{margin:0;padding:0;box-sizing:border-box}:root{--gold:#f5c542;--soft:#f0e6d3;--font:'Georgia','Times New Roman',serif;--sans:'Helvetica Neue',Arial,sans-serif}html,body{height:100%;background:#000;overflow:hidden;display:flex;align-items:center;justify-content:center;font-family:var(--font)}.frame{position:relative;aspect-ratio:9/16;height:min(100vh,calc(100vw*16/9));width:min(100vw,calc(100vh*9/16));overflow:hidden;background:radial-gradient(ellipse at 50% 0%,#1a1005 0%,#050305 70%,#020202 100%);box-shadow:0 0 80px rgba(0,0,0,.9)}.beam{position:absolute;top:0;left:50%;transform:translateX(-50%);width:60%;height:100%;background:linear-gradient(to bottom,rgba(245,197,66,.12) 0%,transparent 60%);clip-path:polygon(35% 0,65% 0,100% 100%,0 100%);z-index:0;opacity:0;animation:fadeIn 3s ease-out .5s forwards}.vignette{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 50%,transparent 40%,rgba(0,0,0,.7) 100%);z-index:1;pointer-events:none}.content{position:relative;z-index:2;padding:16% 12%;text-align:center;width:100%;overflow-wrap:break-word;word-wrap:break-word;hyphens:auto}.quote{font-size:clamp(22px,5.2vw,52px);line-height:1.4;font-weight:400;color:var(--soft);font-style:italic;letter-spacing:.005em;opacity:0;animation:fadeUp 1.6s cubic-bezier(.22,.9,.3,1) .8s forwards}.quote strong{color:var(--gold);font-weight:700;font-style:normal;display:inline-block;opacity:0;animation:fadeUp 1.2s ease-out 2.2s forwards}.sub{font-family:var(--sans);font-size:clamp(12px,2.4vw,20px);letter-spacing:.15em;line-height:1.8;text-transform:uppercase;color:rgba(240,230,211,.55);margin-top:2.2em;opacity:0;animation:fadeUp 1.4s ease-out 3.4s forwards}.small{font-family:var(--sans);font-size:clamp(10px,1.9vw,15px);letter-spacing:.2em;text-transform:uppercase;color:rgba(245,197,66,.6);margin-top:1.4em;opacity:0;animation:fadeIn 1.2s ease-out 4.4s forwards}.cta{position:absolute;bottom:5%;left:50%;transform:translateX(-50%);font-family:var(--sans);font-size:clamp(9px,1.6vw,13px);letter-spacing:.3em;text-transform:uppercase;color:rgba(255,255,255,.45);z-index:3;opacity:0;animation:fadeIn 1s ease-out 5.5s forwards}@keyframes fadeUp{from{opacity:0;transform:translateY(40px)}to{opacity:1;transform:translateY(0)}}@keyframes fadeIn{to{opacity:1}}
</style></head><body>
<div class="frame">
  <div class="beam"></div>
  <div class="vignette"></div>
  <div class="content">
    <p class="quote">You are allowed to grieve<br>the future you never got.<br><strong>Then you are allowed<br>to build a new one.</strong></p>
    <p class="sub">Both are holy</p>
    <p class="small">— permission, granted</p>
  </div>
  <div class="cta">Follow · Rebuild</div>
</div></body></html>
