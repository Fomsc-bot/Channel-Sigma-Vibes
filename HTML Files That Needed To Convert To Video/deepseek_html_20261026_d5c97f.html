<!-- SCENE 130 | DURATION: 9s | Theme: Change | Design: broken mirror shards -->
<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8">
<title>Scene 130 — Nobody is coming to rewrite your script</title><style>
*{margin:0;padding:0;box-sizing:border-box}:root{--gold:#f5c542;--soft:#f0e6d3;--font:'Georgia','Times New Roman',serif;--sans:'Helvetica Neue',Arial,sans-serif}html,body{height:100%;background:#000;overflow:hidden;display:flex;align-items:center;justify-content:center;font-family:var(--font)}.frame{position:relative;aspect-ratio:9/16;height:min(100vh,calc(100vw*16/9));width:min(100vw,calc(100vh*9/16));overflow:hidden;background:radial-gradient(circle at 40% 30%,#141018 0%,#030205 85%);box-shadow:0 0 80px rgba(0,0,0,.9)}.shard{position:absolute;background:linear-gradient(135deg,rgba(245,197,66,.06),transparent);border:1px solid rgba(245,197,66,.1);z-index:0;opacity:0;animation:fadeIn 2s ease-out forwards}.sh1{top:5%;left:10%;width:80px;height:120px;transform:rotate(15deg);animation-delay:.3s;clip-path:polygon(0 0,100% 20%,85% 100%,10% 90%)}.sh2{top:60%;right:5%;width:100px;height:80px;transform:rotate(-10deg);animation-delay:.7s;clip-path:polygon(20% 0,100% 30%,90% 100%,0 70%)}.sh3{bottom:15%;left:5%;width:60px;height:90px;transform:rotate(8deg);animation-delay:1.1s;clip-path:polygon(0 10%,100% 0,90% 90%,15% 100%)}.sh4{top:20%;right:15%;width:70px;height:100px;transform:rotate(-5deg);animation-delay:1.5s;clip-path:polygon(10% 0,100% 15%,80% 100%,0 80%)}.halo{position:absolute;top:50%;left:50%;width:70%;aspect-ratio:1;transform:translate(-50%,-50%);background:radial-gradient(circle,rgba(245,197,66,.08) 0%,transparent 60%);border-radius:50%;animation:breathe 7s ease-in-out infinite}@keyframes breathe{0%,100%{transform:translate(-50%,-50%) scale(1)}50%{transform:translate(-50%,-50%) scale(1.15)}}.content{position:relative;z-index:2;padding:20% 12%;text-align:center;width:100%;overflow-wrap:break-word;word-wrap:break-word;hyphens:auto}.quote{font-size:clamp(22px,5.1vw,50px);line-height:1.35;font-weight:400;color:var(--soft);font-style:italic;opacity:0;animation:fadeUp 1.8s cubic-bezier(.22,.9,.3,1) .7s forwards}.quote strong{color:var(--gold);font-style:normal;font-weight:700;display:block;margin-top:.4em;text-transform:uppercase;letter-spacing:.05em;font-size:1.05em}.sub{font-family:var(--sans);font-size:clamp(11px,2.2vw,18px);letter-spacing:.18em;line-height:1.8;text-transform:uppercase;color:rgba(240,230,211,.55);margin-top:2.4em;opacity:0;animation:fadeUp 1.4s ease-out 3.4s forwards}.cta{position:absolute;bottom:5%;left:50%;transform:translateX(-50%);font-family:var(--sans);font-size:clamp(9px,1.6vw,13px);letter-spacing:.3em;text-transform:uppercase;color:rgba(255,255,255,.45);z-index:3;opacity:0;animation:fadeIn 1s ease-out 5s forwards}@keyframes fadeUp{from{opacity:0;transform:translateY(40px)}to{opacity:1;transform:translateY(0)}}@keyframes fadeIn{to{opacity:1}}
</style><style id="reel-border-normalization">*,*::before,*::after{border:0!important;outline:0!important;box-shadow:none!important}html,body{width:100%!important;height:100%!important;margin:0!important;overflow:hidden!important}body>.frame{position:fixed!important;inset:0!important;width:100vw!important;height:100vh!important;max-width:none!important;max-height:none!important;aspect-ratio:auto!important;border-radius:0!important}</style></head><body>
<div class="frame">
  <div class="shard sh1"></div><div class="shard sh2"></div><div class="shard sh3"></div><div class="shard sh4"></div>
  <div class="halo"></div>
  <div class="content">
    <p class="quote">Nobody is coming<br>to rewrite<br>your script.<strong>Pick up the pen.</strong></p>
    <p class="sub">You are the author</p>
  </div>
  <div class="cta">Follow · Write your story</div>
</div></body></html>
