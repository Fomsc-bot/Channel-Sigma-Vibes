<!-- SCENE 141 | DURATION: 9s | Theme: Unsent words | Design: torn paper edges -->
<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8">
<title>Scene 141 — The things we never said</title><style>
*{margin:0;padding:0;box-sizing:border-box}:root{--gold:#f5c542;--soft:#f0e6d3;--font:'Georgia','Times New Roman',serif;--sans:'Helvetica Neue',Arial,sans-serif}html,body{height:100%;background:#000;overflow:hidden;display:flex;align-items:center;justify-content:center;font-family:var(--font)}.frame{position:relative;aspect-ratio:9/16;height:min(100vh,calc(100vw*16/9));width:min(100vw,calc(100vh*9/16));overflow:hidden;background:radial-gradient(circle at 50% 50%,#120c08 0%,#020101 85%);box-shadow:0 0 80px rgba(0,0,0,.9)}.paper{position:absolute;top:20%;left:15%;right:15%;bottom:25%;background:rgba(245,197,66,.02);border:1px solid rgba(245,197,66,.1);z-index:0;animation:fadeIn 2s ease-out .3s both;opacity:0}.paper::before{content:'';position:absolute;top:-1px;left:0;right:0;height:6px;background:linear-gradient(90deg,transparent 0%,rgba(245,197,66,.15) 20%,transparent 40%,rgba(245,197,66,.15) 60%,transparent 80%,rgba(245,197,66,.15) 100%)}.pen{position:absolute;bottom:28%;right:16%;width:80%;height:1px;background:linear-gradient(90deg,transparent,rgba(245,197,66,.4),transparent);transform-origin:right;transform:scaleX(0);animation:write 3s ease-out 1s forwards}@keyframes write{to{transform:scaleX(1)}}.content{position:relative;z-index:2;padding:25% 18% 30%;text-align:center;width:100%;overflow-wrap:break-word;word-wrap:break-word;hyphens:auto}.quote{font-size:clamp(22px,5.1vw,50px);line-height:1.4;font-weight:400;color:var(--soft);font-style:italic;opacity:0;animation:fadeUp 1.8s cubic-bezier(.22,.9,.3,1) .7s forwards}.quote strong{color:var(--gold);font-style:normal;font-weight:700;display:block;margin-top:.4em}.sub{font-family:var(--sans);font-size:clamp(11px,2.2vw,18px);letter-spacing:.18em;line-height:1.8;text-transform:uppercase;color:rgba(240,230,211,.55);margin-top:2.4em;opacity:0;animation:fadeUp 1.4s ease-out 3.4s forwards}.cta{position:absolute;bottom:5%;left:50%;transform:translateX(-50%);font-family:var(--sans);font-size:clamp(9px,1.6vw,13px);letter-spacing:.3em;text-transform:uppercase;color:rgba(255,255,255,.45);z-index:3;opacity:0;animation:fadeIn 1s ease-out 5s forwards}@keyframes fadeUp{from{opacity:0;transform:translateY(40px)}to{opacity:1;transform:translateY(0)}}@keyframes fadeIn{to{opacity:1}}
</style></head><body>
<div class="frame">
  <div class="paper"></div>
  <div class="pen"></div>
  <div class="content">
    <p class="quote">The things we never said<br>do not die.<br>They become the silence<br>we bring to <strong>everyone else.</strong></p>
    <p class="sub">Say it · now</p>
  </div>
  <div class="cta">Follow · Say the unsaid</div>
</div></body></html>
