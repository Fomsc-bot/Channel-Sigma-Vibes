*{margin:0;padding:0;box-sizing:border-box}:root{--gold:#f5c542;--soft:#f0e6d3;--font:'Georgia','Times New Roman',serif;--sans:'Helvetica Neue',Arial,sans-serif}html,body{height:100%;background:#000;overflow:hidden;display:flex;align-items:center;justify-content:center;font-family:var(--font)}.frame{position:relative;aspect-ratio:9/16;height:min(100vh,calc(100vw*16/9));width:min(100vw,calc(100vh*9/16));overflow:hidden;background:linear-gradient(160deg,#0a0605 0%,#150a05 100%);box-shadow:0 0 80px rgba(0,0,0,.9)}.vline{position:absolute;left:50%;top:0;bottom:0;width:1px;background:linear-gradient(to bottom,transparent,rgba(245,197,66,.2) 30%,rgba(245,197,66,.2) 70%,transparent);z-index:0}.bignum{position:absolute;font-family:var(--font);font-size:clamp(120px,30vw,240px);font-weight:700;color:rgba(245,197,66,.06);line-height:1;z-index:0}.n1{top:8%;left:-4%}.n2{bottom:6%;right:-4%}.content{position:relative;z-index:2;padding:18% 12%;text-align:center;width:100%;overflow-wrap:break-word;word-wrap:break-word;hyphens:auto}.quote{font-size:clamp(26px,6vw,60px);line-height:1.2;font-weight:900;color:var(--soft);letter-spacing:.01em;text-transform:uppercase;opacity:0;animation:fadeUp 1.6s cubic-bezier(.22,.9,.3,1) .7s forwards}.quote .dim{color:rgba(240,230,211,.35);font-weight:400}.quote .gold{color:var(--gold);position:relative;display:inline-block;opacity:0;animation:fadeUp 1.2s ease-out 2s forwards}.sub{font-family:var(--sans);font-size:clamp(12px,2.3vw,19px);letter-spacing:.2em;text-transform:uppercase;line-height:1.8;color:rgba(240,230,211,.55);margin-top:2.4em;opacity:0;animation:fadeUp 1.4s ease-out 3s forwards}.dots{display:flex;justify-content:center;gap:6px;margin-top:1.6em;opacity:0;animation:fadeIn 1.2s ease-out 3.8s forwards}.dots span{width:5px;height:5px;background:var(--gold);border-radius:50%;opacity:.5}.dots span:nth-child(2){opacity:.75}.dots span:nth-child(3){opacity:1;box-shadow:0 0 8px var(--gold)}.cta{position:absolute;bottom:5%;left:50%;transform:trans
