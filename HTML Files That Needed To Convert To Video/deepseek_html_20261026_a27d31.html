<!-- SCENE 64 | DURATION: 8s | Theme: Boundaries | Hook: Bold claim — "Saying no" -->
<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8">
<title>Scene 64 — Saying no is saying yes</title><style>
*{margin:0;padding:0;box-sizing:border-box}:root{--gold:#f5c542;--rose:#ff6b8a;--soft:#f0e6d3;--font:'Georgia','Times New Roman',serif;--sans:'Helvetica Neue',Arial,sans-serif}html,body{height:100%;background:#000;overflow:hidden;display:flex;align-items:center;justify-content:center;font-family:var(--font)}.frame{position:relative;aspect-ratio:9/16;height:min(100vh,calc(100vw*16/9));width:min(100vw,calc(100vh*9/16));overflow:hidden;background:#0a0a0a;display:flex;align-items:center;justify-content:center;box-shadow:0 0 60px rgba(0,0,0,.6)}.bg{position:absolute;inset:0;z-index:0}.bg4{background:radial-gradient(ellipse at 20% 70%,#1e0a1e 0%,#050510 70%)}.bg-zoom{animation:bgZoom 16s ease-out forwards}@keyframes bgZoom{from{transform:scale(1)}to{transform:scale(1.16)}}.content{position:relative;z-index:2;padding:9% 8%;text-align:center;width:100%;overflow-wrap:break-word;word-wrap:break-word;hyphens:auto}.quote{font-size:clamp(26px,6vw,62px);line-height:1.2;font-weight:700;color:var(--soft);letter-spacing:.02em}.quote em{font-style:italic;color:var(--gold)}.sub{font-family:var(--sans);font-size:clamp(13px,2.6vw,24px);letter-spacing:.14em;text-transform:uppercase;color:rgba(240,230,211,.65);margin-top:1.2em;font-weight:400;line-height:1.6}.cta{position:absolute;bottom:5.5%;left:50%;transform:translateX(-50%);font-family:var(--sans);font-size:clamp(9px,1.7vw,14px);letter-spacing:.2em;text-transform:uppercase;color:rgba(255,255,255,.5);border:1px solid rgba(255,255,255,.15);padding:.7em 1.4em;border-radius:99px;white-space:nowrap;z-index:3;opacity:0}.cta-solid{background:var(--gold);color:#0a0a0a;border:none;font-weight:800;box-shadow:0 0 30px rgba(245,197,66,.35)}.a-up{animation:fadeUp 1.2s cubic-bezier(.22,.9,.3,1) forwards;opacity:0}.a-clip-down{animation:clipRevealDown 1.2s cubic-bezier(.77,0,.18,1) forwards}.a-cta{animation:ctaPulse 2s ease-in-out infinite}.big{font-size:clamp(30px,7vw,68px);font-weight:900;line-height:1.1}.sans{font-family:var(--sans)}.uppercase{text-transform:uppercase;letter-spacing:.1em}.rose{color:var(--rose)}@keyframes clipRevealDown{from{clip-path:inset(0 0 100% 0)}to{clip-path:inset(0 0 0 0)}}@keyframes fadeUp{from{opacity:0;transform:translateY(50px)}to{opacity:1;transform:translateY(0)}}@keyframes ctaPulse{0%,100%{opacity:.7;transform:translateX(-50%) scale(1)}50%{opacity:1;transform:translateX(-50%) scale(1.05)}}
</style></head><body>
<div class="frame">
  <div class="bg bg4 bg-zoom"></div>
  <div class="content">
    <p class="quote big sans uppercase a-clip-down" style="animation-duration:1.1s;">EVERY<br><span class="rose">"NO"</span><br>IS A<br>"YES"<br>TO YOURSELF.</p>
    <p class="sub a-up" style="animation-delay:1.8s;">Boundaries are not walls.<br>They are doors<br>with your name on them.</p>
  </div>
  <div class="cta cta-solid a-cta" style="animation-delay:3.6s;">FOLLOW — PROTECT YOUR PEACE</div>
</div></body></html>
