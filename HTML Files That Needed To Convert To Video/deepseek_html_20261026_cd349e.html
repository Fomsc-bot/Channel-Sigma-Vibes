<!-- SCENE 186 | DURATION: 9s | Theme: Wanting to be chosen | Design: single flower petal -->
<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8">
<title>Scene 186 — Stop auditioning to be loved</title><style>
*{margin:0;padding:0;box-sizing:border-box}:root{--gold:#f5c542;--rose:#ff6b8a;--soft:#f0e6d3;--font:'Georgia','Times New Roman',serif;--sans:'Helvetica Neue',Arial,sans-serif}html,body{height:100%;background:#000;overflow:hidden;display:flex;align-items:center;justify-content:center;font-family:var(--font)}.frame{position:relative;aspect-ratio:9/16;height:min(100vh,calc(100vw*16/9));width:min(100vw,calc(100vh*9/16));overflow:hidden;background:radial-gradient(circle at 50% 40%,#160a14 0%,#030102 85%);box-shadow:0 0 80px rgba(0,0,0,.9)}.petal{position:absolute;top:25%;left:50%;transform:translateX(-50%);width:3px;height:40px;background:linear-gradient(to bottom,rgba(255,107,138,.5),transparent);border-radius:50%;animation:sway 4s ease-in-out infinite}.petal::before{content:'';position:absolute;top:-5px;left:-8px;width:20px;height:20px;border-radius:50% 0 50% 50%;background:radial-gradient(circle,rgba(255,107,138,.4),transparent);transform:rotate(-30deg)}@keyframes sway{0%,100%{transform:translateX(-50%) rotate(-2deg)}50%{transform:translateX(-50%) rotate(2deg)}}.content{position:relative;z-index:2;padding:20% 12%;text-align:center;width:100%;overflow-wrap:break-word;word-wrap:break-word;hyphens:auto}.quote{font-size:clamp(22px,5.1vw,50px);line-height:1.4;font-weight:400;color:var(--soft);font-style:italic;opacity:0;animation:fadeUp 1.8s cubic-bezier(.22,.9,.3,1) .7s forwards}.quote strong{color:var(--rose);font-style:normal;font-weight:700;display:block;margin-top:.4em}.sub{font-family:var(--sans);font-size:clamp(11px,2.2vw,18px);letter-spacing:.18em;line-height:1.8;text-transform:uppercase;color:rgba(240,230,211,.55);margin-top:2.4em;opacity:0;animation:fadeUp 1.4s ease-out 3.6s forwards}.cta{position:absolute;bottom:5%;left:50%;transform:translateX(-50%);font-family:var(--sans);font-size:clamp(9px,1.6vw,13px);letter-spacing:.3em;text-transform:uppercase;color:rgba(255,255,255,.45);z-index:3;opacity:0;animation:fadeIn 1s ease-out 5.2s forwards}@keyframes fadeUp{from{opacity:0;transform:translateY(40px)}to{opacity:1;transform:translateY(0)}}@keyframes fadeIn{to{opacity:1}}
</style><style id="reel-border-normalization">*,*::before,*::after{border:0!important;outline:0!important;box-shadow:none!important}html,body{width:100%!important;height:100%!important;margin:0!important;overflow:hidden!important}body>.frame{position:fixed!important;inset:0!important;width:100vw!important;height:100vh!important;max-width:none!important;max-height:none!important;aspect-ratio:auto!important;border-radius:0!important}</style></head><body>
<div class="frame">
  <div class="petal"></div>
  <div class="content">
    <p class="quote">Stop auditioning<br>to be loved.<strong>The people who<br>are meant for you<br>never needed<br>a performance.</strong></p>
    <p class="sub">Just be · you</p>
  </div>
  <div class="cta">Follow · Real love daily</div>
</div></body></html>
