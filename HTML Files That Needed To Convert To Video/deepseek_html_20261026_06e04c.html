<!-- SCENE 121 | DURATION: 9s | Theme: Disappointment | Design: falling numbers -->
<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8">
<title>Scene 121 — Silence is the best response</title><style>
*{margin:0;padding:0;box-sizing:border-box}:root{--gold:#f5c542;--warm:#ff8a5c;--soft:#f0e6d3;--font:'Georgia','Times New Roman',serif;--sans:'Helvetica Neue',Arial,sans-serif}html,body{height:100%;background:#000;overflow:hidden;display:flex;align-items:center;justify-content:center;font-family:var(--font)}.frame{position:relative;aspect-ratio:9/16;height:min(100vh,calc(100vw*16/9));width:min(100vw,calc(100vh*9/16));overflow:hidden;background:radial-gradient(ellipse at 50% 40%,#0a0305 0%,#040102 80%);box-shadow:0 0 80px rgba(0,0,0,.9)}.num{position:absolute;font-family:var(--font);font-size:clamp(60px,12vw,110px);font-weight:700;color:rgba(255,138,92,.06);line-height:1;z-index:0;animation:fall 10s linear infinite}.n1{top:-10%;left:10%;animation-delay:0s}.n2{top:-20%;right:15%;animation-delay:2s}.n3{top:-5%;left:50%;animation-delay:4s}.n4{top:-15%;left:25%;animation-delay:6s}.n5{top:-8%;right:35%;animation-delay:8s}@keyframes fall{0%{transform:translateY(0) rotate(0)}100%{transform:translateY(130vh) rotate(90deg)}}.halo{position:absolute;top:50%;left:50%;width:60%;aspect-ratio:1;transform:translate(-50%,-50%);background:radial-gradient(circle,rgba(255,138,92,.1) 0%,transparent 60%);border-radius:50%;animation:breathe 7s ease-in-out infinite}@keyframes breathe{0%,100%{transform:translate(-50%,-50%) scale(1)}50%{transform:translate(-50%,-50%) scale(1.2)}}.content{position:relative;z-index:2;padding:18% 12%;text-align:center;width:100%;overflow-wrap:break-word;word-wrap:break-word;hyphens:auto}.quote{font-size:clamp(28px,6.5vw,66px);line-height:1.15;font-weight:900;color:var(--soft);text-transform:uppercase;letter-spacing:.02em;opacity:0;animation:fadeUp 1.6s cubic-bezier(.22,.9,.3,1) .7s forwards}.quote .warm{color:var(--warm);display:block}.sub{font-family:var(--sans);font-size:clamp(11px,2.2vw,18px);letter-spacing:.2em;text-transform:uppercase;line-height:1.8;color:rgba(240,230,211,.5);margin-top:2.4em;opacity:0;animation:fadeUp 1.4s ease-out 3s forwards}.cta{position:absolute;bottom:5%;left:50%;transform:translateX(-50%);font-family:var(--sans);font-size:clamp(9px,1.6vw,13px);letter-spacing:.3em;text-transform:uppercase;color:rgba(255,255,255,.45);z-index:3;opacity:0;animation:fadeIn 1s ease-out 4.8s forwards}@keyframes fadeUp{from{opacity:0;transform:translateY(40px)}to{opacity:1;transform:translateY(0)}}@keyframes fadeIn{to{opacity:1}}
</style></head><body>
<div class="frame">
  <span class="num n1">0</span><span class="num n2">1</span><span class="num n3">0</span><span class="num n4">1</span><span class="num n5">0</span>
  <div class="halo"></div>
  <div class="content">
    <p class="quote">They<br><span class="warm">laughed.</span><br>Now<br>watch.</p>
    <p class="sub">Silence is the best<br>response</p>
  </div>
  <div class="cta">Follow · Dark motivation</div>
</div></body></html>
