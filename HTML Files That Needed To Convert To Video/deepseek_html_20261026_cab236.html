<!-- SCENE 175 | DURATION: 9s | Theme: The one who broke you open | Design: light through a crack -->
<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8">
<title>Scene 175 — The person who broke you open</title><style>
*{margin:0;padding:0;box-sizing:border-box}:root{--gold:#f5c542;--soft:#f0e6d3;--font:'Georgia','Times New Roman',serif;--sans:'Helvetica Neue',Arial,sans-serif}html,body{height:100%;background:#000;overflow:hidden;display:flex;align-items:center;justify-content:center;font-family:var(--font)}.frame{position:relative;aspect-ratio:9/16;height:min(100vh,calc(100vw*16/9));width:min(100vw,calc(100vh*9/16));overflow:hidden;background:radial-gradient(circle at 50% 40%,#0e0e18 0%,#020205 85%);box-shadow:0 0 80px rgba(0,0,0,.9)}.crack{position:absolute;top:20%;left:30%;width:40%;height:60%;border:1px solid rgba(245,197,66,.1);border-radius:50% 50% 50% 50%/40% 40% 60% 60%;z-index:0}.crack::before{content:'';position:absolute;top:0;left:50%;width:1px;height:100%;background:linear-gradient(to bottom,transparent,rgba(245,197,66,.5),transparent);animation:light 3s ease-in-out infinite}@keyframes light{0%,100%{opacity:.3}50%{opacity:1}}.lightbeam{position:absolute;top:20%;left:50%;transform:translateX(-50%);width:80%;height:70%;background:linear-gradient(180deg,rgba(245,197,66,.15) 0%,transparent 80%);clip-path:polygon(48% 0,52% 0,100% 100%,0 100%);z-index:0;opacity:.7}.content{position:relative;z-index:2;padding:20% 12%;text-align:center;width:100%;overflow-wrap:break-word;word-wrap:break-word;hyphens:auto}.quote{font-size:clamp(22px,5.1vw,50px);line-height:1.4;font-weight:400;color:var(--soft);font-style:italic;opacity:0;animation:fadeUp 1.8s cubic-bezier(.22,.9,.3,1) .7s forwards}.quote strong{color:var(--gold);font-style:normal;font-weight:700;display:block;margin-top:.4em}.sub{font-family:var(--sans);font-size:clamp(11px,2.2vw,18px);letter-spacing:.18em;line-height:1.8;text-transform:uppercase;color:rgba(240,230,211,.55);margin-top:2.4em;opacity:0;animation:fadeUp 1.4s ease-out 3.6s forwards}.cta{position:absolute;bottom:5%;left:50%;transform:translateX(-50%);font-family:var(--sans);font-size:clamp(9px,1.6vw,13px);letter-spacing:.3em;text-transform:uppercase;color:rgba(255,255,255,.45);z-index:3;opacity:0;animation:fadeIn 1s ease-out 5.2s forwards}@keyframes fadeUp{from{opacity:0;transform:translateY(40px)}to{opacity:1;transform:translateY(0)}}@keyframes fadeIn{to{opacity:1}}
</style></head><body>
<div class="frame">
  <div class="crack"></div>
  <div class="lightbeam"></div>
  <div class="content">
    <p class="quote">Some people are not<br>meant to stay.<strong>They are meant<br>to break you open<br>enough to let<br>the light in.</strong></p>
    <p class="sub">Thank them · release them</p>
  </div>
  <div class="cta">Follow · Let the light in</div>
</div></body></html>
