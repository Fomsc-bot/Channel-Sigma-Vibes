<!-- SCENE 32 | DURATION: 7s | Theme: Love / Moving on | Hook: Visual shock -->
<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8">
<title>Scene 32 — A season, not your life</title><style>
*{margin:0;padding:0;box-sizing:border-box}:root{--gold:#f5c542;--rose:#ff6b8a;--soft:#f0e6d3;--font:'Georgia','Times New Roman',serif;--sans:'Helvetica Neue',Arial,sans-serif}html,body{height:100%;background:#000;overflow:hidden;display:flex;align-items:center;justify-content:center;font-family:var(--font)}.frame{position:relative;aspect-ratio:9/16;height:min(100vh,calc(100vw*16/9));width:min(100vw,calc(100vh*9/16));overflow:hidden;background:#0a0a0a;display:flex;align-items:center;justify-content:center;box-shadow:0 0 60px rgba(0,0,0,.6)}.bg{position:absolute;inset:0;z-index:0}.bg4{background:radial-gradient(ellipse at 20% 70%,#1e0a1e 0%,#050510 70%)}.bg-zoom{animation:bgZoom 14s ease-out forwards}@keyframes bgZoom{from{transform:scale(1)}to{transform:scale(1.18)}}.content{position:relative;z-index:2;padding:8% 10%;text-align:center;max-width:100%}.quote{font-size:clamp(28px,6.5vw,68px);line-height:1.15;font-weight:700;color:var(--soft);letter-spacing:.02em;text-wrap:balance}.quote em{font-style:italic;color:var(--gold)}.cta{position:absolute;bottom:6%;left:50%;transform:translateX(-50%);font-family:var(--sans);font-size:clamp(10px,1.8vw,16px);letter-spacing:.2em;text-transform:uppercase;color:rgba(255,255,255,.5);border:1px solid rgba(255,255,255,.15);padding:.7em 1.6em;border-radius:99px;white-space:nowrap;z-index:3;opacity:0}.cta-solid{background:var(--gold);color:#0a0a0a;border:none;font-weight:800;box-shadow:0 0 30px rgba(245,197,66,.35)}.a-clip-down{animation:clipRevealDown 1.2s cubic-bezier(.77,0,.18,1) forwards}.a-cta{animation:ctaPulse 2s ease-in-out infinite}.big{font-size:clamp(36px,8vw,80px);font-weight:900;line-height:1.05}.serif{font-family:var(--font)}.rose{color:var(--rose)}@keyframes clipRevealDown{from{clip-path:inset(0 0 100% 0)}to{clip-path:inset(0 0 0 0)}}@keyframes ctaPulse{0%,100%{opacity:.7;transform:translateX(-50%) scale(1)}50%{opacity:1;transform:translateX(-50%) scale(1.05)}}
</style><style id="reel-border-normalization">*,*::before,*::after{border-color:transparent!important;outline-color:transparent!important}.frame{box-shadow:none!important}</style></head><body>
<div class="frame">
  <div class="bg bg4 bg-zoom"></div>
  <div class="content">
    <p class="quote big serif a-clip-down" style="animation-duration:1.1s;">THEY<br>WERE<br><em class="rose">A SEASON.</em><br>NOT<br>YOUR LIFE.</p>
  </div>
  <div class="cta cta-solid a-cta" style="animation-delay:2.8s;">FOLLOW — HEAL AND MOVE</div>
</div></body></html>
