<!-- SCENE 160 | DURATION: 9s | Theme: Being someone's "almost" | Design: two parallel lines nearly touching -->
<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8">
<title>Scene 160 — Almost isn't love</title><style>
*{margin:0;padding:0;box-sizing:border-box}:root{--gold:#f5c542;--rose:#ff6b8a;--soft:#f0e6d3;--font:'Georgia','Times New Roman',serif;--sans:'Helvetica Neue',Arial,sans-serif}html,body{height:100%;background:#000;overflow:hidden;display:flex;align-items:center;justify-content:center;font-family:var(--font)}.frame{position:relative;aspect-ratio:9/16;height:min(100vh,calc(100vw*16/9));width:min(100vw,calc(100vh*9/16));overflow:hidden;background:radial-gradient(circle at 50% 40%,#1a0812 0%,#030102 85%);box-shadow:0 0 80px rgba(0,0,0,.9)}.pline{position:absolute;height:1px;background:linear-gradient(90deg,transparent,rgba(255,107,138,.3),transparent);z-index:0}.pl1{top:38%;left:10%;right:12%}.pl2{top:42%;left:12%;right:10%}.gap{position:absolute;top:40%;left:50%;transform:translate(-50%,-50%);font-family:var(--sans);font-size:clamp(10px,1.8vw,14px);letter-spacing:.4em;color:rgba(255,107,138,.6);z-index:1}.content{position:relative;z-index:2;padding:20% 12%;text-align:center;width:100%;overflow-wrap:break-word;word-wrap:break-word;hyphens:auto}.quote{font-size:clamp(22px,5.1vw,50px);line-height:1.4;font-weight:400;color:var(--soft);font-style:italic;opacity:0;animation:fadeUp 1.8s cubic-bezier(.22,.9,.3,1) .7s forwards}.quote strong{color:var(--rose);font-style:normal;font-weight:700;display:block;margin-top:.4em}.sub{font-family:var(--sans);font-size:clamp(11px,2.2vw,18px);letter-spacing:.18em;line-height:1.8;text-transform:uppercase;color:rgba(240,230,211,.55);margin-top:2.4em;opacity:0;animation:fadeUp 1.4s ease-out 3.6s forwards}.cta{position:absolute;bottom:5%;left:50%;transform:translateX(-50%);font-family:var(--sans);font-size:clamp(9px,1.6vw,13px);letter-spacing:.3em;text-transform:uppercase;color:rgba(255,255,255,.45);z-index:3;opacity:0;animation:fadeIn 1s ease-out 5.2s forwards}@keyframes fadeUp{from{opacity:0;transform:translateY(40px)}to{opacity:1;transform:translateY(0)}}@keyframes fadeIn{to{opacity:1}}
</style></head><body>
<div class="frame">
  <div class="pline pl1"></div>
  <div class="pline pl2"></div>
  <span class="gap">· · ·</span>
  <div class="content">
    <p class="quote">Being someone's<br>"almost" is not love.<strong>It is proximity<br>mimicking intimacy.<br>Do not confuse<br>the two.</strong></p>
    <p class="sub">Ask for the real thing</p>
  </div>
  <div class="cta">Follow · Real love daily</div>
</div></body></html>
