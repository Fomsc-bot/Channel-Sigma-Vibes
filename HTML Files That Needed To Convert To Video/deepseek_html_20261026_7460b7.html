<!-- SCENE 67 | DURATION: 7s | Theme: Change | Hook: Word stagger — "Nobody is coming to rescue you" -->
<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8">
<title>Scene 67 — Rewrite the script</title><style>
*{margin:0;padding:0;box-sizing:border-box}:root{--gold:#f5c542;--soft:#f0e6d3;--font:'Georgia','Times New Roman',serif;--sans:'Helvetica Neue',Arial,sans-serif}html,body{height:100%;background:#000;overflow:hidden;display:flex;align-items:center;justify-content:center;font-family:var(--font)}.frame{position:relative;aspect-ratio:9/16;height:min(100vh,calc(100vw*16/9));width:min(100vw,calc(100vh*9/16));overflow:hidden;background:#0a0a0a;display:flex;align-items:center;justify-content:center;box-shadow:0 0 60px rgba(0,0,0,.6)}.bg{position:absolute;inset:0;z-index:0}.bg2{background:radial-gradient(ellipse at 70% 80%,#2e0a0a 0%,#0a0505 70%)}.bg-zoom{animation:bgZoom 16s ease-out forwards}@keyframes bgZoom{from{transform:scale(1)}to{transform:scale(1.16)}}.content{position:relative;z-index:2;padding:9% 8%;text-align:center;width:100%;overflow-wrap:break-word;word-wrap:break-word;hyphens:auto}.quote{font-size:clamp(26px,6vw,62px);line-height:1.2;font-weight:700;color:var(--soft);letter-spacing:.02em}.cta{position:absolute;bottom:5.5%;left:50%;transform:translateX(-50%);font-family:var(--sans);font-size:clamp(9px,1.7vw,14px);letter-spacing:.2em;text-transform:uppercase;color:rgba(255,255,255,.5);border:1px solid rgba(255,255,255,.15);padding:.7em 1.4em;border-radius:99px;white-space:nowrap;z-index:3;opacity:0}.a-cta{animation:ctaPulse 2s ease-in-out infinite}.word{display:inline-block;opacity:0;animation:fadeUp .8s cubic-bezier(.22,.9,.3,1) forwards;animation-delay:calc(var(--i) * .18s + .2s)}.medium{font-size:clamp(22px,5vw,48px);font-weight:700;line-height:1.25}.sans{font-family:var(--sans)}.uppercase{text-transform:uppercase;letter-spacing:.1em}.gold{color:var(--gold)}.dim{color:rgba(240,230,211,.55)}@keyframes fadeUp{from{opacity:0;transform:translateY(50px)}to{opacity:1;transform:translateY(0)}}@keyframes ctaPulse{0%,100%{opacity:.7;transform:translateX(-50%) scale(1)}50%{opacity:1;transform:translateX(-50%) scale(1.05)}}
</style><style id="reel-border-normalization">*,*::before,*::after{border-color:transparent!important;outline-color:transparent!important}.frame{box-shadow:none!important}</style></head><body>
<div class="frame">
  <div class="bg bg2 bg-zoom"></div>
  <div class="content">
    <p class="quote medium sans uppercase">
      <span class="word" style="--i:0;">NOBODY</span><br>
      <span class="word" style="--i:1;">IS COMING</span><br>
      <span class="word gold" style="--i:2;">TO REWRITE</span><br>
      <span class="word" style="--i:3;">YOUR SCRIPT.</span><br>
      <span class="word dim" style="--i:4;font-size:.55em;">Pick up the pen.</span>
    </p>
  </div>
  <div class="cta a-cta" style="animation-delay:3.4s;">FOLLOW — WRITE YOUR STORY</div>
</div></body></html>
