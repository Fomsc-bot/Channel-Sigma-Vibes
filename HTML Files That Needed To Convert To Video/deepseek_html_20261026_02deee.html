<!-- SCENE 108 | DURATION: 9s | Theme: Love / Pain | Design: bleeding heart glow + drips -->
<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8">
<title>Scene 108 — Love should not hurt</title><style>
*{margin:0;padding:0;box-sizing:border-box}:root{--gold:#f5c542;--rose:#ff6b8a;--soft:#f0e6d3;--font:'Georgia','Times New Roman',serif;--sans:'Helvetica Neue',Arial,sans-serif}html,body{height:100%;background:#000;overflow:hidden;display:flex;align-items:center;justify-content:center;font-family:var(--font)}.frame{position:relative;aspect-ratio:9/16;height:min(100vh,calc(100vw*16/9));width:min(100vw,calc(100vh*9/16));overflow:hidden;background:radial-gradient(ellipse at 50% 30%,#2a040d 0%,#0a0205 85%);box-shadow:0 0 80px rgba(0,0,0,.9)}.glow{position:absolute;top:25%;left:50%;width:70%;aspect-ratio:1;transform:translate(-50%,-50%);background:radial-gradient(circle,rgba(255,107,138,.2) 0%,transparent 60%);border-radius:50%;animation:pulse 5s ease-in-out infinite}@keyframes pulse{0%,100%{opacity:.6;transform:translate(-50%,-50%) scale(1)}50%{opacity:1;transform:translate(-50%,-50%) scale(1.2)}}.drop{position:absolute;width:1px;height:60px;background:linear-gradient(to bottom,rgba(255,107,138,.6),transparent);animation:drop 4s ease-in infinite;opacity:0}.d1{top:30%;left:25%;animation-delay:1s}.d2{top:32%;right:28%;animation-delay:2.2s;height:80px}.d3{top:35%;left:48%;animation-delay:3s;height:40px}@keyframes drop{0%{opacity:0;transform:translateY(-20px)}20%{opacity:.7}100%{opacity:0;transform:translateY(60px)}}.content{position:relative;z-index:2;padding:16% 12%;text-align:center;width:100%;overflow-wrap:break-word;word-wrap:break-word;hyphens:auto}.quote{font-size:clamp(26px,6vw,60px);line-height:1.3;font-weight:700;color:var(--soft);opacity:0;animation:fadeUp 1.6s cubic-bezier(.22,.9,.3,1) .8s forwards}.quote em{font-style:italic;color:var(--rose);font-weight:400;font-size:.85em;display:block;margin-top:.3em}.sub{font-family:var(--sans);font-size:clamp(12px,2.4vw,20px);letter-spacing:.12em;line-height:1.8;color:rgba(240,230,211,.6);margin-top:2.2em;font-style:italic;opacity:0;animation:fadeUp 1.4s ease-out 2.8s forwards}.rule{display:flex;justify-content:center;align-items:center;gap:1em;margin-top:2em;opacity:0;animation:fadeIn 1.2s ease-out 3.4s forwards}.rule::before,.rule::after{content:'';width:30px;height:1px;background:rgba(255,107,138,.5)}.rule span{font-family:var(--sans);font-size:clamp(9px,1.7vw,13px);letter-spacing:.35em;text-transform:uppercase;color:var(--rose)}.cta{position:absolute;bottom:5%;left:50%;transform:translateX(-50%);font-family:var(--sans);font-size:clamp(9px,1.6vw,13px);letter-spacing:.3em;text-transform:uppercase;color:rgba(255,255,255,.5);z-index:3;opacity:0;animation:fadeIn 1s ease-out 4.8s forwards}@keyframes fadeUp{from{opacity:0;transform:translateY(40px)}to{opacity:1;transform:translateY(0)}}@keyframes fadeIn{to{opacity:1}}
</style></head><body>
<div class="frame">
  <div class="glow"></div>
  <span class="drop d1"></span><span class="drop d2"></span><span class="drop d3"></span>
  <div class="content">
    <p class="quote">Love should<br>not hurt.<em>If it hurts,<br>it is not love.<br>It is attachment.</em></p>
    <p class="sub">Do not confuse the two.<br>One will heal you.<br>The other will hollow you.</p>
    <div class="rule"><span>Know the difference</span></div>
  </div>
  <div class="cta">Follow · Honest love</div>
</div></body></html>
