<!-- SCENE 210 | DURATION: 9s | Theme: The story you are still writing | Layout: centered, top/bottom bands, generous safe zone -->
<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8">
<title>Scene 210 — The story is not over</title><style>
*{margin:0;padding:0;box-sizing:border-box}:root{--gold:#f5c542;--soft:#f0e6d3;--font:'Georgia','Times New Roman',serif;--sans:'Helvetica Neue',Arial,sans-serif}html,body{height:100%;background:#000;overflow:hidden;display:flex;align-items:center;justify-content:center;font-family:var(--font)}.frame{position:relative;aspect-ratio:9/16;height:min(100vh,calc(100vw*16/9));width:min(100vw,calc(100vh*9/16));overflow:hidden;background:radial-gradient(circle at 50% 40%,#140e08 0%,#030202 85%);box-shadow:0 0 80px rgba(0,0,0,.9)}
.top-band{position:absolute;top:8%;left:50%;transform:translateX(-50%);width:60%;height:1px;background:linear-gradient(90deg,transparent,rgba(245,197,66,.5),transparent);opacity:0;animation:fadeIn 1.4s ease-out .3s forwards}
.bottom-band{position:absolute;bottom:16%;left:50%;transform:translateX(-50%);width:60%;height:1px;background:linear-gradient(90deg,transparent,rgba(245,197,66,.5),transparent);opacity:0;animation:fadeIn 1.4s ease-out .6s forwards}
.quote-mark{position:absolute;bottom:22%;right:8%;font-family:var(--font);font-size:clamp(60px,14vw,120px);color:rgba(245,197,66,.08);line-height:1;font-weight:700;font-style:italic;z-index:0;animation:fadeIn 2s ease-out .5s both;opacity:0}
.content{position:relative;z-index:2;display:flex;flex-direction:column;justify-content:center;align-items:center;height:100%;padding:20% 12% 28%;text-align:center;overflow-wrap:break-word;word-wrap:break-word;hyphens:auto}
.quote{font-size:clamp(21px,5vw,48px);line-height:1.35;font-weight:700;color:var(--soft);opacity:0;animation:fadeUp 1.6s cubic-bezier(.22,.9,.3,1) .7s forwards}
.quote em{font-style:italic;color:var(--gold);font-weight:400;display:block;margin-top:.4em}
.sub{font-family:var(--sans);font-size:clamp(10px,2vw,16px);letter-spacing:.2em;text-transform:uppercase;line-height:1.9;color:rgba(240,230,211,.55);margin-top:2.2em;opacity:0;animation:fadeUp 1.4s ease-out 3.2s forwards}
.cta{position:absolute;bottom:6%;left:50%;transform:translateX(-50%);font-family:var(--sans);font-size:clamp(9px,1.6vw,13px);letter-spacing:.3em;text-transform:uppercase;color:rgba(255,255,255,.45);z-index:3;opacity:0;animation:fadeIn 1s ease-out 4.8s forwards}
@keyframes fadeUp{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:translateY(0)}}
@keyframes fadeIn{to{opacity:1}}
</style><style id="reel-border-normalization">*,*::before,*::after{border-color:transparent!important;outline-color:transparent!important}.frame{box-shadow:none!important}</style></head><body>
<div class="frame">
  <div class="top-band"></div>
  <div class="bottom-band"></div>
  <div class="quote-mark">"</div>
  <div class="content">
    <p class="quote">This chapter<br>is not the whole story.<em>Keep turning the page.</em></p>
    <p class="sub">You are still being written</p>
  </div>
  <div class="cta">Follow · Keep turning</div>
</div></body></html>
