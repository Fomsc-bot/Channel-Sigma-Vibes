<!-- SCENE 107 | DURATION: 9s | Theme: Self-worth | Design: split panel + accent bar -->
<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8">
<title>Scene 107 — Stop shrinking</title><style>
*{margin:0;padding:0;box-sizing:border-box}:root{--gold:#f5c542;--soft:#f0e6d3;--font:'Georgia','Times New Roman',serif;--sans:'Helvetica Neue',Arial,sans-serif}html,body{height:100%;background:#000;overflow:hidden;display:flex;align-items:center;justify-content:center;font-family:var(--font)}.frame{position:relative;aspect-ratio:9/16;height:min(100vh,calc(100vw*16/9));width:min(100vw,calc(100vh*9/16));overflow:hidden;background:linear-gradient(135deg,#0a0a0a 0%,#101018 100%);box-shadow:0 0 80px rgba(0,0,0,.9)}.accent-bar{position:absolute;top:0;left:0;width:100%;height:4px;background:linear-gradient(90deg,var(--gold),rgba(245,197,66,0));z-index:2;transform-origin:left;transform:scaleX(0);animation:expand 1.4s cubic-bezier(.22,.9,.3,1) .2s forwards}@keyframes expand{to{transform:scaleX(1)}}.bg-quote{position:absolute;bottom:-6%;right:-4%;font-family:var(--font);font-size:clamp(200px,45vw,400px);color:rgba(245,197,66,.05);line-height:1;font-weight:700;font-style:italic;z-index:0;pointer-events:none;animation:fadeIn 3s ease-out .5s;opacity:0}.content{position:relative;z-index:2;padding:16% 12%;text-align:left;width:100%;overflow-wrap:break-word;word-wrap:break-word;hyphens:auto}.tag{display:inline-block;font-family:var(--sans);font-size:clamp(9px,1.7vw,13px);letter-spacing:.4em;text-transform:uppercase;color:var(--gold);padding:.4em 0;border-top:1px solid var(--gold);margin-bottom:2em;opacity:0;animation:fadeIn 1s ease-out .5s forwards}.quote{font-size:clamp(24px,5.5vw,56px);line-height:1.25;font-weight:700;color:var(--soft);letter-spacing:-.005em;opacity:0;animation:fadeUp 1.6s cubic-bezier(.22,.9,.3,1) .8s forwards}.quote em{font-style:italic;color:var(--gold);font-weight:400;display:inline-block}.sub{font-family:var(--sans);font-size:clamp(11px,2.2vw,18px);letter-spacing:.15em;line-height:1.8;text-transform:uppercase;color:rgba(240,230,211,.55);margin-top:2em;padding-left:1em;border-left:2px solid rgba(245,197,66,.5);opacity:0;animation:fadeUp 1.4s ease-out 2.8s forwards}.cta{position:absolute;bottom:5%;left:12%;font-family:var(--sans);font-size:clamp(9px,1.6vw,13px);letter-spacing:.3em;text-transform:uppercase;color:rgba(255,255,255,.5);z-index:3;opacity:0;animation:fadeIn 1s ease-out 4.5s forwards}@keyframes fadeUp{from{opacity:0;transform:translateY(40px)}to{opacity:1;transform:translateY(0)}}@keyframes fadeIn{to{opacity:1}}
</style><style id="reel-border-normalization">*,*::before,*::after{border:0!important;outline:0!important;box-shadow:none!important}html,body{width:100%!important;height:100%!important;margin:0!important;overflow:hidden!important}body>.frame{position:fixed!important;inset:0!important;width:100vw!important;height:100vh!important;max-width:none!important;max-height:none!important;aspect-ratio:auto!important;border-radius:0!important}</style></head><body>
<div class="frame">
  <div class="accent-bar"></div>
  <div class="bg-quote">"</div>
  <div class="content">
    <span class="tag">Stop · Now</span>
    <p class="quote">Stop shrinking<br>to fit into rooms<br>that were never<br><em>built for you.</em></p>
    <p class="sub">You are not a guest<br>in your own life.</p>
  </div>
  <div class="cta">Follow · Take your space</div>
</div></body></html>
