<!-- SCENE 131 | DURATION: 9s | Theme: Letting go | Design: releasing ribbon lines -->
<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8">
<title>Scene 131 — Letting go is not forgetting</title><style>
*{margin:0;padding:0;box-sizing:border-box}:root{--gold:#f5c542;--rose:#ff6b8a;--soft:#f0e6d3;--font:'Georgia','Times New Roman',serif;--sans:'Helvetica Neue',Arial,sans-serif}html,body{height:100%;background:#000;overflow:hidden;display:flex;align-items:center;justify-content:center;font-family:var(--font)}.frame{position:relative;aspect-ratio:9/16;height:min(100vh,calc(100vw*16/9));width:min(100vw,calc(100vh*9/16));overflow:hidden;background:radial-gradient(circle at 50% 40%,#1a0a14 0%,#060204 85%);box-shadow:0 0 80px rgba(0,0,0,.9)}.ribbon{position:absolute;left:-20%;width:140%;height:1px;background:linear-gradient(90deg,transparent,rgba(255,107,138,.4),transparent);transform-origin:center;opacity:0;animation:unfurl 3s ease-out forwards}.r1{top:25%;animation-delay:.5s;transform:rotate(-3deg) translateY(0);animation-name:r1;}.r2{top:50%;animation-delay:.9s}.r3{top:70%;animation-delay:1.3s}.r4{top:85%;animation-delay:1.7s}@keyframes unfurl{from{opacity:0;transform:scaleX(0) rotate(-3deg)}to{opacity:.7;transform:scaleX(1) rotate(-3deg)}}.halo{position:absolute;top:50%;left:50%;width:60%;aspect-ratio:1;transform:translate(-50%,-50%);background:radial-gradient(circle,rgba(255,107,138,.1) 0%,transparent 60%);border-radius:50%;animation:breathe 6s ease-in-out infinite}@keyframes breathe{0%,100%{transform:translate(-50%,-50%) scale(1)}50%{transform:translate(-50%,-50%) scale(1.2)}}.content{position:relative;z-index:2;padding:20% 12%;text-align:center;width:100%;overflow-wrap:break-word;word-wrap:break-word;hyphens:auto}.quote{font-size:clamp(22px,5.1vw,50px);line-height:1.4;font-weight:400;color:var(--soft);font-style:italic;opacity:0;animation:fadeUp 1.8s cubic-bezier(.22,.9,.3,1) .7s forwards}.quote strong{color:var(--rose);font-style:normal;font-weight:700;display:inline}.sub{font-family:var(--sans);font-size:clamp(11px,2.2vw,18px);letter-spacing:.18em;text-transform:uppercase;line-height:1.8;color:rgba(240,230,211,.55);margin-top:2.4em;opacity:0;animation:fadeUp 1.4s ease-out 3.4s forwards}.cta{position:absolute;bottom:5%;left:50%;transform:translateX(-50%);font-family:var(--sans);font-size:clamp(9px,1.6vw,13px);letter-spacing:.3em;text-transform:uppercase;color:rgba(255,255,255,.45);z-index:3;opacity:0;animation:fadeIn 1s ease-out 5s forwards}@keyframes fadeUp{from{opacity:0;transform:translateY(40px)}to{opacity:1;transform:translateY(0)}}@keyframes fadeIn{to{opacity:1}}
</style><style id="reel-border-normalization">*,*::before,*::after{border-color:transparent!important;outline-color:transparent!important}.frame{box-shadow:none!important}</style></head><body>
<div class="frame">
  <div class="ribbon r1"></div><div class="ribbon r2"></div><div class="ribbon r3"></div><div class="ribbon r4"></div>
  <div class="halo"></div>
  <div class="content">
    <p class="quote">Letting go is not forgetting.<br>It is <strong>loving from a distance</strong><br>without needing<br>to be loved back.</p>
    <p class="sub">Love · without chains</p>
  </div>
  <div class="cta">Follow · Love without chains</div>
</div></body></html>
