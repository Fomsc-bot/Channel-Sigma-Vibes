<!-- SCENE 215 | DURATION: 9s | Theme: Final — you are not behind | Layout: centered, layered halos, generous padding -->
<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8">
<title>Scene 215 — You are not behind</title><style>
*{margin:0;padding:0;box-sizing:border-box}:root{--gold:#f5c542;--soft:#f0e6d3;--font:'Georgia','Times New Roman',serif;--sans:'Helvetica Neue',Arial,sans-serif}html,body{height:100%;background:#000;overflow:hidden;display:flex;align-items:center;justify-content:center;font-family:var(--font)}.frame{position:relative;aspect-ratio:9/16;height:min(100vh,calc(100vw*16/9));width:min(100vw,calc(100vh*9/16));overflow:hidden;background:radial-gradient(circle at 50% 40%,#1a1208 0%,#030201 85%);box-shadow:0 0 80px rgba(0,0,0,.9)}
.halo{position:absolute;top:45%;left:50%;transform:translate(-50%,-50%);width:80%;aspect-ratio:1;background:radial-gradient(circle,rgba(245,197,66,.1) 0%,transparent 60%);border-radius:50%;animation:breathe 7s ease-in-out infinite}
@keyframes breathe{0%,100%{transform:translate(-50%,-50%) scale(1);opacity:.6}50%{transform:translate(-50%,-50%) scale(1.15);opacity:1}}
.accent-bottom{position:absolute;bottom:18%;left:50%;transform:translateX(-50%);width:50px;height:1px;background:linear-gradient(90deg,transparent,var(--gold),transparent);opacity:0;animation:fadeIn 1.4s ease-out 2.2s forwards}
.content{position:relative;z-index:2;display:flex;flex-direction:column;justify-content:center;align-items:center;height:100%;padding:22% 12% 26%;text-align:center;overflow-wrap:break-word;word-wrap:break-word;hyphens:auto}
.quote{font-size:clamp(22px,5.2vw,50px);line-height:1.3;font-weight:800;color:var(--soft);opacity:0;animation:fadeUp 1.6s cubic-bezier(.22,.9,.3,1) .7s forwards}
.quote em{font-style:italic;color:var(--gold);font-weight:400;display:block;margin-top:.4em}
.sub{font-family:var(--sans);font-size:clamp(10px,2vw,16px);letter-spacing:.2em;text-transform:uppercase;line-height:1.9;color:rgba(240,230,211,.55);margin-top:2.4em;opacity:0;animation:fadeUp 1.4s ease-out 3.2s forwards}
.cta{position:absolute;bottom:6%;left:50%;transform:translateX(-50%);font-family:var(--sans);font-size:clamp(9px,1.6vw,13px);letter-spacing:.3em;text-transform:uppercase;color:rgba(255,255,255,.45);z-index:3;opacity:0;animation:fadeIn 1s ease-out 4.8s forwards}
@keyframes fadeUp{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:translateY(0)}}
@keyframes fadeIn{to{opacity:1}}
</style><style id="reel-border-normalization">*,*::before,*::after{border:0!important;outline:0!important;box-shadow:none!important}html,body{width:100%!important;height:100%!important;margin:0!important;overflow:hidden!important}body>.frame{position:fixed!important;inset:0!important;width:100vw!important;height:100vh!important;max-width:none!important;max-height:none!important;aspect-ratio:auto!important;border-radius:0!important}</style></head><body>
<div class="frame">
  <div class="halo"></div>
  <div class="accent-bottom"></div>
  <div class="content">
    <p class="quote">You are not behind.<em>You are exactly<br>where the last<br>choice put you.</em></p>
    <p class="sub">Make the next one</p>
  </div>
  <div class="cta">Follow · Start from here</div>
</div></body></html>
