<!-- SCENE 208 | DURATION: 9s | Theme: The ache of being seen | Layout: centered, subtle dotted accent -->
<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8">
<title>Scene 208 — Being truly seen</title><style>
*{margin:0;padding:0;box-sizing:border-box}:root{--gold:#f5c542;--soft:#f0e6d3;--font:'Georgia','Times New Roman',serif;--sans:'Helvetica Neue',Arial,sans-serif}html,body{height:100%;background:#000;overflow:hidden;display:flex;align-items:center;justify-content:center;font-family:var(--font)}.frame{position:relative;aspect-ratio:9/16;height:min(100vh,calc(100vw*16/9));width:min(100vw,calc(100vh*9/16));overflow:hidden;background:radial-gradient(circle at 50% 40%,#0e0a16 0%,#020104 85%);box-shadow:0 0 80px rgba(0,0,0,.9)}
.dots{position:absolute;top:14%;left:50%;transform:translateX(-50%);display:flex;gap:8px;opacity:0;animation:fadeIn 1.4s ease-out .4s forwards}
.dots span{width:4px;height:4px;border-radius:50%;background:var(--gold);opacity:.5}
.dots span:nth-child(2){opacity:.75}
.dots span:nth-child(3){opacity:1;box-shadow:0 0 10px var(--gold)}
.halo{position:absolute;top:50%;left:50%;width:60%;aspect-ratio:1;transform:translate(-50%,-50%);background:radial-gradient(circle,rgba(245,197,66,.08) 0%,transparent 60%);border-radius:50%;animation:breathe 7s ease-in-out infinite}
@keyframes breathe{0%,100%{transform:translate(-50%,-50%) scale(.95)}50%{transform:translate(-50%,-50%) scale(1.1)}}
.content{position:relative;z-index:2;display:flex;flex-direction:column;justify-content:center;align-items:center;height:100%;padding:22% 12%;text-align:center;overflow-wrap:break-word;word-wrap:break-word;hyphens:auto}
.quote{font-size:clamp(20px,4.8vw,46px);line-height:1.45;font-weight:400;color:var(--soft);font-style:italic;opacity:0;animation:fadeUp 1.8s cubic-bezier(.22,.9,.3,1) .7s forwards}
.quote strong{color:var(--gold);font-style:normal;font-weight:700;display:block;margin-top:.5em}
.sub{font-family:var(--sans);font-size:clamp(10px,2vw,16px);letter-spacing:.2em;text-transform:uppercase;line-height:1.9;color:rgba(240,230,211,.55);margin-top:2.2em;opacity:0;animation:fadeUp 1.4s ease-out 3.4s forwards}
.cta{position:absolute;bottom:6%;left:50%;transform:translateX(-50%);font-family:var(--sans);font-size:clamp(9px,1.6vw,13px);letter-spacing:.3em;text-transform:uppercase;color:rgba(255,255,255,.45);z-index:3;opacity:0;animation:fadeIn 1s ease-out 5s forwards}
@keyframes fadeUp{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:translateY(0)}}
@keyframes fadeIn{to{opacity:1}}
</style></head><body>
<div class="frame">
  <div class="dots"><span></span><span></span><span></span></div>
  <div class="halo"></div>
  <div class="content">
    <p class="quote">The first time<br>someone truly<br>sees you<strong>you will not<br>know what<br>to do with it.</strong></p>
    <p class="sub">Let them · anyway</p>
  </div>
  <div class="cta">Follow · Be truly known</div>
</div></body></html>
