<!-- SCENE 150 | DURATION: 9s | Theme: Love's quiet test | Design: sand through fingers -->
<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8">
<title>Scene 150 — The test of love is not passion</title><style>
*{margin:0;padding:0;box-sizing:border-box}:root{--gold:#f5c542;--rose:#ff6b8a;--soft:#f0e6d3;--font:'Georgia','Times New Roman',serif;--sans:'Helvetica Neue',Arial,sans-serif}html,body{height:100%;background:#000;overflow:hidden;display:flex;align-items:center;justify-content:center;font-family:var(--font)}.frame{position:relative;aspect-ratio:9/16;height:min(100vh,calc(100vw*16/9));width:min(100vw,calc(100vh*9/16));overflow:hidden;background:radial-gradient(circle at 50% 50%,#1a0e08 0%,#040202 85%);box-shadow:0 0 80px rgba(0,0,0,.9)}.sand{position:absolute;top:30%;left:50%;transform:translateX(-50%);width:2px;height:40%;background:linear-gradient(to bottom,var(--gold),transparent);opacity:.4;animation:sandFlow 5s ease-in-out infinite}@keyframes sandFlow{0%,100%{opacity:.2;height:30%}50%{opacity:.6;height:50%}}.hand{position:absolute;top:35%;left:50%;transform:translateX(-50%);width:40%;height:35%;border:1px solid rgba(245,197,66,.15);border-radius:50% 50% 50% 50%/70% 70% 30% 30%;z-index:0;animation:tremble 3s ease-in-out infinite}@keyframes tremble{0%,100%{transform:translateX(-50%) rotate(-2deg)}50%{transform:translateX(-50%) rotate(2deg)}}.grain{position:absolute;top:40%;left:50%;transform:translateX(-50%);width:60%;height:20%;background:radial-gradient(ellipse at 50% 50%,rgba(245,197,66,.08) 0%,transparent 70%);filter:blur(20px);animation:fade 4s ease-in-out infinite}@keyframes fade{0%,100%{opacity:.3}50%{opacity:.8}}.content{position:relative;z-index:2;padding:20% 12%;text-align:center;width:100%;overflow-wrap:break-word;word-wrap:break-word;hyphens:auto}.quote{font-size:clamp(22px,5.1vw,50px);line-height:1.4;font-weight:400;color:var(--soft);font-style:italic;opacity:0;animation:fadeUp 1.8s cubic-bezier(.22,.9,.3,1) .7s forwards}.quote strong{color:var(--gold);font-style:normal;font-weight:700;display:block;margin-top:.4em}.sub{font-family:var(--sans);font-size:clamp(11px,2.2vw,18px);letter-spacing:.18em;line-height:1.8;text-transform:uppercase;color:rgba(240,230,211,.55);margin-top:2.4em;opacity:0;animation:fadeUp 1.4s ease-out 3.6s forwards}.cta{position:absolute;bottom:5%;left:50%;transform:translateX(-50%);font-family:var(--sans);font-size:clamp(9px,1.6vw,13px);letter-spacing:.3em;text-transform:uppercase;color:rgba(255,255,255,.45);z-index:3;opacity:0;animation:fadeIn 1s ease-out 5.2s forwards}@keyframes fadeUp{from{opacity:0;transform:translateY(40px)}to{opacity:1;transform:translateY(0)}}@keyframes fadeIn{to{opacity:1}}
</style></head><body>
<div class="frame">
  <div class="hand"></div>
  <div class="sand"></div>
  <div class="grain"></div>
  <div class="content">
    <p class="quote">The test of love<br>is not passion.<strong>It is whether they<br>still choose you<br>when you are<br>not interesting.</strong></p>
    <p class="sub">Look for that</p>
  </div>
  <div class="cta">Follow · Real love daily</div>
</div></body></html>
