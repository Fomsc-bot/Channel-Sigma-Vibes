<!-- SCENE 115 | DURATION: 9s | Theme: Love / Boundaries | Design: gate/arch shape -->
<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8">
<title>Scene 115 — Every no is a yes</title><style>
*{margin:0;padding:0;box-sizing:border-box}:root{--gold:#f5c542;--rose:#ff6b8a;--soft:#f0e6d3;--font:'Georgia','Times New Roman',serif;--sans:'Helvetica Neue',Arial,sans-serif}html,body{height:100%;background:#000;overflow:hidden;display:flex;align-items:center;justify-content:center;font-family:var(--font)}.frame{position:relative;aspect-ratio:9/16;height:min(100vh,calc(100vw*16/9));width:min(100vw,calc(100vh*9/16));overflow:hidden;background:radial-gradient(ellipse at 50% 40%,#1a0a14 0%,#080204 85%);box-shadow:0 0 80px rgba(0,0,0,.9)}.arch{position:absolute;top:15%;left:50%;transform:translateX(-50%);width:70%;height:55%;border:1px solid rgba(245,197,66,.2);border-bottom:none;border-radius:50% 50% 0 0/70% 70% 0 0;z-index:0;animation:fadeIn 2s ease-out .5s;opacity:0}.arch::before{content:'';position:absolute;inset:8px;border:1px solid rgba(245,197,66,.1);border-bottom:none;border-radius:50% 50% 0 0/70% 70% 0 0}.arch-glow{position:absolute;top:20%;left:50%;transform:translateX(-50%);width:60%;height:45%;background:radial-gradient(ellipse at 50% 100%,rgba(255,107,138,.15) 0%,transparent 70%);z-index:0;animation:fadeIn 2.5s ease-out .8s;opacity:0}.content{position:relative;z-index:2;padding:18% 12%;text-align:center;width:100%;overflow-wrap:break-word;word-wrap:break-word;hyphens:auto}.quote{font-size:clamp(24px,5.6vw,56px);line-height:1.25;font-weight:400;color:var(--soft);font-style:italic;opacity:0;animation:fadeUp 1.8s cubic-bezier(.22,.9,.3,1) .9s forwards}.quote strong{font-style:normal;font-weight:900;color:var(--gold);display:block;font-size:1.2em;margin:.2em 0;text-transform:uppercase;letter-spacing:.05em}.quote strong.rose{color:var(--rose)}.sub{font-family:var(--sans);font-size:clamp(11px,2.2vw,18px);letter-spacing:.18em;line-height:1.8;text-transform:uppercase;color:rgba(240,230,211,.55);margin-top:2.4em;opacity:0;animation:fadeUp 1.4s ease-out 3.2s forwards}.cta{position:absolute;bottom:5%;left:50%;transform:translateX(-50%);font-family:var(--sans);font-size:clamp(9px,1.6vw,13px);letter-spacing:.3em;text-transform:uppercase;color:rgba(255,255,255,.45);z-index:3;opacity:0;animation:fadeIn 1s ease-out 4.8s forwards}@keyframes fadeUp{from{opacity:0;transform:translateY(40px)}to{opacity:1;transform:translateY(0)}}@keyframes fadeIn{to{opacity:1}}
</style></head><body>
<div class="frame">
  <div class="arch"></div>
  <div class="arch-glow"></div>
  <div class="content">
    <p class="quote">Every <strong class="rose">"no"</strong><br>is a yes<br>to yourself.<br><strong>Boundaries are not walls.</strong><br>They are doors<br>with your name on them.</p>
    <p class="sub">Choose who enters</p>
  </div>
  <div class="cta">Follow · Protect your peace</div>
</div></body></html>
