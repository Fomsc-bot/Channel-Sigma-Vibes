<!-- SCENE 105 | DURATION: 9s | Theme: Love / Truth | Design: orbit ring + centered halo -->
<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8">
<title>Scene 105 — The right love feels like home</title><style>
*{margin:0;padding:0;box-sizing:border-box}:root{--gold:#f5c542;--rose:#ff6b8a;--soft:#f0e6d3;--font:'Georgia','Times New Roman',serif;--sans:'Helvetica Neue',Arial,sans-serif}html,body{height:100%;background:#000;overflow:hidden;display:flex;align-items:center;justify-content:center;font-family:var(--font)}.frame{position:relative;aspect-ratio:9/16;height:min(100vh,calc(100vw*16/9));width:min(100vw,calc(100vh*9/16));overflow:hidden;background:radial-gradient(circle at 50% 45%,#2a0a14 0%,#080204 85%);box-shadow:0 0 80px rgba(0,0,0,.9)}.ring{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);border:1px solid rgba(255,107,138,.15);border-radius:50%;animation:spin 40s linear infinite}.ring1{width:85%;aspect-ratio:1}.ring2{width:65%;aspect-ratio:1;animation-direction:reverse;animation-duration:55s;border-color:rgba(245,197,66,.15)}.ring3{width:45%;aspect-ratio:1;animation-duration:70s;border-color:rgba(255,107,138,.1)}@keyframes spin{to{transform:translate(-50%,-50%) rotate(360deg)}}.ring .dot{position:absolute;top:-3px;left:50%;width:6px;height:6px;background:var(--rose);border-radius:50%;transform:translateX(-50%);box-shadow:0 0 12px rgba(255,107,138,.7)}.ring2 .dot{background:var(--gold);box-shadow:0 0 12px rgba(245,197,66,.7)}.halo{position:absolute;top:50%;left:50%;width:40%;aspect-ratio:1;transform:translate(-50%,-50%);background:radial-gradient(circle,rgba(255,107,138,.2) 0%,transparent 65%);border-radius:50%;animation:breathe 5s ease-in-out infinite}@keyframes breathe{0%,100%{transform:translate(-50%,-50%) scale(1)}50%{transform:translate(-50%,-50%) scale(1.3)}}.content{position:relative;z-index:2;padding:14% 12%;text-align:center;width:100%;overflow-wrap:break-word;word-wrap:break-word;hyphens:auto}.pre{font-family:var(--sans);font-size:clamp(10px,1.9vw,14px);letter-spacing:.4em;text-transform:uppercase;color:rgba(255,107,138,.85);margin-bottom:1.6em;opacity:0;animation:fadeDown 1s ease-out .3s forwards}.quote{font-size:clamp(26px,6vw,60px);line-height:1.25;font-weight:700;color:var(--soft);letter-spacing:.01em;opacity:0;animation:fadeUp 1.6s cubic-bezier(.22,.9,.3,1) .7s forwards}.quote em{font-style:italic;color:var(--rose);font-weight:400}.sub{font-family:var(--sans);font-size:clamp(11px,2.2vw,18px);letter-spacing:.2em;text-transform:uppercase;line-height:1.8;color:rgba(240,230,211,.55);margin-top:2.2em;opacity:0;animation:fadeUp 1.4s ease-out 2.8s forwards}.cta{position:absolute;bottom:5%;left:50%;transform:translateX(-50%);font-family:var(--sans);font-size:clamp(9px,1.6vw,13px);letter-spacing:.3em;text-transform:uppercase;color:rgba(245,197,66,.65);z-index:3;opacity:0;animation:fadeIn 1s ease-out 4.5s forwards}@keyframes fadeUp{from{opacity:0;transform:translateY(40px)}to{opacity:1;transform:translateY(0)}}@keyframes fadeDown{from{opacity:0;transform:translateY(-20px)}to{opacity:1;transform:translateY(0)}}@keyframes fadeIn{to{opacity:1}}
</style></head><body>
<div class="frame">
  <div class="ring ring1"><span class="dot"></span></div>
  <div class="ring ring2"><span class="dot"></span></div>
  <div class="ring ring3"></div>
  <div class="halo"></div>
  <div class="content">
    <p class="pre">Real love</p>
    <p class="quote">The right love<br>will not feel<br>like <em>anxiety.</em><br>It will feel<br>like coming home.</p>
    <p class="sub">Do not settle for less</p>
  </div>
  <div class="cta">Follow · Real love daily</div>
</div></body></html>
