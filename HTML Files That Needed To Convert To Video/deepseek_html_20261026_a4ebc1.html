<!-- SCENE 123 | DURATION: 9s | Theme: Perception | Design: layered text shadow -->
<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8">
<title>Scene 123 — The story you tell</title><style>
*{margin:0;padding:0;box-sizing:border-box}:root{--gold:#f5c542;--soft:#f0e6d3;--font:'Georgia','Times New Roman',serif;--sans:'Helvetica Neue',Arial,sans-serif}html,body{height:100%;background:#000;overflow:hidden;display:flex;align-items:center;justify-content:center;font-family:var(--font)}.frame{position:relative;aspect-ratio:9/16;height:min(100vh,calc(100vw*16/9));width:min(100vw,calc(100vh*9/16));overflow:hidden;background:radial-gradient(circle at 40% 30%,#0a141e 0%,#020408 80%);box-shadow:0 0 80px rgba(0,0,0,.9)}.halo{position:absolute;top:50%;left:50%;width:70%;aspect-ratio:1;transform:translate(-50%,-50%);background:radial-gradient(circle,rgba(142,202,230,.1) 0%,transparent 60%);border-radius:50%;animation:breathe 8s ease-in-out infinite}@keyframes breathe{0%,100%{transform:translate(-50%,-50%) scale(.9)}50%{transform:translate(-50%,-50%) scale(1.15)}}.ghost{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-family:var(--font);font-size:clamp(80px,20vw,180px);font-weight:700;color:rgba(142,202,230,.04);font-style:italic;z-index:0;line-height:1;letter-spacing:-.04em;text-align:center;width:100%}.content{position:relative;z-index:2;padding:18% 12%;text-align:center;width:100%;overflow-wrap:break-word;word-wrap:break-word;hyphens:auto}.quote{font-size:clamp(24px,5.4vw,54px);line-height:1.3;font-weight:400;color:var(--soft);font-style:italic;opacity:0;animation:fadeUp 1.8s cubic-bezier(.22,.9,.3,1) .6s forwards}.quote strong{font-style:normal;font-weight:700;color:#8ecae6;display:inline}.sub{font-family:var(--sans);font-size:clamp(11px,2.2vw,18px);letter-spacing:.18em;text-transform:uppercase;line-height:1.8;color:rgba(240,230,211,.55);margin-top:2.4em;opacity:0;animation:fadeUp 1.4s ease-out 3.2s forwards}.cta{position:absolute;bottom:5%;left:50%;transform:translateX(-50%);font-family:var(--sans);font-size:clamp(9px,1.6vw,13px);letter-spacing:.3em;text-transform:uppercase;color:rgba(255,255,255,.45);z-index:3;opacity:0;animation:fadeIn 1s ease-out 4.8s forwards}@keyframes fadeUp{from{opacity:0;transform:translateY(40px)}to{opacity:1;transform:translateY(0)}}@keyframes fadeIn{to{opacity:1}}
</style><style id="reel-border-normalization">*,*::before,*::after{border-color:transparent!important;outline-color:transparent!important}.frame{box-shadow:none!important}</style></head><body>
<div class="frame">
  <div class="ghost">story</div>
  <div class="halo"></div>
  <div class="content">
    <p class="quote">You are not<br>living your life.<br>You are living<br>the <strong>story you tell<br>about your life.</strong></p>
    <p class="sub">Change the story<br>change the life</p>
  </div>
  <div class="cta">Follow · Rewrite your story</div>
</div></body></html>
