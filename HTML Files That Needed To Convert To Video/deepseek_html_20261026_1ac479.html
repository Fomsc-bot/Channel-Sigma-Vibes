<!-- SCENE 170 | DURATION: 9s | Theme: The cost of pretending strength | Design: strained vertical lines -->
<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8">
<title>Scene 170 — Let someone see you tired</title><style>
*{margin:0;padding:0;box-sizing:border-box}:root{--gold:#f5c542;--soft:#f0e6d3;--font:'Georgia','Times New Roman',serif;--sans:'Helvetica Neue',Arial,sans-serif}html,body{height:100%;background:#000;overflow:hidden;display:flex;align-items:center;justify-content:center;font-family:var(--font)}.frame{position:relative;aspect-ratio:9/16;height:min(100vh,calc(100vw*16/9));width:min(100vw,calc(100vh*9/16));overflow:hidden;background:radial-gradient(circle at 50% 50%,#100804 0%,#020201 85%);box-shadow:0 0 80px rgba(0,0,0,.9)}.line{position:absolute;top:15%;bottom:15%;width:1px;background:linear-gradient(to bottom,transparent,rgba(245,197,66,.3),transparent);animation:strain 4s ease-in-out infinite}.l1{left:15%;animation-delay:0s}.l2{left:30%;animation-delay:.5s}.l3{left:45%;animation-delay:1s}.l4{left:60%;animation-delay:1.5s}.l5{left:75%;animation-delay:2s}.l6{left:90%;animation-delay:2.5s}@keyframes strain{0%,100%{transform:scaleY(1);opacity:.3}50%{transform:scaleY(1.02);opacity:.7}}.content{position:relative;z-index:2;padding:20% 12%;text-align:center;width:100%;overflow-wrap:break-word;word-wrap:break-word;hyphens:auto}.quote{font-size:clamp(22px,5.1vw,50px);line-height:1.4;font-weight:400;color:var(--soft);font-style:italic;opacity:0;animation:fadeUp 1.8s cubic-bezier(.22,.9,.3,1) .7s forwards}.quote strong{color:var(--gold);font-style:normal;font-weight:700;display:block;margin-top:.4em}.sub{font-family:var(--sans);font-size:clamp(11px,2.2vw,18px);letter-spacing:.18em;line-height:1.8;text-transform:uppercase;color:rgba(240,230,211,.55);margin-top:2.4em;opacity:0;animation:fadeUp 1.4s ease-out 3.6s forwards}.cta{position:absolute;bottom:5%;left:50%;transform:translateX(-50%);font-family:var(--sans);font-size:clamp(9px,1.6vw,13px);letter-spacing:.3em;text-transform:uppercase;color:rgba(255,255,255,.45);z-index:3;opacity:0;animation:fadeIn 1s ease-out 5.2s forwards}@keyframes fadeUp{from{opacity:0;transform:translateY(40px)}to{opacity:1;transform:translateY(0)}}@keyframes fadeIn{to{opacity:1}}
</style></head><body>
<div class="frame">
  <div class="line l1"></div><div class="line l2"></div><div class="line l3"></div><div class="line l4"></div><div class="line l5"></div><div class="line l6"></div>
  <div class="content">
    <p class="quote">You do not have<br>to be the strong one<strong>every single day.<br>Let someone<br>see you tired.</strong></p>
    <p class="sub">Let yourself · be held</p>
  </div>
  <div class="cta">Follow · Let yourself be held</div>
</div></body></html>
