<!-- SCENE 137 | DURATION: 10s | Theme: The strong friend nobody checks on | Design: layered glass cards -->
<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8">
<title>Scene 137 — The strong one</title><style>
*{margin:0;padding:0;box-sizing:border-box}:root{--gold:#f5c542;--soft:#f0e6d3;--font:'Georgia','Times New Roman',serif;--sans:'Helvetica Neue',Arial,sans-serif}html,body{height:100%;background:#000;overflow:hidden;display:flex;align-items:center;justify-content:center;font-family:var(--font)}.frame{position:relative;aspect-ratio:9/16;height:min(100vh,calc(100vw*16/9));width:min(100vw,calc(100vh*9/16));overflow:hidden;background:radial-gradient(circle at 30% 30%,#160c08 0%,#030202 85%);box-shadow:0 0 80px rgba(0,0,0,.9)}.card{position:absolute;border:1px solid rgba(245,197,66,.1);background:rgba(245,197,66,.02);animation:drift 14s ease-in-out infinite}.c1{top:8%;left:8%;width:35%;height:25%;transform:rotate(-3deg);animation-delay:0s}.c2{top:18%;right:6%;width:40%;height:30%;transform:rotate(2deg);animation-delay:-4s}.c3{bottom:12%;left:10%;width:45%;height:28%;transform:rotate(-2deg);animation-delay:-8s}@keyframes drift{0%,100%{transform:translateY(0) rotate(var(--r,0))}50%{transform:translateY(-12px) rotate(var(--r,0))}}.c1{--r:-3deg}.c2{--r:2deg}.c3{--r:-2deg}.halo{position:absolute;top:50%;left:50%;width:65%;aspect-ratio:1;transform:translate(-50%,-50%);background:radial-gradient(circle,rgba(245,197,66,.1) 0%,transparent 60%);border-radius:50%;animation:breathe 7s ease-in-out infinite}@keyframes breathe{0%,100%{transform:translate(-50%,-50%) scale(.9);opacity:.6}50%{transform:translate(-50%,-50%) scale(1.15);opacity:1}}.content{position:relative;z-index:2;padding:20% 12%;text-align:center;width:100%;overflow-wrap:break-word;word-wrap:break-word;hyphens:auto}.quote{font-size:clamp(23px,5.3vw,52px);line-height:1.35;font-weight:400;color:var(--soft);font-style:italic;opacity:0;animation:fadeUp 1.8s cubic-bezier(.22,.9,.3,1) .7s forwards}.quote strong{color:var(--gold);font-style:normal;font-weight:700;display:block;margin-top:.4em}.sub{font-family:var(--sans);font-size:clamp(11px,2.2vw,18px);letter-spacing:.18em;line-height:1.8;text-transform:uppercase;color:rgba(240,230,211,.55);margin-top:2.4em;opacity:0;animation:fadeUp 1.4s ease-out 3.4s forwards}.cta{position:absolute;bottom:5%;left:50%;transform:translateX(-50%);font-family:var(--sans);font-size:clamp(9px,1.6vw,13px);letter-spacing:.3em;text-transform:uppercase;color:rgba(255,255,255,.45);z-index:3;opacity:0;animation:fadeIn 1s ease-out 5s forwards}@keyframes fadeUp{from{opacity:0;transform:translateY(40px)}to{opacity:1;transform:translateY(0)}}@keyframes fadeIn{to{opacity:1}}
</style></head><body>
<div class="frame">
  <div class="card c1"></div><div class="card c2"></div><div class="card c3"></div>
  <div class="halo"></div>
  <div class="content">
    <p class="quote">The strong friend<br>is not strong.<br>They are just<br>the first to learn<br>that no one comes<strong>when they cry.</strong></p>
    <p class="sub">Check on them</p>
  </div>
  <div class="cta">Follow · For the strong ones</div>
</div></body></html>
