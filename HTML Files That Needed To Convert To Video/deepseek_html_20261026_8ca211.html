<!-- SCENE 132 | DURATION: 9s | Theme: Patience | Design: growing plant/vine -->
<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8">
<title>Scene 132 — Slow is a flex</title><style>
*{margin:0;padding:0;box-sizing:border-box}:root{--gold:#f5c542;--soft:#f0e6d3;--font:'Georgia','Times New Roman',serif;--sans:'Helvetica Neue',Arial,sans-serif}html,body{height:100%;background:#000;overflow:hidden;display:flex;align-items:center;justify-content:center;font-family:var(--font)}.frame{position:relative;aspect-ratio:9/16;height:min(100vh,calc(100vw*16/9));width:min(100vw,calc(100vh*9/16));overflow:hidden;background:radial-gradient(circle at 50% 80%,#0a1408 0%,#020504 85%);box-shadow:0 0 80px rgba(0,0,0,.9)}.vine{position:absolute;bottom:0;left:50%;width:1px;height:0;background:linear-gradient(to top,rgba(245,197,66,.5),transparent);transform:translateX(-50%);z-index:0;animation:grow 4s ease-out .5s forwards}@keyframes grow{to{height:70%}}.leaf{position:absolute;width:14px;height:20px;border:1px solid rgba(245,197,66,.4);border-radius:0 100% 0 100%;opacity:0;animation:fadeIn 1.5s ease-out forwards}.l1{left:calc(50% - 14px);bottom:30%;transform:rotate(-30deg);animation-delay:1.5s}.l2{left:50%;bottom:45%;transform:rotate(30deg) scaleX(-1);animation-delay:2.2s}.l3{left:calc(50% - 14px);bottom:58%;transform:rotate(-30deg);animation-delay:2.9s}.halo{position:absolute;bottom:0;left:50%;transform:translateX(-50%);width:80%;aspect-ratio:1;background:radial-gradient(circle at 50% 100%,rgba(245,197,66,.1) 0%,transparent 60%);border-radius:50%}.content{position:relative;z-index:2;padding:20% 12%;text-align:center;width:100%;overflow-wrap:break-word;word-wrap:break-word;hyphens:auto}.quote{font-size:clamp(30px,7vw,72px);line-height:1.15;font-weight:900;color:var(--soft);text-transform:uppercase;letter-spacing:.02em;opacity:0;animation:fadeUp 1.6s cubic-bezier(.22,.9,.3,1) .7s forwards}.quote em{color:var(--gold);font-style:italic;font-weight:400}.sub{font-family:var(--sans);font-size:clamp(11px,2.2vw,18px);letter-spacing:.2em;line-height:1.9;text-transform:uppercase;color:rgba(240,230,211,.55);margin-top:2.4em;opacity:0;animation:fadeUp 1.4s ease-out 3s forwards}.cta{position:absolute;bottom:5%;left:50%;transform:translateX(-50%);font-family:var(--sans);font-size:clamp(9px,1.6vw,13px);letter-spacing:.3em;text-transform:uppercase;color:rgba(255,255,255,.45);z-index:3;opacity:0;animation:fadeIn 1s ease-out 4.8s forwards}@keyframes fadeUp{from{opacity:0;transform:translateY(40px)}to{opacity:1;transform:translateY(0)}}@keyframes fadeIn{to{opacity:1}}
</style></head><body>
<div class="frame">
  <div class="vine"></div>
  <span class="leaf l1"></span><span class="leaf l2"></span><span class="leaf l3"></span>
  <div class="halo"></div>
  <div class="content">
    <p class="quote">Slow<br>is a <em>flex.</em></p>
    <p class="sub">Rushing proves you are afraid<br>of what is happening.<br>Stillness proves you are not.</p>
  </div>
  <div class="cta">Follow · Move at your pace</div>
</div></body></html>
