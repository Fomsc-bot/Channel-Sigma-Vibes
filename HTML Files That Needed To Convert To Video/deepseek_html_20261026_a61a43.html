<!-- SCENE 61 | DURATION: 9s | Theme: Time | Hook: Open loop — "You are not running out of time" -->
<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8">
<title>Scene 61 — Time is not your enemy</title><style>
*{margin:0;padding:0;box-sizing:border-box}:root{--gold:#f5c542;--ice:#8ecae6;--soft:#f0e6d3;--font:'Georgia','Times New Roman',serif;--sans:'Helvetica Neue',Arial,sans-serif}html,body{height:100%;background:#000;overflow:hidden;display:flex;align-items:center;justify-content:center;font-family:var(--font)}.frame{position:relative;aspect-ratio:9/16;height:min(100vh,calc(100vw*16/9));width:min(100vw,calc(100vh*9/16));overflow:hidden;background:#0a0a0a;display:flex;align-items:center;justify-content:center;box-shadow:0 0 60px rgba(0,0,0,.6)}.bg{position:absolute;inset:0;z-index:0}.bg3{background:radial-gradient(ellipse at 50% 50%,#0a1a2e 0%,#050810 70%)}.bg-zoom{animation:bgZoom 16s ease-out forwards}@keyframes bgZoom{from{transform:scale(1)}to{transform:scale(1.16)}}.content{position:relative;z-index:2;padding:9% 8%;text-align:center;width:100%;overflow-wrap:break-word;word-wrap:break-word;hyphens:auto}.quote{font-size:clamp(26px,6vw,62px);line-height:1.2;font-weight:700;color:var(--soft);letter-spacing:.02em}.quote em{font-style:italic;color:var(--gold)}.sub{font-family:var(--sans);font-size:clamp(13px,2.6vw,24px);letter-spacing:.14em;text-transform:uppercase;color:rgba(240,230,211,.65);margin-top:1.2em;font-weight:400;line-height:1.6}.cta{position:absolute;bottom:5.5%;left:50%;transform:translateX(-50%);font-family:var(--sans);font-size:clamp(9px,1.7vw,14px);letter-spacing:.2em;text-transform:uppercase;color:rgba(255,255,255,.5);border:1px solid rgba(255,255,255,.15);padding:.7em 1.4em;border-radius:99px;white-space:nowrap;z-index:3;opacity:0}.a-up{animation:fadeUp 1.2s cubic-bezier(.22,.9,.3,1) forwards;opacity:0}.a-blur{animation:blurIn 1.5s ease-out forwards;opacity:0}.a-cta{animation:ctaPulse 2s ease-in-out infinite}.medium{font-size:clamp(22px,5vw,48px);font-weight:700;line-height:1.25}.serif{font-family:var(--font)}.ice{color:var(--ice)}@keyframes fadeUp{from{opacity:0;transform:translateY(50px)}to{opacity:1;transform:translateY(0)}}@keyframes blurIn{from{opacity:0;filter:blur(14px)}to{opacity:1;filter:blur(0)}}@keyframes ctaPulse{0%,100%{opacity:.7;transform:translateX(-50%) scale(1)}50%{opacity:1;transform:translateX(-50%) scale(1.05)}}
</style><style id="reel-border-normalization">*,*::before,*::after{border-color:transparent!important;outline-color:transparent!important}.frame{box-shadow:none!important}</style></head><body>
<div class="frame">
  <div class="bg bg3 bg-zoom"></div>
  <div class="content">
    <p class="quote medium serif a-blur" style="animation-duration:1.6s;">You are not<br>running out of time.<br>You are running out<br>of <em class="ice">the version of<br>yourself that<br>keeps waiting.</em></p>
  </div>
  <div class="cta a-cta" style="animation-delay:4s;">FOLLOW — STOP WAITING</div>
</div></body></html>
