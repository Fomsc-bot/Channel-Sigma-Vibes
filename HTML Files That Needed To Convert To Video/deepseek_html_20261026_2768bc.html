<!-- SCENE 113 | DURATION: 9s | Theme: Grief / Memory | Design: layered soft clouds -->
<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8">
<title>Scene 113 — What you lost made room</title><style>
*{margin:0;padding:0;box-sizing:border-box}:root{--gold:#f5c542;--soft:#f0e6d3;--font:'Georgia','Times New Roman',serif;--sans:'Helvetica Neue',Arial,sans-serif}html,body{height:100%;background:#000;overflow:hidden;display:flex;align-items:center;justify-content:center;font-family:var(--font)}.frame{position:relative;aspect-ratio:9/16;height:min(100vh,calc(100vw*16/9));width:min(100vw,calc(100vh*9/16));overflow:hidden;background:radial-gradient(circle at 30% 30%,#1a1408 0%,#050505 80%);box-shadow:0 0 80px rgba(0,0,0,.9)}.cloud{position:absolute;border-radius:50%;filter:blur(60px);opacity:.35;animation:drift 20s ease-in-out infinite}.c1{top:10%;left:-10%;width:60%;aspect-ratio:1;background:radial-gradient(circle,rgba(245,197,66,.4),transparent 70%)}.c2{bottom:15%;right:-15%;width:70%;aspect-ratio:1;background:radial-gradient(circle,rgba(255,255,255,.2),transparent 70%);animation-delay:-8s}.c3{top:45%;left:30%;width:40%;aspect-ratio:1;background:radial-gradient(circle,rgba(245,197,66,.2),transparent 70%);animation-delay:-14s}@keyframes drift{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(30px,-20px) scale(1.1)}}.content{position:relative;z-index:2;padding:18% 12%;text-align:center;width:100%;overflow-wrap:break-word;word-wrap:break-word;hyphens:auto}.quote{font-size:clamp(24px,5.5vw,56px);line-height:1.25;font-weight:700;color:var(--soft);opacity:0;animation:fadeUp 1.6s cubic-bezier(.22,.9,.3,1) .6s forwards}.quote span{display:block;color:var(--gold);font-style:italic;font-weight:400;margin-top:.3em;opacity:0;animation:fadeUp 1.4s ease-out 2.2s forwards}.sub{font-family:var(--sans);font-size:clamp(11px,2.2vw,18px);letter-spacing:.18em;text-transform:uppercase;line-height:1.8;color:rgba(240,230,211,.5);margin-top:2.2em;opacity:0;animation:fadeUp 1.4s ease-out 3.2s forwards}.divider{width:1px;height:30px;background:linear-gradient(to bottom,var(--gold),transparent);margin:1.4em auto;opacity:0;animation:fadeIn 1.2s ease-out 2.8s forwards}.cta{position:absolute;bottom:5%;left:50%;transform:translateX(-50%);font-family:var(--sans);font-size:clamp(9px,1.6vw,13px);letter-spacing:.3em;text-transform:uppercase;color:rgba(255,255,255,.45);z-index:3;opacity:0;animation:fadeIn 1s ease-out 4.5s forwards}@keyframes fadeUp{from{opacity:0;transform:translateY(40px)}to{opacity:1;transform:translateY(0)}}@keyframes fadeIn{to{opacity:1}}
</style></head><body>
<div class="frame">
  <div class="cloud c1"></div>
  <div class="cloud c2"></div>
  <div class="cloud c3"></div>
  <div class="content">
    <p class="quote">What you lost<br>did not destroy you.<span>It made room.</span></p>
    <div class="divider"></div>
    <p class="sub">Look what grew in the space.<br>It could not have grown<br>otherwise.</p>
  </div>
  <div class="cta">Follow · Look what grew</div>
</div></body></html>
