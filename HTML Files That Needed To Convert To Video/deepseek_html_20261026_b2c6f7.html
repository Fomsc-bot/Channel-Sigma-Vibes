<!-- SCENE 117 | DURATION: 9s | Theme: Truth / Worth | Design: diagonal stripes bg + glass card -->
<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8">
<title>Scene 117 — You are not too much</title><style>
*{margin:0;padding:0;box-sizing:border-box}:root{--gold:#f5c542;--soft:#f0e6d3;--font:'Georgia','Times New Roman',serif;--sans:'Helvetica Neue',Arial,sans-serif}html,body{height:100%;background:#000;overflow:hidden;display:flex;align-items:center;justify-content:center;font-family:var(--font)}.frame{position:relative;aspect-ratio:9/16;height:min(100vh,calc(100vw*16/9));width:min(100vw,calc(100vh*9/16));overflow:hidden;background:linear-gradient(160deg,#1a1408 0%,#080604 100%);box-shadow:0 0 80px rgba(0,0,0,.9)}.stripes{position:absolute;inset:0;background-image:repeating-linear-gradient(45deg,transparent 0,rgba(245,197,66,.03) 2px,transparent 4px,transparent 60px);z-index:0}.card{position:absolute;inset:20% 10%;background:rgba(255,255,255,.03);border:1px solid rgba(245,197,66,.15);z-index:1;opacity:0;animation:fadeIn 1.5s ease-out .5s forwards;box-shadow:0 20px 60px rgba(0,0,0,.4)}.card::before,.card::after{content:'';position:absolute;width:30px;height:30px;border:1px solid var(--gold)}.card::before{top:-1px;left:-1px;border-right:none;border-bottom:none}.card::after{bottom:-1px;right:-1px;border-left:none;border-top:none}.content{position:relative;z-index:2;padding:26% 16%;text-align:center;width:100%;overflow-wrap:break-word;word-wrap:break-word;hyphens:auto}.quote{font-size:clamp(24px,5.4vw,54px);line-height:1.3;font-weight:400;color:var(--soft);font-style:italic;opacity:0;animation:fadeUp 1.6s cubic-bezier(.22,.9,.3,1) .8s forwards}.quote strong{font-style:normal;font-weight:900;color:var(--gold);display:block;margin-top:.4em;font-size:1.1em}.sub{font-family:var(--sans);font-size:clamp(10px,2vw,16px);letter-spacing:.3em;text-transform:uppercase;color:rgba(240,230,211,.5);margin-top:2em;opacity:0;animation:fadeUp 1.4s ease-out 3s forwards}.cta{position:absolute;bottom:5%;left:50%;transform:translateX(-50%);font-family:var(--sans);font-size:clamp(9px,1.6vw,13px);letter-spacing:.3em;text-transform:uppercase;color:rgba(255,255,255,.45);z-index:3;opacity:0;animation:fadeIn 1s ease-out 4.8s forwards}@keyframes fadeUp{from{opacity:0;transform:translateY(40px)}to{opacity:1;transform:translateY(0)}}@keyframes fadeIn{to{opacity:1}}
</style><style id="reel-border-normalization">*,*::before,*::after{border:0!important;outline:0!important;box-shadow:none!important}html,body{width:100%!important;height:100%!important;margin:0!important;overflow:hidden!important}body>.frame{position:fixed!important;inset:0!important;width:100vw!important;height:100vh!important;max-width:none!important;max-height:none!important;aspect-ratio:auto!important;border-radius:0!important}</style></head><body>
<div class="frame">
  <div class="stripes"></div>
  <div class="card"></div>
  <div class="content">
    <p class="quote">You are not<br>hard to love.<br>You were just loved<br>by people<strong>who had no room.</strong></p>
    <p class="sub">Their limit · not your worth</p>
  </div>
  <div class="cta">Follow · Know your worth</div>
</div></body></html>
