*{margin:0;padding:0;box-sizing:border-box}:root{--gold:#f5c542;--soft:#f0e6d3;--font:'Georgia','Times New Roman',serif;--sans:'Helvetica Neue',Arial,sans-serif}html,body{height:100%;background:#000;overflow:hidden;display:flex;align-items:center;justify-content:center;font-family:var(--font)}.frame{position:relative;aspect-ratio:9/16;height:min(100vh,calc(100vw*16/9));width:min(100vw,calc(100vh*9/16));overflow:hidden;background:#0a0a0a;display:flex;align-items:center;justify-content:center;box-shadow:0 0 60px rgba(0,0,0,.6)}.bg{position:absolute;inset:0;z-index:0}.bg5{background:radial-gradient(ellipse at 80% 30%,#0a2e1e 0%,#050a05 70%)}.bg-zoom{animation:bgZoom 14s ease-out forwards}@keyframes bgZoom{from{transform:scale(1)}to{transform:scale(1.18)}}.content{position:relative;z-index:2;padding:8% 10%;text-align:center;max-width:100%}.quote{font-size:clamp(28px,6.5vw,68px);line-height:1.15;font-weight:700;color:var(--soft);letter-spacing:.02em;text-wrap:balance}.sub{font-family:var(--sans);font-size:clamp(14px,2.8vw,28px);letter-spacing:.15em;text-transform:uppercase;color:rgba(240,230,211,.65);margin-top:1.2em;font-weight:400;line-height:1.5}.cta{position:absolute;bottom:6%;left:50%;transform:translateX(-50%);font-family:var(--sans);font-size:clamp(10px,1.8vw,16px);letter-spacing:.2em;text-transform:uppercase;color:rgba(255,255,255,.5);border:1px solid rgba(255,255,255,.15);padding:.7em 1.6em;border-radius:99px;white-space:nowrap;z-index:3;opacity:0}.a-up{animation:fadeUp 1.2s cubic-bezier(.22,.9,.3,1) forwards;opacity:0}.a-scale-out{animation:scaleOut 1.1s cubic-bezier(.22,.9,.3,1) forwards;opacity:0}.a-cta{animation:ctaPulse 2s ease-in-out infinite}.big{font-size:clamp(36px,8vw,80px);font-weight:900;line-height:1.05}.sans{font-family:var(--sans)}.uppercase{text-transform:uppercase;letter-spacing:.1em}.gold{color:var(--gold)}@keyframes fadeUp{from{opacity:0;transform:translateY(60px)}to{opacity:1;transform:translateY(0)}}@keyframes scaleOut{from{opacity:0;transform:scale(1.3)}to{opacity:1;transform:scale(1)}}@keyframes ctaPulse{0%,100%{opacity:.7;transform:translateX(-50%) scale(1)}50%{opacity:1;transform:translateX(-50%) scale(1.05)}}
