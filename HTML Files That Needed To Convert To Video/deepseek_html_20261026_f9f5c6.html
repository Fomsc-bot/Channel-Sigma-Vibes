<!-- SCENE 169 | DURATION: 9s | Theme: Silence as answer | Design: closed book pages -->
<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8">
<title>Scene 169 — Their silence is the answer</title><style>
*{margin:0;padding:0;box-sizing:border-box}:root{--gold:#f5c542;--soft:#f0e6d3;--font:'Georgia','Times New Roman',serif;--sans:'Helvetica Neue',Arial,sans-serif}html,body{height:100%;background:#000;overflow:hidden;display:flex;align-items:center;justify-content:center;font-family:var(--font)}.frame{position:relative;aspect-ratio:9/16;height:min(100vh,calc(100vw*16/9));width:min(100vw,calc(100vh*9/16));overflow:hidden;background:radial-gradient(circle at 50% 40%,#0c0a10 0%,#020103 85%);box-shadow:0 0 80px rgba(0,0,0,.9)}.page{position:absolute;top:25%;left:20%;width:60%;height:50%;border:1px solid rgba(245,197,66,.15);z-index:0;transform-origin:left center;animation:openBook 3s ease-out .3s both;box-shadow:inset 0 0 0 1px rgba(0,0,0,.2),-8px 0 20px rgba(0,0,0,.3)}.page::before{content:'';position:absolute;top:0;left:50%;bottom:0;width:1px;background:rgba(245,197,66,.08)}@keyframes openBook{from{transform:rotateY(-90deg);opacity:0}to{transform:rotateY(0);opacity:1}}.lines{position:absolute;top:30%;left:25%;right:25%;bottom:30%;background-image:repeating-linear-gradient(to bottom,transparent 0,transparent 30px,rgba(245,197,66,.08) 30px,rgba(245,197,66,.08) 31px);z-index:1;animation:fadeIn 1.5s ease-out 1.5s both;opacity:0}.content{position:relative;z-index:2;padding:20% 12%;text-align:center;width:100%;overflow-wrap:break-word;word-wrap:break-word;hyphens:auto}.quote{font-size:clamp(22px,5.1vw,50px);line-height:1.4;font-weight:400;color:var(--soft);font-style:italic;opacity:0;animation:fadeUp 1.8s cubic-bezier(.22,.9,.3,1) .7s forwards}.quote strong{color:var(--gold);font-style:normal;font-weight:700;display:block;margin-top:.4em}.sub{font-family:var(--sans);font-size:clamp(11px,2.2vw,18px);letter-spacing:.18em;line-height:1.8;text-transform:uppercase;color:rgba(240,230,211,.55);margin-top:2.4em;opacity:0;animation:fadeUp 1.4s ease-out 3.6s forwards}.cta{position:absolute;bottom:5%;left:50%;transform:translateX(-50%);font-family:var(--sans);font-size:clamp(9px,1.6vw,13px);letter-spacing:.3em;text-transform:uppercase;color:rgba(255,255,255,.45);z-index:3;opacity:0;animation:fadeIn 1s ease-out 5.2s forwards}@keyframes fadeUp{from{opacity:0;transform:translateY(40px)}to{opacity:1;transform:translateY(0)}}@keyframes fadeIn{to{opacity:1}}
</style><style id="reel-border-normalization">*,*::before,*::after{border:0!important;outline:0!important;box-shadow:none!important}html,body{width:100%!important;height:100%!important;margin:0!important;overflow:hidden!important}body>.frame{position:fixed!important;inset:0!important;width:100vw!important;height:100vh!important;max-width:none!important;max-height:none!important;aspect-ratio:auto!important;border-radius:0!important}</style></head><body>
<div class="frame">
  <div class="page"></div>
  <div class="lines"></div>
  <div class="content">
    <p class="quote">Their silence<br>is not a mystery.<strong>It is a sentence<br>you have been<br>refusing<br>to read.</strong></p>
    <p class="sub">Read it · then close it</p>
  </div>
  <div class="cta">Follow · Stop waiting</div>
</div></body></html>
