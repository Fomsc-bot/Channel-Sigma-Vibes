<!-- SCENE 128 | DURATION: 9s | Theme: Time | Design: fading clock numerals -->
<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8">
<title>Scene 128 — You are not running out of time</title><style>
*{margin:0;padding:0;box-sizing:border-box}:root{--gold:#f5c542;--soft:#f0e6d3;--font:'Georgia','Times New Roman',serif;--sans:'Helvetica Neue',Arial,sans-serif}html,body{height:100%;background:#000;overflow:hidden;display:flex;align-items:center;justify-content:center;font-family:var(--font)}.frame{position:relative;aspect-ratio:9/16;height:min(100vh,calc(100vw*16/9));width:min(100vw,calc(100vh*9/16));overflow:hidden;background:radial-gradient(circle at 50% 50%,#141008 0%,#030201 85%);box-shadow:0 0 80px rgba(0,0,0,.9)}.clock{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:80%;aspect-ratio:1;border:1px solid rgba(245,197,66,.1);border-radius:50%;z-index:0;opacity:0;animation:fadeIn 2s ease-out .3s forwards}.clock::before,.clock::after{content:'';position:absolute;background:rgba(245,197,66,.15)}.clock::before{top:5%;left:50%;width:1px;height:90%;transform:translateX(-50%)}.clock::after{top:50%;left:5%;width:90%;height:1px;transform:translateY(-50%)}.numeral{position:absolute;font-family:var(--font);font-size:clamp(30px,6vw,60px);font-weight:700;color:rgba(245,197,66,.08);z-index:0}.n12{top:5%;left:50%;transform:translateX(-50%)}.n3{top:50%;right:5%;transform:translateY(-50%)}.n6{bottom:5%;left:50%;transform:translateX(-50%)}.n9{top:50%;left:5%;transform:translateY(-50%)}.content{position:relative;z-index:2;padding:20% 12%;text-align:center;width:100%;overflow-wrap:break-word;word-wrap:break-word;hyphens:auto}.quote{font-size:clamp(22px,5.1vw,50px);line-height:1.4;font-weight:400;color:var(--soft);font-style:italic;opacity:0;animation:fadeUp 1.8s cubic-bezier(.22,.9,.3,1) .7s forwards}.quote strong{color:var(--gold);font-style:normal;font-weight:700;display:block;margin-top:.4em}.sub{font-family:var(--sans);font-size:clamp(11px,2.2vw,18px);letter-spacing:.18em;text-transform:uppercase;line-height:1.8;color:rgba(240,230,211,.55);margin-top:2.4em;opacity:0;animation:fadeUp 1.4s ease-out 3.4s forwards}.cta{position:absolute;bottom:5%;left:50%;transform:translateX(-50%);font-family:var(--sans);font-size:clamp(9px,1.6vw,13px);letter-spacing:.3em;text-transform:uppercase;color:rgba(255,255,255,.45);z-index:3;opacity:0;animation:fadeIn 1s ease-out 5s forwards}@keyframes fadeUp{from{opacity:0;transform:translateY(40px)}to{opacity:1;transform:translateY(0)}}@keyframes fadeIn{to{opacity:1}}
</style><style id="reel-border-normalization">*,*::before,*::after{border:0!important;outline:0!important;box-shadow:none!important}html,body{width:100%!important;height:100%!important;margin:0!important;overflow:hidden!important}body>.frame{position:fixed!important;inset:0!important;width:100vw!important;height:100vh!important;max-width:none!important;max-height:none!important;aspect-ratio:auto!important;border-radius:0!important}</style></head><body>
<div class="frame">
  <div class="clock"></div>
  <span class="numeral n12">12</span><span class="numeral n3">3</span><span class="numeral n6">6</span><span class="numeral n9">9</span>
  <div class="content">
    <p class="quote">You are not<br>running out of time.<br>You are running out<br>of <strong>the version of yourself<br>that keeps waiting.</strong></p>
    <p class="sub">Stop waiting</p>
  </div>
  <div class="cta">Follow · Start now</div>
</div></body></html>
