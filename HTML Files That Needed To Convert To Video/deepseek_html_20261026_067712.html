<!-- SCENE 181 | DURATION: 9s | Theme: Betrayal by someone you loved | Design: scattered fragments -->
<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8">
<title>Scene 181 — Trusting yourself again</title><style>
*{margin:0;padding:0;box-sizing:border-box}:root{--gold:#f5c542;--soft:#f0e6d3;--font:'Georgia','Times New Roman',serif;--sans:'Helvetica Neue',Arial,sans-serif}html,body{height:100%;background:#000;overflow:hidden;display:flex;align-items:center;justify-content:center;font-family:var(--font)}.frame{position:relative;aspect-ratio:9/16;height:min(100vh,calc(100vw*16/9));width:min(100vw,calc(100vh*9/16));overflow:hidden;background:radial-gradient(circle at 50% 40%,#140408 0%,#020101 85%);box-shadow:0 0 80px rgba(0,0,0,.9)}.frag{position:absolute;border:1px solid rgba(245,197,66,.15);opacity:0;animation:fadeIn 2s ease-out forwards}.f1{top:20%;left:20%;width:15%;height:20%;transform:rotate(-15deg);animation-delay:.3s}.f2{top:25%;right:25%;width:12%;height:18%;transform:rotate(20deg);animation-delay:.6s}.f3{top:40%;left:35%;width:10%;height:15%;transform:rotate(5deg);animation-delay:.9s}.f4{bottom:30%;right:30%;width:14%;height:22%;transform:rotate(-25deg);animation-delay:1.2s}.f5{bottom:20%;left:25%;width:11%;height:16%;transform:rotate(12deg);animation-delay:1.5s}.content{position:relative;z-index:2;padding:20% 12%;text-align:center;width:100%;overflow-wrap:break-word;word-wrap:break-word;hyphens:auto}.quote{font-size:clamp(22px,5.1vw,50px);line-height:1.4;font-weight:400;color:var(--soft);font-style:italic;opacity:0;animation:fadeUp 1.8s cubic-bezier(.22,.9,.3,1) .7s forwards}.quote strong{color:var(--gold);font-style:normal;font-weight:700;display:block;margin-top:.4em}.sub{font-family:var(--sans);font-size:clamp(11px,2.2vw,18px);letter-spacing:.18em;line-height:1.8;text-transform:uppercase;color:rgba(240,230,211,.55);margin-top:2.4em;opacity:0;animation:fadeUp 1.4s ease-out 3.6s forwards}.cta{position:absolute;bottom:5%;left:50%;transform:translateX(-50%);font-family:var(--sans);font-size:clamp(9px,1.6vw,13px);letter-spacing:.3em;text-transform:uppercase;color:rgba(255,255,255,.45);z-index:3;opacity:0;animation:fadeIn 1s ease-out 5.2s forwards}@keyframes fadeUp{from{opacity:0;transform:translateY(40px)}to{opacity:1;transform:translateY(0)}}@keyframes fadeIn{to{opacity:1}}
</style></head><body>
<div class="frame">
  <div class="frag f1"></div><div class="frag f2"></div><div class="frag f3"></div><div class="frag f4"></div><div class="frag f5"></div>
  <div class="content">
    <p class="quote">The hardest part<br>of being betrayed<strong>is not trusting them again.<br>It is trusting<br>yourself.</strong></p>
    <p class="sub">Start · with you</p>
  </div>
  <div class="cta">Follow · Trust yourself again</div>
</div></body></html>
