<!-- SCENE 152 | DURATION: 9s | Theme: Perfectionism's cost | Design: broken grid lines -->
<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8">
<title>Scene 152 — The cost of perfect</title><style>
*{margin:0;padding:0;box-sizing:border-box}:root{--gold:#f5c542;--soft:#f0e6d3;--font:'Georgia','Times New Roman',serif;--sans:'Helvetica Neue',Arial,sans-serif}html,body{height:100%;background:#000;overflow:hidden;display:flex;align-items:center;justify-content:center;font-family:var(--font)}.frame{position:relative;aspect-ratio:9/16;height:min(100vh,calc(100vw*16/9));width:min(100vw,calc(100vh*9/16));overflow:hidden;background:radial-gradient(circle at 50% 50%,#0a0c14 0%,#020104 85%);box-shadow:0 0 80px rgba(0,0,0,.9)}.gridline{position:absolute;background:rgba(245,197,66,.1)}.gl1{top:15%;left:5%;right:5%;height:1px}.gl2{top:35%;left:5%;right:5%;height:1px}.gl3{top:55%;left:5%;right:5%;height:1px}.gl4{top:75%;left:5%;right:5%;height:1px}.broken{position:absolute;top:35%;right:5%;width:30%;height:1px;background:linear-gradient(90deg,rgba(245,197,66,.5),transparent);transform:rotate(-15deg);transform-origin:right;animation:crack 2s ease-out 1s both}@keyframes crack{from{transform:rotate(-15deg) scaleX(0)}to{transform:rotate(-15deg) scaleX(1)}}.content{position:relative;z-index:2;padding:20% 12%;text-align:center;width:100%;overflow-wrap:break-word;word-wrap:break-word;hyphens:auto}.quote{font-size:clamp(22px,5.1vw,50px);line-height:1.4;font-weight:400;color:var(--soft);font-style:italic;opacity:0;animation:fadeUp 1.8s cubic-bezier(.22,.9,.3,1) .7s forwards}.quote strong{color:var(--gold);font-style:normal;font-weight:700;display:block;margin-top:.4em}.sub{font-family:var(--sans);font-size:clamp(11px,2.2vw,18px);letter-spacing:.18em;line-height:1.8;text-transform:uppercase;color:rgba(240,230,211,.55);margin-top:2.4em;opacity:0;animation:fadeUp 1.4s ease-out 3.6s forwards}.cta{position:absolute;bottom:5%;left:50%;transform:translateX(-50%);font-family:var(--sans);font-size:clamp(9px,1.6vw,13px);letter-spacing:.3em;text-transform:uppercase;color:rgba(255,255,255,.45);z-index:3;opacity:0;animation:fadeIn 1s ease-out 5.2s forwards}@keyframes fadeUp{from{opacity:0;transform:translateY(40px)}to{opacity:1;transform:translateY(0)}}@keyframes fadeIn{to{opacity:1}}
</style></head><body>
<div class="frame">
  <div class="gridline gl1"></div><div class="gridline gl2"></div><div class="gridline gl3"></div><div class="gridline gl4"></div>
  <div class="broken"></div>
  <div class="content">
    <p class="quote">Perfectionism<br>is not high standards.<strong>It is the fear<br>that being seen<br>as you are<br>will cost you love.</strong></p>
    <p class="sub">It will not</p>
  </div>
  <div class="cta">Follow · Show up anyway</div>
</div></body></html>
