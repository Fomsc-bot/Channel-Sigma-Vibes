<!-- SCENE 140 | DURATION: 9s | Theme: Self-abandonment | Design: cracked ceramic lines -->
<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8">
<title>Scene 140 — You left yourself first</title><style>
*{margin:0;padding:0;box-sizing:border-box}:root{--gold:#f5c542;--soft:#f0e6d3;--font:'Georgia','Times New Roman',serif;--sans:'Helvetica Neue',Arial,sans-serif}html,body{height:100%;background:#000;overflow:hidden;display:flex;align-items:center;justify-content:center;font-family:var(--font)}.frame{position:relative;aspect-ratio:9/16;height:min(100vh,calc(100vw*16/9));width:min(100vw,calc(100vh*9/16));overflow:hidden;background:radial-gradient(circle at 40% 40%,#160a04 0%,#030101 85%);box-shadow:0 0 80px rgba(0,0,0,.9)}.crack{position:absolute;background:rgba(245,197,66,.15);transform-origin:top left}.cr1{top:15%;left:20%;width:1px;height:25%;transform:rotate(22deg);animation:draw 2s ease-out .5s both}.cr2{top:25%;left:55%;width:1px;height:20%;transform:rotate(-30deg);animation:draw 2s ease-out 1s both}.cr3{bottom:25%;right:25%;width:1px;height:22%;transform:rotate(55deg);animation:draw 2s ease-out 1.5s both}@keyframes draw{0%{transform-origin:top left;transform:scaleY(0) rotate(var(--rot,0))}to{transform:scaleY(1) rotate(var(--rot,0))}}.cr1{--rot:22deg}.cr2{--rot:-30deg}.cr3{--rot:55deg}.halo{position:absolute;top:50%;left:50%;width:60%;aspect-ratio:1;transform:translate(-50%,-50%);background:radial-gradient(circle,rgba(245,197,66,.08) 0%,transparent 60%);border-radius:50%;animation:breathe 6s ease-in-out infinite}@keyframes breathe{0%,100%{transform:translate(-50%,-50%) scale(1)}50%{transform:translate(-50%,-50%) scale(1.15)}}.content{position:relative;z-index:2;padding:20% 12%;text-align:center;width:100%;overflow-wrap:break-word;word-wrap:break-word;hyphens:auto}.quote{font-size:clamp(23px,5.3vw,52px);line-height:1.35;font-weight:400;color:var(--soft);font-style:italic;opacity:0;animation:fadeUp 1.8s cubic-bezier(.22,.9,.3,1) .7s forwards}.quote strong{color:var(--gold);font-style:normal;font-weight:700;display:block;margin-top:.4em}.sub{font-family:var(--sans);font-size:clamp(11px,2.2vw,18px);letter-spacing:.18em;line-height:1.8;text-transform:uppercase;color:rgba(240,230,211,.55);margin-top:2.4em;opacity:0;animation:fadeUp 1.4s ease-out 3.6s forwards}.cta{position:absolute;bottom:5%;left:50%;transform:translateX(-50%);font-family:var(--sans);font-size:clamp(9px,1.6vw,13px);letter-spacing:.3em;text-transform:uppercase;color:rgba(255,255,255,.45);z-index:3;opacity:0;animation:fadeIn 1s ease-out 5.2s forwards}@keyframes fadeUp{from{opacity:0;transform:translateY(40px)}to{opacity:1;transform:translateY(0)}}@keyframes fadeIn{to{opacity:1}}
</style><style id="reel-border-normalization">*,*::before,*::after{border:0!important;outline:0!important;box-shadow:none!important}html,body{width:100%!important;height:100%!important;margin:0!important;overflow:hidden!important}body>.frame{position:fixed!important;inset:0!important;width:100vw!important;height:100vh!important;max-width:none!important;max-height:none!important;aspect-ratio:auto!important;border-radius:0!important}</style></head><body>
<div class="frame">
  <div class="crack cr1"></div><div class="crack cr2"></div><div class="crack cr3"></div>
  <div class="halo"></div>
  <div class="content">
    <p class="quote">Before they left you,<br>you left yourself.<strong>You just mistook<br>abandonment<br>for love.</strong></p>
    <p class="sub">Come back · to you</p>
  </div>
  <div class="cta">Follow · Come home to yourself</div>
</div></body></html>
