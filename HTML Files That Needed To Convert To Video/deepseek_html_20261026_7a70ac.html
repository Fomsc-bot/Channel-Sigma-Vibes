<!-- SCENE 102 | DURATION: 9s | Theme: Late-night honesty | Design: glass panel + spark dots -->
<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8">
<title>Scene 102 — You are not too much</title><style>
*{margin:0;padding:0;box-sizing:border-box}:root{--gold:#f5c542;--rose:#ff6b8a;--soft:#f0e6d3;--font:'Georgia','Times New Roman',serif;--sans:'Helvetica Neue',Arial,sans-serif}html,body{height:100%;background:#000;overflow:hidden;display:flex;align-items:center;justify-content:center;font-family:var(--font)}.frame{position:relative;aspect-ratio:9/16;height:min(100vh,calc(100vw*16/9));width:min(100vw,calc(100vh*9/16));overflow:hidden;background:radial-gradient(circle at 30% 20%,#2a0a1e 0%,#0a0208 80%);box-shadow:0 0 80px rgba(0,0,0,.9)}.spark{position:absolute;width:3px;height:3px;background:var(--gold);border-radius:50%;opacity:0;animation:twinkle 3s ease-in-out infinite}.s1{top:15%;left:20%;animation-delay:0s}.s2{top:25%;right:18%;animation-delay:.6s}.s3{bottom:30%;left:15%;animation-delay:1.2s}.s4{bottom:20%;right:22%;animation-delay:1.8s}.s5{top:45%;left:10%;animation-delay:2.4s}@keyframes twinkle{0%,100%{opacity:0;transform:scale(.5)}50%{opacity:.9;transform:scale(1.5)}}.halo{position:absolute;top:50%;left:50%;width:80%;aspect-ratio:1;transform:translate(-50%,-50%);background:radial-gradient(circle,rgba(255,107,138,.15) 0%,transparent 65%);border-radius:50%;animation:pulse 8s ease-in-out infinite}@keyframes pulse{0%,100%{transform:translate(-50%,-50%) scale(.95)}50%{transform:translate(-50%,-50%) scale(1.08)}}.panel{position:absolute;inset:12% 8%;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.08);border-radius:8px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);z-index:1;opacity:0;animation:fadeIn 1.5s ease-out .5s forwards}@keyframes fadeIn{to{opacity:1}}.content{position:relative;z-index:2;padding:14% 12%;text-align:center;width:100%;overflow-wrap:break-word;word-wrap:break-word;hyphens:auto}.quote{font-size:clamp(24px,5.5vw,56px);line-height:1.3;font-weight:700;color:var(--soft);letter-spacing:.01em;opacity:0;animation:fadeUp 1.6s cubic-bezier(.22,.9,.3,1) .8s forwards}.quote em{font-style:italic;color:var(--rose);font-weight:400}.quote .under{position:relative;display:inline-block}.quote .under::after{content:'';position:absolute;left:0;right:0;bottom:-4px;height:1px;background:var(--gold);transform:scaleX(0);transform-origin:left;animation:draw 1.2s ease-out 2.6s forwards}@keyframes draw{to{transform:scaleX(1)}}.sub{font-family:var(--sans);font-size:clamp(11px,2.2vw,18px);letter-spacing:.28em;text-transform:uppercase;color:rgba(240,230,211,.5);margin-top:2.4em;opacity:0;animation:fadeUp 1.2s ease-out 3s forwards}.cta{position:absolute;bottom:5%;left:50%;transform:translateX(-50%);font-family:var(--sans);font-size:clamp(9px,1.6vw,13px);letter-spacing:.3em;text-transform:uppercase;color:rgba(245,197,66,.7);z-index:3;opacity:0;animation:fadeIn 1s ease-out 4.5s forwards}@keyframes fadeUp{from{opacity:0;transform:translateY(40px)}to{opacity:1;transform:translateY(0)}}
</style><style id="reel-border-normalization">*,*::before,*::after{border-color:transparent!important;outline-color:transparent!important}.frame{box-shadow:none!important}</style></head><body>
<div class="frame">
  <div class="halo"></div>
  <span class="spark s1"></span><span class="spark s2"></span><span class="spark s3"></span><span class="spark s4"></span><span class="spark s5"></span>
  <div class="panel"></div>
  <div class="content">
    <p class="quote">You are not<br><span class="under">too much.</span><br>You were just<br><em>loved by people</em><br>with small hands.</p>
    <p class="sub">Their limit — not your worth</p>
  </div>
  <div class="cta">Follow · Know your worth</div>
</div></body></html>
