<!-- SCENE 188 | DURATION: 9s | Theme: The gift of being misunderstood | Design: fractured mirror pieces -->
<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8">
<title>Scene 188 — You are not for everyone</title><style>
*{margin:0;padding:0;box-sizing:border-box}:root{--gold:#f5c542;--soft:#f0e6d3;--font:'Georgia','Times New Roman',serif;--sans:'Helvetica Neue',Arial,sans-serif}html,body{height:100%;background:#000;overflow:hidden;display:flex;align-items:center;justify-content:center;font-family:var(--font)}.frame{position:relative;aspect-ratio:9/16;height:min(100vh,calc(100vw*16/9));width:min(100vw,calc(100vh*9/16));overflow:hidden;background:radial-gradient(circle at 50% 40%,#0a1014 0%,#010203 85%);box-shadow:0 0 80px rgba(0,0,0,.9)}.mirror{position:absolute;top:20%;left:50%;transform:translateX(-50%);width:60%;height:60%;border:1px solid rgba(245,197,66,.1);z-index:0;opacity:0;animation:fadeIn 2s ease-out .3s forwards}.mirror::before,.mirror::after{content:'';position:absolute;background:rgba(245,197,66,.15)}.mirror::before{top:30%;left:10%;right:20%;height:1px;transform:rotate(15deg)}.mirror::after{top:50%;left:20%;right:10%;height:1px;transform:rotate(-12deg)}.content{position:relative;z-index:2;padding:20% 12%;text-align:center;width:100%;overflow-wrap:break-word;word-wrap:break-word;hyphens:auto}.quote{font-size:clamp(22px,5.1vw,50px);line-height:1.4;font-weight:400;color:var(--soft);font-style:italic;opacity:0;animation:fadeUp 1.8s cubic-bezier(.22,.9,.3,1) .7s forwards}.quote strong{color:var(--gold);font-style:normal;font-weight:700;display:block;margin-top:.4em}.sub{font-family:var(--sans);font-size:clamp(11px,2.2vw,18px);letter-spacing:.18em;line-height:1.8;text-transform:uppercase;color:rgba(240,230,211,.55);margin-top:2.4em;opacity:0;animation:fadeUp 1.4s ease-out 3.6s forwards}.cta{position:absolute;bottom:5%;left:50%;transform:translateX(-50%);font-family:var(--sans);font-size:clamp(9px,1.6vw,13px);letter-spacing:.3em;text-transform:uppercase;color:rgba(255,255,255,.45);z-index:3;opacity:0;animation:fadeIn 1s ease-out 5.2s forwards}@keyframes fadeUp{from{opacity:0;transform:translateY(40px)}to{opacity:1;transform:translateY(0)}}@keyframes fadeIn{to{opacity:1}}
</style></head><body>
<div class="frame">
  <div class="mirror"></div>
  <div class="content">
    <p class="quote">You are not<br>for everyone.<strong>Some people<br>will only see<br>the edges of you<br>and call it all.</strong></p>
    <p class="sub">That is their limit</p>
  </div>
  <div class="cta">Follow · Be seen · fully</div>
</div></body></html>
