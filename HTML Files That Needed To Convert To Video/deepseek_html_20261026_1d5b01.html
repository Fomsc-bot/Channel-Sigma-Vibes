<!-- SCENE 142 | DURATION: 9s | Theme: The cost of being loved wrong | Design: tangled threads -->
<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8">
<title>Scene 142 — Being loved wrong teaches you wrong things</title><style>
*{margin:0;padding:0;box-sizing:border-box}:root{--gold:#f5c542;--rose:#ff6b8a;--soft:#f0e6d3;--font:'Georgia','Times New Roman',serif;--sans:'Helvetica Neue',Arial,sans-serif}html,body{height:100%;background:#000;overflow:hidden;display:flex;align-items:center;justify-content:center;font-family:var(--font)}.frame{position:relative;aspect-ratio:9/16;height:min(100vh,calc(100vw*16/9));width:min(100vw,calc(100vh*9/16));overflow:hidden;background:radial-gradient(circle at 50% 40%,#160a12 0%,#030102 85%);box-shadow:0 0 80px rgba(0,0,0,.9)}.thread{position:absolute;border:1px solid rgba(255,107,138,.2);border-radius:50%;animation:tangle 8s ease-in-out infinite}.t1{width:70%;height:25%;top:30%;left:15%;border-radius:50% 40% 60% 30%;transform:rotate(-15deg)}.t2{width:60%;height:20%;top:40%;left:25%;border-radius:30% 60% 40% 50%;transform:rotate(20deg);animation-delay:-3s}.t3{width:50%;height:15%;top:50%;left:30%;border-radius:60% 30% 50% 40%;transform:rotate(-40deg);animation-delay:-6s}@keyframes tangle{0%,100%{transform:rotate(var(--rot,0)) scale(1)}50%{transform:rotate(calc(var(--rot,0) + 5deg)) scale(1.05)}}.t1{--rot:-15deg}.t2{--rot:20deg}.t3{--rot:-40deg}.halo{position:absolute;top:50%;left:50%;width:55%;aspect-ratio:1;transform:translate(-50%,-50%);background:radial-gradient(circle,rgba(255,107,138,.1) 0%,transparent 60%);border-radius:50%;animation:breathe 6s ease-in-out infinite}@keyframes breathe{0%,100%{transform:translate(-50%,-50%) scale(1)}50%{transform:translate(-50%,-50%) scale(1.2)}}.content{position:relative;z-index:2;padding:20% 12%;text-align:center;width:100%;overflow-wrap:break-word;word-wrap:break-word;hyphens:auto}.quote{font-size:clamp(22px,5.1vw,50px);line-height:1.4;font-weight:400;color:var(--soft);font-style:italic;opacity:0;animation:fadeUp 1.8s cubic-bezier(.22,.9,.3,1) .7s forwards}.quote strong{color:var(--rose);font-style:normal;font-weight:700;display:block;margin-top:.4em}.sub{font-family:var(--sans);font-size:clamp(11px,2.2vw,18px);letter-spacing:.18em;line-height:1.8;text-transform:uppercase;color:rgba(240,230,211,.55);margin-top:2.4em;opacity:0;animation:fadeUp 1.4s ease-out 3.6s forwards}.cta{position:absolute;bottom:5%;left:50%;transform:translateX(-50%);font-family:var(--sans);font-size:clamp(9px,1.6vw,13px);letter-spacing:.3em;text-transform:uppercase;color:rgba(255,255,255,.45);z-index:3;opacity:0;animation:fadeIn 1s ease-out 5.2s forwards}@keyframes fadeUp{from{opacity:0;transform:translateY(40px)}to{opacity:1;transform:translateY(0)}}@keyframes fadeIn{to{opacity:1}}
</style></head><body>
<div class="frame">
  <div class="thread t1"></div><div class="thread t2"></div><div class="thread t3"></div>
  <div class="halo"></div>
  <div class="content">
    <p class="quote">Being loved wrong<br>teaches you to call<br>chaos <em>passion</em><br>and silence <em>peace.</em><strong>You can learn<br>a new language.</strong></p>
    <p class="sub">Love does not have to be earned</p>
  </div>
  <div class="cta">Follow · Learn a better love</div>
</div></body></html>
