<!-- SCENE 114 | DURATION: 9s | Theme: Becoming | Design: morphing gradient backdrop -->
<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8">
<title>Scene 114 — You are not broken</title><style>
*{margin:0;padding:0;box-sizing:border-box}:root{--gold:#f5c542;--soft:#f0e6d3;--font:'Georgia','Times New Roman',serif;--sans:'Helvetica Neue',Arial,sans-serif}html,body{height:100%;background:#000;overflow:hidden;display:flex;align-items:center;justify-content:center;font-family:var(--font)}.frame{position:relative;aspect-ratio:9/16;height:min(100vh,calc(100vw*16/9));width:min(100vw,calc(100vh*9/16));overflow:hidden;background:#08060a;box-shadow:0 0 80px rgba(0,0,0,.9)}.gradient{position:absolute;inset:0;background:linear-gradient(135deg,#1a0a24 0%,#0a0a1a 40%,#1a0f0a 100%);opacity:.9;animation:shift 12s ease-in-out infinite;z-index:0}@keyframes shift{0%,100%{background-position:0% 0%}50%{background-position:100% 100%}}.blob{position:absolute;border-radius:50%;filter:blur(70px);animation:morph 15s ease-in-out infinite}.b1{top:-10%;left:-10%;width:70%;aspect-ratio:1;background:radial-gradient(circle,rgba(142,202,230,.35),transparent 70%)}.b2{bottom:-15%;right:-10%;width:80%;aspect-ratio:1;background:radial-gradient(circle,rgba(245,197,66,.3),transparent 70%);animation-delay:-7s}@keyframes morph{0%,100%{transform:translate(0,0) scale(1);border-radius:50%}50%{transform:translate(20px,-30px) scale(1.15);border-radius:40% 60% 55% 45%}}.content{position:relative;z-index:2;padding:18% 12%;text-align:center;width:100%;overflow-wrap:break-word;word-wrap:break-word;hyphens:auto}.tag{font-family:var(--sans);font-size:clamp(10px,1.9vw,14px);letter-spacing:.4em;text-transform:uppercase;color:rgba(142,202,230,.85);margin-bottom:1.6em;opacity:0;animation:fadeDown 1.2s ease-out .3s forwards}.quote{font-size:clamp(26px,6vw,60px);line-height:1.2;font-weight:900;color:var(--soft);text-transform:uppercase;letter-spacing:.02em;opacity:0;animation:fadeUp 1.6s cubic-bezier(.22,.9,.3,1) .7s forwards}.quote .gold{color:var(--gold);display:inline-block;position:relative;opacity:0;animation:fadeUp 1.2s ease-out 2s forwards}.sub{font-family:var(--sans);font-size:clamp(12px,2.3vw,19px);letter-spacing:.15em;line-height:1.8;color:rgba(240,230,211,.55);margin-top:2em;font-style:italic;opacity:0;animation:fadeUp 1.4s ease-out 3s forwards}.cta{position:absolute;bottom:5%;left:50%;transform:translateX(-50%);font-family:var(--sans);font-size:clamp(9px,1.6vw,13px);letter-spacing:.3em;text-transform:uppercase;color:rgba(255,255,255,.45);z-index:3;opacity:0;animation:fadeIn 1s ease-out 4.8s forwards}@keyframes fadeUp{from{opacity:0;transform:translateY(40px)}to{opacity:1;transform:translateY(0)}}@keyframes fadeDown{from{opacity:0;transform:translateY(-20px)}to{opacity:1;transform:translateY(0)}}@keyframes fadeIn{to{opacity:1}}
</style><style id="reel-border-normalization">*,*::before,*::after{border:0!important;outline:0!important;box-shadow:none!important}html,body{width:100%!important;height:100%!important;margin:0!important;overflow:hidden!important}body>.frame{position:fixed!important;inset:0!important;width:100vw!important;height:100vh!important;max-width:none!important;max-height:none!important;aspect-ratio:auto!important;border-radius:0!important}</style></head><body>
<div class="frame">
  <div class="gradient"></div>
  <div class="blob b1"></div>
  <div class="blob b2"></div>
  <div class="content">
    <p class="tag">A reminder</p>
    <p class="quote">You are<br>not<br><span class="gold">broken.</span><br>You are<br>becoming.</p>
    <p class="sub">A seed must break to become a tree.<br>So must you.</p>
  </div>
  <div class="cta">Follow · Keep becoming</div>
</div></body></html>
