<!-- SCENE 179 | DURATION: 9s | Theme: Grief's unexpected timing | Design: gentle ripples -->
<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8">
<title>Scene 179 — Grief doesn't shrink, you grow</title><style>
*{margin:0;padding:0;box-sizing:border-box}:root{--gold:#f5c542;--soft:#f0e6d3;--font:'Georgia','Times New Roman',serif;--sans:'Helvetica Neue',Arial,sans-serif}html,body{height:100%;background:#000;overflow:hidden;display:flex;align-items:center;justify-content:center;font-family:var(--font)}.frame{position:relative;aspect-ratio:9/16;height:min(100vh,calc(100vw*16/9));width:min(100vw,calc(100vh*9/16));overflow:hidden;background:radial-gradient(circle at 50% 50%,#0a0c14 0%,#020203 85%);box-shadow:0 0 80px rgba(0,0,0,.9)}.ripple{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);border:1px solid rgba(245,197,66,.2);border-radius:50%;opacity:0;animation:ripple 6s ease-out infinite}.r1{width:15%;aspect-ratio:1;animation-delay:0s}.r2{width:15%;aspect-ratio:1;animation-delay:2s}.r3{width:15%;aspect-ratio:1;animation-delay:4s}@keyframes ripple{0%{width:15%;opacity:.8}100%{width:100%;opacity:0}}.content{position:relative;z-index:2;padding:20% 12%;text-align:center;width:100%;overflow-wrap:break-word;word-wrap:break-word;hyphens:auto}.quote{font-size:clamp(22px,5.1vw,50px);line-height:1.4;font-weight:400;color:var(--soft);font-style:italic;opacity:0;animation:fadeUp 1.8s cubic-bezier(.22,.9,.3,1) .7s forwards}.quote strong{color:var(--gold);font-style:normal;font-weight:700;display:block;margin-top:.4em}.sub{font-family:var(--sans);font-size:clamp(11px,2.2vw,18px);letter-spacing:.18em;line-height:1.8;text-transform:uppercase;color:rgba(240,230,211,.55);margin-top:2.4em;opacity:0;animation:fadeUp 1.4s ease-out 3.6s forwards}.cta{position:absolute;bottom:5%;left:50%;transform:translateX(-50%);font-family:var(--sans);font-size:clamp(9px,1.6vw,13px);letter-spacing:.3em;text-transform:uppercase;color:rgba(255,255,255,.45);z-index:3;opacity:0;animation:fadeIn 1s ease-out 5.2s forwards}@keyframes fadeUp{from{opacity:0;transform:translateY(40px)}to{opacity:1;transform:translateY(0)}}@keyframes fadeIn{to{opacity:1}}
</style><style id="reel-border-normalization">*,*::before,*::after{border-color:transparent!important;outline-color:transparent!important}.frame{box-shadow:none!important}</style></head><body>
<div class="frame">
  <div class="ripple r1"></div><div class="ripple r2"></div><div class="ripple r3"></div>
  <div class="content">
    <p class="quote">Grief does not shrink.<strong>You grow around it.<br>That is why<br>some days<br>it still fits<br>so tight.</strong></p>
    <p class="sub">Grow · anyway</p>
  </div>
  <div class="cta">Follow · For the ones we carry</div>
</div></body></html>
