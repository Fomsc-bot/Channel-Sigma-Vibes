<!-- SCENE 133 | DURATION: 9s | Theme: Regret | Design: ghost silhouette -->
<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8">
<title>Scene 133 — The ghost of who you could have been</title><style>
*{margin:0;padding:0;box-sizing:border-box}:root{--gold:#f5c542;--ice:#8ecae6;--soft:#f0e6d3;--font:'Georgia','Times New Roman',serif;--sans:'Helvetica Neue',Arial,sans-serif}html,body{height:100%;background:#000;overflow:hidden;display:flex;align-items:center;justify-content:center;font-family:var(--font)}.frame{position:relative;aspect-ratio:9/16;height:min(100vh,calc(100vw*16/9));width:min(100vw,calc(100vh*9/16));overflow:hidden;background:radial-gradient(circle at 50% 40%,#0a0a1e 0%,#010103 85%);box-shadow:0 0 80px rgba(0,0,0,.9)}.ghost{position:absolute;top:30%;left:50%;transform:translateX(-50%);width:40%;height:50%;border-radius:50% 50% 0 0;background:radial-gradient(ellipse at 50% 30%,rgba(142,202,230,.15) 0%,transparent 70%);filter:blur(30px);z-index:0;animation:flicker 5s ease-in-out infinite}@keyframes flicker{0%,100%{opacity:.4;transform:translateX(-50%) scale(1)}50%{opacity:.8;transform:translateX(-50%) scale(1.05)}}.fog{position:absolute;bottom:0;left:0;right:0;height:40%;background:linear-gradient(to top,rgba(142,202,230,.1),transparent);z-index:0}.content{position:relative;z-index:2;padding:20% 12%;text-align:center;width:100%;overflow-wrap:break-word;word-wrap:break-word;hyphens:auto}.quote{font-size:clamp(22px,5.1vw,50px);line-height:1.4;font-weight:400;color:var(--soft);font-style:italic;opacity:0;animation:fadeUp 1.8s cubic-bezier(.22,.9,.3,1) .7s forwards}.quote strong{color:var(--ice);font-style:normal;font-weight:700;display:inline}.sub{font-family:var(--sans);font-size:clamp(11px,2.2vw,18px);letter-spacing:.18em;line-height:1.8;text-transform:uppercase;color:rgba(240,230,211,.55);margin-top:2.4em;opacity:0;animation:fadeUp 1.4s ease-out 3.4s forwards}.cta{position:absolute;bottom:5%;left:50%;transform:translateX(-50%);font-family:var(--sans);font-size:clamp(9px,1.6vw,13px);letter-spacing:.3em;text-transform:uppercase;color:rgba(255,255,255,.45);z-index:3;opacity:0;animation:fadeIn 1s ease-out 5s forwards}@keyframes fadeUp{from{opacity:0;transform:translateY(40px)}to{opacity:1;transform:translateY(0)}}@keyframes fadeIn{to{opacity:1}}
</style></head><body>
<div class="frame">
  <div class="ghost"></div>
  <div class="fog"></div>
  <div class="content">
    <p class="quote">The ghost of who<br>you could have been<br>will haunt you<br><strong>only if you let fear<br>choose your days.</strong></p>
    <p class="sub">Outrun the ghost</p>
  </div>
  <div class="cta">Follow · Outrun the ghost</div>
</div></body></html>
