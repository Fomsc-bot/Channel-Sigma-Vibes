<!-- SCENE 176 | DURATION: 9s | Theme: The cost of forgiveness | Design: released balloons -->
<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8">
<title>Scene 176 — Forgiveness is not for them</title><style>
*{margin:0;padding:0;box-sizing:border-box}:root{--gold:#f5c542;--soft:#f0e6d3;--font:'Georgia','Times New Roman',serif;--sans:'Helvetica Neue',Arial,sans-serif}html,body{height:100%;background:#000;overflow:hidden;display:flex;align-items:center;justify-content:center;font-family:var(--font)}.frame{position:relative;aspect-ratio:9/16;height:min(100vh,calc(100vw*16/9));width:min(100vw,calc(100vh*9/16));overflow:hidden;background:radial-gradient(circle at 50% 40%,#0a1414 0%,#020303 85%);box-shadow:0 0 80px rgba(0,0,0,.9)}.balloon{position:absolute;width:14px;height:20px;border:1px solid rgba(245,197,66,.3);border-radius:50%;opacity:0;animation:floatUp 10s linear infinite}.b1{bottom:10%;left:20%;animation-delay:0s}.b2{bottom:10%;left:40%;animation-delay:2.5s}.b3{bottom:10%;left:60%;animation-delay:5s}.b4{bottom:10%;left:80%;animation-delay:7.5s}@keyframes floatUp{0%{opacity:0;transform:translateY(0)}15%{opacity:.7}100%{opacity:0;transform:translateY(-90vh)}}.content{position:relative;z-index:2;padding:20% 12%;text-align:center;width:100%;overflow-wrap:break-word;word-wrap:break-word;hyphens:auto}.quote{font-size:clamp(22px,5.1vw,50px);line-height:1.4;font-weight:400;color:var(--soft);font-style:italic;opacity:0;animation:fadeUp 1.8s cubic-bezier(.22,.9,.3,1) .7s forwards}.quote strong{color:var(--gold);font-style:normal;font-weight:700;display:block;margin-top:.4em}.sub{font-family:var(--sans);font-size:clamp(11px,2.2vw,18px);letter-spacing:.18em;line-height:1.8;text-transform:uppercase;color:rgba(240,230,211,.55);margin-top:2.4em;opacity:0;animation:fadeUp 1.4s ease-out 3.6s forwards}.cta{position:absolute;bottom:5%;left:50%;transform:translateX(-50%);font-family:var(--sans);font-size:clamp(9px,1.6vw,13px);letter-spacing:.3em;text-transform:uppercase;color:rgba(255,255,255,.45);z-index:3;opacity:0;animation:fadeIn 1s ease-out 5.2s forwards}@keyframes fadeUp{from{opacity:0;transform:translateY(40px)}to{opacity:1;transform:translateY(0)}}@keyframes fadeIn{to{opacity:1}}
</style><style id="reel-border-normalization">*,*::before,*::after{border-color:transparent!important;outline-color:transparent!important}.frame{box-shadow:none!important}</style></head><body>
<div class="frame">
  <div class="balloon b1"></div><div class="balloon b2"></div><div class="balloon b3"></div><div class="balloon b4"></div>
  <div class="content">
    <p class="quote">Forgiveness is not<br>for them.<strong>It is for the version<br>of you who is<br>still carrying<br>what they dropped.</strong></p>
    <p class="sub">Put it down</p>
  </div>
  <div class="cta">Follow · Choose peace</div>
</div></body></html>
