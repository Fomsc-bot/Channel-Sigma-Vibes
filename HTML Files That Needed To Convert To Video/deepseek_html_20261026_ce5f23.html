<!-- SCENE 125 | DURATION: 9s | Theme: Love / Realism | Design: hearth/fire embers -->
<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8">
<title>Scene 125 — Love is not the fire</title><style>
*{margin:0;padding:0;box-sizing:border-box}:root{--gold:#f5c542;--warm:#ff8a5c;--rose:#ff6b8a;--soft:#f0e6d3;--font:'Georgia','Times New Roman',serif;--sans:'Helvetica Neue',Arial,sans-serif}html,body{height:100%;background:#000;overflow:hidden;display:flex;align-items:center;justify-content:center;font-family:var(--font)}.frame{position:relative;aspect-ratio:9/16;height:min(100vh,calc(100vw*16/9));width:min(100vw,calc(100vh*9/16));overflow:hidden;background:radial-gradient(ellipse at 50% 100%,#2a1005 0%,#050202 80%);box-shadow:0 0 80px rgba(0,0,0,.9)}.ember{position:absolute;width:3px;height:3px;background:var(--warm);border-radius:50%;opacity:0;box-shadow:0 0 8px var(--warm);animation:rise 5s linear infinite}.e1{bottom:5%;left:20%;animation-delay:0s}.e2{bottom:8%;left:40%;animation-delay:.8s}.e3{bottom:3%;left:60%;animation-delay:1.6s}.e4{bottom:6%;left:80%;animation-delay:2.4s}.e5{bottom:10%;left:30%;animation-delay:3.2s}.e6{bottom:4%;left:50%;animation-delay:4s}@keyframes rise{0%{opacity:0;transform:translateY(0)}15%{opacity:1}100%{opacity:0;transform:translateY(-70vh) translateX(-10px)}}.glow{position:absolute;bottom:0;left:50%;transform:translateX(-50%);width:80%;height:40%;background:radial-gradient(ellipse at 50% 100%,rgba(255,138,92,.25) 0%,transparent 70%);z-index:0}.content{position:relative;z-index:2;padding:18% 12%;text-align:center;width:100%;overflow-wrap:break-word;word-wrap:break-word;hyphens:auto}.quote{font-size:clamp(22px,5.1vw,50px);line-height:1.35;font-weight:400;color:var(--soft);font-style:italic;opacity:0;animation:fadeUp 1.8s cubic-bezier(.22,.9,.3,1) .7s forwards}.quote strong{color:var(--rose);font-style:normal;font-weight:700;display:inline}.sub{font-family:var(--sans);font-size:clamp(11px,2.2vw,18px);letter-spacing:.18em;text-transform:uppercase;line-height:1.8;color:rgba(240,230,211,.55);margin-top:2.4em;opacity:0;animation:fadeUp 1.4s ease-out 3.4s forwards}.cta{position:absolute;bottom:5%;left:50%;transform:translateX(-50%);font-family:var(--sans);font-size:clamp(9px,1.6vw,13px);letter-spacing:.3em;text-transform:uppercase;color:rgba(255,255,255,.45);z-index:3;opacity:0;animation:fadeIn 1s ease-out 5s forwards}@keyframes fadeUp{from{opacity:0;transform:translateY(40px)}to{opacity:1;transform:translateY(0)}}@keyframes fadeIn{to{opacity:1}}
</style><style id="reel-border-normalization">*,*::before,*::after{border:0!important;outline:0!important;box-shadow:none!important}html,body{width:100%!important;height:100%!important;margin:0!important;overflow:hidden!important}body>.frame{position:fixed!important;inset:0!important;width:100vw!important;height:100vh!important;max-width:none!important;max-height:none!important;aspect-ratio:auto!important;border-radius:0!important}</style></head><body>
<div class="frame">
  <span class="ember e1"></span><span class="ember e2"></span><span class="ember e3"></span><span class="ember e4"></span><span class="ember e5"></span><span class="ember e6"></span>
  <div class="glow"></div>
  <div class="content">
    <p class="quote">Love is not the fire.<br>It is the choice<br>to keep <strong>building the hearth</strong><br>long after<br>the spark feels ordinary.</p>
    <p class="sub">Chosen · daily · quiet</p>
  </div>
  <div class="cta">Follow · Real love daily</div>
</div></body></html>
