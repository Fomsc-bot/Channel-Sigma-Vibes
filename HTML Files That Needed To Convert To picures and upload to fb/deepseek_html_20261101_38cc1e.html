<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Quote 44</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,600;1,700&family=Inter:wght@500&display=swap" rel="stylesheet">
<style>
:root{--w:1080px;--h:1920px;--ink:#3a2030;--accent:#d9467e;--soft:#8a6a7a;}
*{margin:0;padding:0;box-sizing:border-box}body{background:#000}
.stage{position:relative;width:var(--w);height:var(--h);overflow:hidden;
background:
radial-gradient(circle at 12% 8%,#ffd6e8 0%,transparent 42%),
radial-gradient(circle at 88% 90%,#ffd6e8 0%,transparent 42%),
linear-gradient(180deg,#fff5fa 0%,#fde4f0 55%,#f8d0e2 100%);
color:var(--ink);font-family:'Inter',Arial,sans-serif;-webkit-font-smoothing:antialiased}
.petal{position:absolute;border-radius:50% 0 50% 50%;background:rgba(217,70,126,.18);pointer-events:none}
.p1{width:44px;height:44px;top:220px;left:120px;transform:rotate(30deg)}
.p2{width:28px;height:28px;top:420px;right:160px;transform:rotate(-20deg)}
.p3{width:36px;height:36px;top:1400px;left:80px;transform:rotate(15deg)}
.p4{width:24px;height:24px;bottom:260px;right:120px;transform:rotate(50deg)}
.branch{position:absolute;top:0;left:-40px;width:360px;height:360px;pointer-events:none;opacity:.5}
.safe{position:absolute;inset:300px 110px 340px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;z-index:2}
.blossom{font-size:56px;color:var(--accent);margin-bottom:44px}
.quote{font-family:'Fraunces',Georgia,serif;font-style:italic;font-weight:700;font-size:100px;line-height:1.14;letter-spacing:-.4px}
.author{margin-top:56px;font-size:28px;font-weight:500;letter-spacing:.28em;text-transform:uppercase;color:var(--accent)}
.brand{position:absolute;bottom:80px;left:0;right:0;text-align:center;font-size:18px;letter-spacing:.44em;text-transform:uppercase;color:rgba(138,106,122,.8);z-index:2}
</style></head><body>
<div class="stage">
<svg class="branch" viewBox="0 0 360 360" fill="none" stroke="#b04a6e" stroke-width="2.2">
<path d="M-20 40 Q80 80 130 180 Q160 260 200 340"/>
<circle cx="60" cy="70" r="14" fill="rgba(217,70,126,.35)" stroke="none"/>
<circle cx="110" cy="120" r="10" fill="rgba(217,70,126,.35)" stroke="none"/>
<circle cx="90" cy="180" r="12" fill="rgba(217,70,126,.35)" stroke="none"/>
<circle cx="150" cy="230" r="9" fill="rgba(217,70,126,.35)" stroke="none"/>
<circle cx="180" cy="300" r="11" fill="rgba(217,70,126,.35)" stroke="none"/>
</svg>
<div class="petal p1"></div><div class="petal p2"></div><div class="petal p3"></div><div class="petal p4"></div>
<div class="safe">
<p class="blossom">❀</p>
<p class="quote">Bloom at your own pace.</p>
<p class="author">Unknown</p>
</div><p class="brand">Daily Motivation</p></div>
</body></html>
