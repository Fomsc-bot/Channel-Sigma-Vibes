<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Quote 08</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,900&family=Inter:wght@500&display=swap" rel="stylesheet">
<style>
:root{--w:1080px;--h:1920px;--ink:#f3e9d2;--accent:#d4af37;--soft:#a3977a;}
*{margin:0;padding:0;box-sizing:border-box}body{background:#000}
.stage{position:relative;width:var(--w);height:var(--h);overflow:hidden;background:radial-gradient(120% 80% at 50% 20%,#1c1712 0%,#0a0907 70%,#000 100%);color:var(--ink);font-family:'Inter',Arial,sans-serif;-webkit-font-smoothing:antialiased}
.frame{position:absolute;inset:120px;border:1px solid rgba(212,175,55,.35);pointer-events:none}
.frame::before,.frame::after{content:"";position:absolute;width:60px;height:60px;border:2px solid var(--accent)}
.frame::before{top:-2px;left:-2px;border-right:none;border-bottom:none}
.frame::after{bottom:-2px;right:-2px;border-left:none;border-top:none}
.safe{position:absolute;inset:340px 130px 340px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;z-index:2}
.orn{font-size:36px;color:var(--accent);letter-spacing:14px;margin-bottom:40px}
.quote{font-family:'Playfair Display',Georgia,serif;font-style:italic;font-weight:900;font-size:94px;line-height:1.16;letter-spacing:-.4px}
.author{margin-top:56px;font-size:28px;font-weight:500;letter-spacing:.28em;text-transform:uppercase;color:var(--accent)}
.brand{position:absolute;bottom:160px;left:0;right:0;text-align:center;font-size:18px;letter-spacing:.42em;text-transform:uppercase;color:rgba(163,151,122,.85);z-index:2}
</style></head><body>
<div class="stage"><div class="frame"></div><div class="safe">
<p class="orn">✦ ✦ ✦</p>
<p class="quote">We are what we repeatedly do. Excellence, then, is not an act but a habit.</p>
<p class="author">Aristotle</p>
</div><p class="brand">Daily Motivation</p></div>
</body></html>
