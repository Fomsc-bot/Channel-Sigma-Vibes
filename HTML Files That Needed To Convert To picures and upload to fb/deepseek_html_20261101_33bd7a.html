<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Quote 21</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,900&family=Inter:wght@500&display=swap" rel="stylesheet">
<style>
:root{--w:1080px;--h:1920px;--ink:#fff4e6;--accent:#ffb347;--soft:#e8b98a;}
*{margin:0;padding:0;box-sizing:border-box}body{background:#000}
.stage{position:relative;width:var(--w);height:var(--h);overflow:hidden;
background:linear-gradient(180deg,#1a0b2e 0%,#4a1942 30%,#c84b31 65%,#ffb347 88%,#ffe1a8 100%);
color:var(--ink);font-family:'Inter',Arial,sans-serif;-webkit-font-smoothing:antialiased}
.sun{position:absolute;top:52%;left:50%;transform:translate(-50%,-50%);width:340px;height:340px;border-radius:50%;background:radial-gradient(circle,#fff2cc 0%,#ffd28a 45%,rgba(255,180,80,0) 72%);filter:blur(2px);pointer-events:none}
.hills{position:absolute;bottom:0;left:0;right:0;height:380px;
background:linear-gradient(180deg,rgba(20,8,30,0) 0%,#150820 40%,#0a0410 100%);
clip-path:polygon(0 38%,14% 22%,30% 34%,48% 14%,66% 30%,84% 18%,100% 32%,100% 100%,0 100%);
pointer-events:none}
.safe{position:absolute;inset:300px 100px 340px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;z-index:2}
.quote{font-family:'Playfair Display',Georgia,serif;font-style:italic;font-weight:900;font-size:96px;line-height:1.14;letter-spacing:-.5px;text-shadow:0 4px 26px rgba(0,0,0,.55)}
.author{margin-top:56px;font-size:28px;font-weight:500;letter-spacing:.28em;text-transform:uppercase;color:var(--accent)}
.brand{position:absolute;bottom:120px;left:0;right:0;text-align:center;font-size:18px;letter-spacing:.44em;text-transform:uppercase;color:rgba(232,185,138,.85);z-index:3}
</style></head><body>
<div class="stage"><div class="sun"></div><div class="hills"></div><div class="safe">
<p class="quote">Every sunset brings the promise of a new dawn.</p>
<p class="author">Ralph Waldo Emerson</p>
</div><p class="brand">Daily Motivation</p></div>
</body></html>
