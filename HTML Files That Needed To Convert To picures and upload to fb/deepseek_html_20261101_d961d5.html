<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Quote 61</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,600;1,700&family=Inter:wght@500&display=swap" rel="stylesheet">
<style>
:root{--w:1080px;--h:1920px;--ink:#2b3a52;--accent:#5b7bb5;--soft:#7a8aa5;}
*{margin:0;padding:0;box-sizing:border-box}body{background:#000}
.stage{position:relative;width:var(--w);height:var(--h);overflow:hidden;
background:linear-gradient(180deg,#c7e0f4 0%,#a5caf0 35%,#e8d6f0 70%,#f8d9e8 100%);
color:var(--ink);font-family:'Inter',Arial,sans-serif;-webkit-font-smoothing:antialiased}
.cloud{position:absolute;border-radius:50%;background:radial-gradient(circle at 40% 40%,rgba(255,255,255,.95) 0%,rgba(255,255,255,.5) 45%,rgba(255,255,255,0) 75%);filter:blur(4px);pointer-events:none}
.c1{width:520px;height:260px;top:120px;left:-100px}
.c2{width:420px;height:220px;top:340px;right:-120px}
.c3{width:600px;height:300px;bottom:200px;left:-160px;opacity:.85}
.c4{width:380px;height:200px;bottom:80px;right:-80px;opacity:.9}
.safe{position:absolute;inset:300px 110px 340px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;z-index:2}
.dot{width:14px;height:14px;border-radius:50%;background:#fff;margin-bottom:56px;box-shadow:0 0 30px 10px rgba(255,255,255,.75)}
.quote{font-family:'Fraunces',Georgia,serif;font-style:italic;font-weight:700;font-size:104px;line-height:1.12;letter-spacing:-.4px;color:var(--ink);text-shadow:0 2px 20px rgba(255,255,255,.6)}
.author{margin-top:56px;font-size:28px;font-weight:500;letter-spacing:.28em;text-transform:uppercase;color:var(--accent)}
.brand{position:absolute;bottom:80px;left:0;right:0;text-align:center;font-size:18px;letter-spacing:.44em;text-transform:uppercase;color:rgba(122,138,165,.85);z-index:2}
</style></head><body>
<div class="stage">
<div class="cloud c1"></div><div class="cloud c2"></div>
<div class="cloud c3"></div><div class="cloud c4"></div>
<div class="safe">
<div class="dot"></div>
<p class="quote">Your dreams are valid. Keep floating toward them.</p>
<p class="author">Unknown</p>
</div><p class="brand">Daily Motivation</p></div>
</body></html>
