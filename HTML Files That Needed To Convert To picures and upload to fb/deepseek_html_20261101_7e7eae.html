<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Quote 56</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--w:1080px;--h:1920px;--ink:#ffffff;--accent:#f43f5e;--soft:#9aa0ac;}
*{margin:0;padding:0;box-sizing:border-box}body{background:#000}
.stage{position:relative;width:var(--w);height:var(--h);overflow:hidden;
background:
radial-gradient(60% 40% at 20% 10%,#1f2937 0%,transparent 55%),
linear-gradient(170deg,#111827 0%,#0b0f18 55%,#050609 100%);
color:var(--ink);font-family:'Inter',Arial,sans-serif;-webkit-font-smoothing:antialiased}
.stripe{position:absolute;top:0;right:0;width:22px;height:100%;background:var(--accent);z-index:1}
.stripe::before{content:"";position:absolute;top:0;left:-14px;width:14px;height:100%;background:rgba(244,63,94,.35)}
.big{position:absolute;top:180px;left:80px;font-family:'Archivo Black',Arial,sans-serif;font-size:340px;line-height:.8;color:var(--accent);letter-spacing:-14px;opacity:.16;z-index:1;user-select:none}
.safe{position:absolute;inset:300px 120px 320px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;z-index:2}
.kicker{font-size:22px;letter-spacing:.5em;text-transform:uppercase;color:var(--accent);margin-bottom:44px;font-weight:700}
.quote{font-family:'Archivo Black',Arial,sans-serif;font-size:96px;line-height:1.1;letter-spacing:-1.5px;text-transform:uppercase}
.author{margin-top:56px;font-size:26px;font-weight:500;letter-spacing:.3em;text-transform:uppercase;color:var(--soft)}
.brand{position:absolute;bottom:80px;left:0;right:0;text-align:center;font-size:18px;letter-spacing:.44em;text-transform:uppercase;color:rgba(154,160,172,.7);z-index:2}
</style></head><body>
<div class="stage"><div class="stripe"></div><div class="big">01</div><div class="safe">
<p class="kicker">Day one</p>
<p class="quote">Begin again. And again.</p>
<p class="author">Unknown</p>
</div><p class="brand">Daily Motivation</p></div>
</body></html>
