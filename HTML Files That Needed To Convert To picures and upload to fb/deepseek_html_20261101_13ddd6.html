<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Quote 31</title>
<link href="https://fonts.googleapis.com/css2?family=Special+Elite&family=Inter:wght@500&display=swap" rel="stylesheet">
<style>
:root{--w:1080px;--h:1920px;--ink:#2b2418;--accent:#8a3a1e;--soft:#6b5a3e;}
*{margin:0;padding:0;box-sizing:border-box}body{background:#000}
.stage{position:relative;width:var(--w);height:var(--h);overflow:hidden;
background:
repeating-linear-gradient(90deg,rgba(0,0,0,.03) 0 2px,transparent 2px 6px),
linear-gradient(180deg,#d8c29a 0%,#cbb187 55%,#b89c6f 100%);
color:var(--ink);font-family:'Special Elite',Courier,monospace;-webkit-font-smoothing:antialiased}
.stage::after{content:"";position:absolute;inset:0;background:radial-gradient(75% 55% at 50% 50%,rgba(0,0,0,0) 55%,rgba(60,40,15,.28) 100%);pointer-events:none}
.stamp{position:absolute;top:150px;left:50%;transform:translateX(-50%) rotate(-6deg);
width:200px;height:200px;border:4px dashed rgba(138,58,30,.75);border-radius:50%;
display:flex;align-items:center;justify-content:center;color:var(--accent);
font-size:26px;letter-spacing:.2em;text-transform:uppercase;opacity:.85;z-index:2}
.safe{position:absolute;inset:420px 110px 340px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;z-index:2}
.quote{font-family:'Special Elite',Courier,monospace;font-size:92px;line-height:1.2;letter-spacing:-.5px}
.author{margin-top:56px;font-size:28px;letter-spacing:.18em;text-transform:uppercase;color:var(--accent);border-top:2px solid rgba(138,58,30,.4);border-bottom:2px solid rgba(138,58,30,.4);padding:14px 28px}
.brand{position:absolute;bottom:120px;left:0;right:0;text-align:center;font-size:18px;letter-spacing:.4em;text-transform:uppercase;color:rgba(107,90,62,.85);z-index:2}
</style></head><body>
<div class="stage"><div class="stamp">EST. 2026</div><div class="safe">
<p class="quote">Do what you can, with what you have, where you are.</p>
<p class="author">Theodore Roosevelt</p>
</div><p class="brand">Daily Motivation</p></div>
</body></html>
