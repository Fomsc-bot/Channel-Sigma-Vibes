<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Quote 42</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900;1,700&family=Inter:wght@500&display=swap" rel="stylesheet">
<style>
:root{--w:1080px;--h:1920px;--ink:#1a1a1a;--accent:#8b0000;--soft:#5a5a5a;}
*{margin:0;padding:0;box-sizing:border-box}body{background:#000}
.stage{position:relative;width:var(--w);height:var(--h);overflow:hidden;
background:
repeating-linear-gradient(90deg,rgba(0,0,0,.025) 0 1px,transparent 1px 3px),
linear-gradient(180deg,#f6f2e8 0%,#efe9d8 55%,#e5ddc7 100%);
color:var(--ink);font-family:'Inter',Arial,sans-serif;-webkit-font-smoothing:antialiased}
.stage::after{content:"";position:absolute;inset:0;background:radial-gradient(75% 55% at 50% 50%,rgba(0,0,0,0) 60%,rgba(80,60,30,.16) 100%);pointer-events:none}
.masthead{position:absolute;top:90px;left:80px;right:80px;text-align:center;border-bottom:3px double var(--ink);padding-bottom:24px;z-index:2}
.masthead h1{font-family:'Playfair Display',Georgia,serif;font-weight:900;font-size:64px;letter-spacing:.02em;text-transform:uppercase}
.masthead p{font-size:16px;letter-spacing:.4em;text-transform:uppercase;color:var(--soft);margin-top:12px}
.safe{position:absolute;inset:340px 110px 340px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;z-index:2}
.label{font-size:18px;letter-spacing:.5em;text-transform:uppercase;color:var(--accent);margin-bottom:40px;font-weight:700}
.quote{font-family:'Playfair Display',Georgia,serif;font-style:italic;font-weight:700;font-size:100px;line-height:1.14;letter-spacing:-.4px}
.rule{width:120px;height:2px;background:var(--ink);margin-top:52px}
.author{margin-top:24px;font-size:24px;font-weight:500;letter-spacing:.3em;text-transform:uppercase;color:var(--accent)}
.brand{position:absolute;bottom:80px;left:0;right:0;text-align:center;font-size:16px;letter-spacing:.44em;text-transform:uppercase;color:var(--soft);z-index:2;border-top:1px solid rgba(90,90,90,.4);padding-top:20px;margin:0 80px}
</style></head><body>
<div class="stage">
<div class="masthead"><h1>The Daily Quote</h1><p>· Motivation · Wisdom · Inspiration ·</p></div>
<div class="safe">
<p class="label">Today&rsquo;s Column</p>
<p class="quote">The only way to do great work is to love what you do.</p>
<div class="rule"></div>
<p class="author">Steve Jobs</p>
</div><p class="brand">Daily Motivation</p></div>
</body></html>
