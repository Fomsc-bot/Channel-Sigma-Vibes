<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Quote 73</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Space+Mono:wght@700&display=swap" rel="stylesheet">
<style>
:root{--w:1080px;--h:1920px;--ink:#111;--accent:#f97316;--soft:#666;}
*{margin:0;padding:0;box-sizing:border-box}body{background:#000}
.stage{position:relative;width:var(--w);height:var(--h);overflow:hidden;
background:
repeating-linear-gradient(90deg,rgba(0,0,0,.04) 0 1px,transparent 1px 8px),
repeating-linear-gradient(0deg,rgba(0,0,0,.04) 0 1px,transparent 1px 8px),
linear-gradient(165deg,#d4d4d4 0%,#bdbdbd 55%,#a3a3a3 100%);
color:var(--ink);font-family:'Space Mono',monospace;-webkit-font-smoothing:antialiased}
.block{position:absolute;background:#8a8a8a;box-shadow:inset 0 0 0 1px rgba(0,0,0,.2)}
.block.a{top:80px;left:80px;width:340px;height:180px;background:linear-gradient(135deg,#737373,#525252)}
.block.b{bottom:80px;right:80px;width:420px;height:220px;background:linear-gradient(135deg,#a3a3a3,#737373)}
.block.c{top:0;right:0;width:120px;height:100%;background:var(--accent)}
.stage::after{content:"";position:absolute;inset:0;background:radial-gradient(75% 55% at 50% 50%,rgba(0,0,0,0) 55%,rgba(0,0,0,.25) 100%);pointer-events:none}
.safe{position:absolute;inset:340px 110px 340px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;z-index:2}
.label{font-size:20px;letter-spacing:.4em;text-transform:uppercase;color:var(--accent);margin-bottom:44px;font-weight:700;background:#111;color:#f97316;padding:10px 20px}
.quote{font-family:'Archivo Black',Arial,sans-serif;font-size:96px;line-height:1.08;letter-spacing:-1.5px;text-transform:uppercase}
.author{margin-top:56px;font-size:24px;letter-spacing:.3em;text-transform:uppercase;color:var(--soft)}
.brand{position:absolute;bottom:80px;left:0;right:0;text-align:center;font-size:16px;letter-spacing:.44em;text-transform:uppercase;color:rgba(102,102,102,.85);z-index:3}
</style></head><body>
<div class="stage">
<div class="block a"></div><div class="block b"></div><div class="block c"></div>
<div class="safe">
<p class="label">FORM FOLLOWS WILL</p>
<p class="quote">Build it rough. Refine it later.</p>
<p class="author">Unknown</p>
</div><p class="brand">Daily Motivation</p></div>
</body></html>
