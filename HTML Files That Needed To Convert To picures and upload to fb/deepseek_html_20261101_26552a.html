<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Quote 19</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;1,700&family=Inter:wght@500&display=swap" rel="stylesheet">
<style>
:root{--w:1080px;--h:1920px;--ink:#2f3e2f;--accent:#6b8f5e;--soft:#7a8b74;}
*{margin:0;padding:0;box-sizing:border-box}body{background:#000}
.stage{position:relative;width:var(--w);height:var(--h);overflow:hidden;
background:linear-gradient(180deg,#f2f4e8 0%,#e4e9d4 55%,#d3dcc2 100%);
color:var(--ink);font-family:'Inter',Arial,sans-serif;-webkit-font-smoothing:antialiased}
.leaf{position:absolute;width:340px;height:340px;opacity:.55}
.leaf.tl{top:60px;left:-90px;transform:rotate(-15deg)}
.leaf.br{bottom:60px;right:-90px;transform:rotate(160deg)}
.leaf svg{width:100%;height:100%}
.safe{position:absolute;inset:320px 110px 340px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;z-index:2}
.sprig{font-size:44px;color:var(--accent);margin-bottom:44px}
.quote{font-family:'Cormorant Garamond',Georgia,serif;font-style:italic;font-weight:700;font-size:104px;line-height:1.12;letter-spacing:-.5px}
.author{margin-top:56px;font-size:28px;font-weight:500;letter-spacing:.28em;text-transform:uppercase;color:var(--accent)}
.brand{position:absolute;bottom:160px;left:0;right:0;text-align:center;font-size:18px;letter-spacing:.44em;text-transform:uppercase;color:rgba(122,139,116,.85);z-index:2}
</style></head><body>
<div class="stage">
<svg class="leaf tl" viewBox="0 0 200 200" fill="none" stroke="#6b8f5e" stroke-width="1.5">
<path d="M100 190 C60 150 60 90 100 20 C140 90 140 150 100 190Z"/>
<path d="M100 30 L100 185"/>
<path d="M100 80 L70 60 M100 80 L130 60 M100 120 L70 100 M100 120 L130 100"/>
</svg>
<svg class="leaf br" viewBox="0 0 200 200" fill="none" stroke="#6b8f5e" stroke-width="1.5">
<path d="M100 190 C60 150 60 90 100 20 C140 90 140 150 100 190Z"/>
<path d="M100 30 L100 185"/>
<path d="M100 80 L70 60 M100 80 L130 60 M100 120 L70 100 M100 120 L130 100"/>
</svg>
<div class="safe">
<p class="sprig">❧</p>
<p class="quote">Grow through what you go through.</p>
<p class="author">Unknown</p>
</div><p class="brand">Daily Motivation</p></div>
</body></html>
