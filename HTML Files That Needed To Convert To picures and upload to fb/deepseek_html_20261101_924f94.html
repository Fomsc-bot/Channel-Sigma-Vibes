<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Quote 34</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;800&family=Inter:wght@500&display=swap" rel="stylesheet">
<style>
:root{--w:1080px;--h:1920px;--ink:#2f2a3c;--accent:#d9678a;--soft:#6b6478;}
*{margin:0;padding:0;box-sizing:border-box}body{background:#000}
.stage{position:relative;width:var(--w);height:var(--h);overflow:hidden;
background:
radial-gradient(circle at 15% 20%,#f2a3b8 0 2.2%,transparent 2.3%),
radial-gradient(circle at 82% 12%,#9ad7c7 0 1.8%,transparent 1.9%),
radial-gradient(circle at 35% 65%,#f5d56e 0 2.6%,transparent 2.7%),
radial-gradient(circle at 70% 78%,#c9b3ff 0 2%,transparent 2.1%),
radial-gradient(circle at 10% 88%,#7fc7ff 0 1.5%,transparent 1.6%),
radial-gradient(circle at 92% 55%,#f2a3b8 0 1.6%,transparent 1.7%),
linear-gradient(180deg,#fdf8f3 0%,#f7ede1 55%,#f2e2d0 100%);
color:var(--ink);font-family:'Inter',Arial,sans-serif;-webkit-font-smoothing:antialiased}
.stage::after{content:"";position:absolute;inset:0;background:radial-gradient(75% 55% at 50% 50%,rgba(255,255,255,.65) 0%,rgba(255,255,255,0) 60%);pointer-events:none}
.safe{position:absolute;inset:300px 100px 320px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;z-index:2}
.kicker{font-size:22px;font-weight:700;letter-spacing:.42em;text-transform:uppercase;color:var(--accent);margin-bottom:48px;background:rgba(255,255,255,.85);padding:12px 26px;border-radius:40px}
.quote{font-family:'Outfit',Arial,sans-serif;font-weight:800;font-size:100px;line-height:1.12;letter-spacing:-1px}
.author{margin-top:56px;font-size:28px;font-weight:500;letter-spacing:.28em;text-transform:uppercase;color:var(--soft)}
.brand{position:absolute;bottom:80px;left:0;right:0;text-align:center;font-size:18px;letter-spacing:.44em;text-transform:uppercase;color:rgba(107,100,120,.8);z-index:2}
</style></head><body>
<div class="stage"><div class="safe">
<p class="kicker">Every day</p>
<p class="quote">You are one decision away from a totally different life.</p>
<p class="author">Unknown</p>
</div><p class="brand">Daily Motivation</p></div>
</body></html>
