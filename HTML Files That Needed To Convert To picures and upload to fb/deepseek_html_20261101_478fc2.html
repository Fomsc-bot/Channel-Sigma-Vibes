<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Quote 05</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@1,600;1,900&family=Caveat:wght@600&family=Inter:wght@500&display=swap" rel="stylesheet">
<style>
:root{--w:1080px;--h:1920px;--ink:#fff6e8;--accent:#ffb703;}
*{margin:0;padding:0;box-sizing:border-box}body{background:#000}
.stage{position:relative;width:var(--w);height:var(--h);overflow:hidden;color:var(--ink);
background:radial-gradient(120% 70% at 50% 105%,#ffb703 0%,#f77f00 32%,#d62828 60%,#3d0c11 100%);
-webkit-font-smoothing:antialiased;font-family:'Inter',Arial,sans-serif}
.stage::before{content:"";position:absolute;inset:0;background:radial-gradient(70% 50% at 50% 50%,rgba(0,0,0,0) 55%,rgba(0,0,0,.32) 100%);pointer-events:none}
.safe{position:absolute;inset:300px 96px 320px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;z-index:2}
.quote{font-family:'Playfair Display',Georgia,serif;font-style:italic;font-weight:900;font-size:96px;line-height:1.14;letter-spacing:-.5px}
.script{font-family:'Caveat',cursive;font-size:64px;color:var(--accent);margin:0 0 24px;font-weight:600}
.author{margin-top:56px;font-size:28px;font-weight:500;letter-spacing:.24em;text-transform:uppercase;color:rgba(255,246,232,.82)}
.brand{position:absolute;bottom:80px;left:0;right:0;text-align:center;font-size:20px;letter-spacing:.4em;text-transform:uppercase;color:rgba(255,246,232,.6);z-index:2}
</style></head><body>
<div class="stage"><div class="safe">
<p class="script">good morning</p>
<p class="quote">New day, new strength, new thoughts.</p>
<p class="author">Eleanor Roosevelt</p>
</div><p class="brand">Daily Motivation</p></div>
</body></html>
