<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Quote 77</title>
<link href="https://fonts.googleapis.com/css2?family=Special+Elite&family=Playfair+Display:ital,wght@0,700;1,900&display=swap" rel="stylesheet">
<style>
:root{--w:1080px;--h:1920px;--ink:#3a2818;--accent:#b8860b;--soft:#7a5a3a;}
*{margin:0;padding:0;box-sizing:border-box}body{background:#000}
.stage{position:relative;width:var(--w);height:var(--h);overflow:hidden;
background:
radial-gradient(60% 40% at 30% 25%,#5a3a20 0%,transparent 55%),
radial-gradient(55% 45% at 80% 85%,#4a2a12 0%,transparent 55%),
linear-gradient(170deg,#4a2c14 0%,#36200f 55%,#1e1208 100%);
color:var(--ink);font-family:'Special Elite',monospace;-webkit-font-smoothing:antialiased}
.stitch{position:absolute;left:80px;right:80px;height:2px;background:repeating-linear-gradient(90deg,var(--accent) 0 8px,transparent 8px 14px);opacity:.55}
.stitch.t{top:140px}
.stitch.b{bottom:140px}
.seam{position:absolute;left:80px;right:80px;top:160px;height:1px;background:rgba(184,134,11,.25)}
.seam.b{top:auto;bottom:160px}
.wax{position:absolute;top:200px;right:120px;width:120px;height:120px;border-radius:50%;background:radial-gradient(circle at 40% 40%,#b91c1c,#7f1d1d);box-shadow:0 6px 20px rgba(0,0,0,.5),inset -4px -4px 12px rgba(0,0,0,.4);z-index:2;opacity:.85}
.wax::after{content:"DM";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:'Playfair Display',serif;font-weight:700;color:#fef3c7;font-size:38px;text-shadow:0 1px 2px rgba(0,0,0,.5)}
.stage::after{content:"";position:absolute;inset:0;background:radial-gradient(75% 55% at 50% 50%,rgba(0,0,0,0) 60%,rgba(0,0,0,.5) 100%);pointer-events:none}
.safe{position:absolute;inset:340px 130px 340px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;z-index:3}
.quote{font-family:'Playfair Display',Georgia,serif;font-style:italic;font-weight:900;font-size:104px;line-height:1.14;letter-spacing:-.4px;color:#faf3e8;text-shadow:0 3px 20px rgba(0,0,0,.6)}
.author{margin-top:56px;font-family:'Special Elite',monospace;font-size:24px;letter-spacing:.28em;text-transform:uppercase;color:var(--accent)}
.brand{position:absolute;bottom:100px;left:0;right:0;text-align:center;font-family:'Special Elite',monospace;font-size:16px;letter-spacing:.44em;text-transform:uppercase;color:rgba(122,90,58,.85);z-index:3}
</style></head><body>
<div class="stage">
<div class="stitch t"></div><div class="stitch b"></div>
<div class="seam"></div><div class="seam b"></div>
<div class="wax"></div>
<div class="safe">
<p class="quote">Write your own story. Or someone else will.</p>
<p class="author">Unknown</p>
</div><p class="brand">Daily Motivation</p></div>
</body></html>
