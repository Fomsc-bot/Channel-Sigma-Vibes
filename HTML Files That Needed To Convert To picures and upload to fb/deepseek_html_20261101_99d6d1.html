<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Quote 79</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,600;1,700&family=Inter:wght@500&display=swap" rel="stylesheet">
<style>
:root{--w:1080px;--h:1920px;--ink:#2a1f3a;--accent:#7c3aed;--soft:#6a5a7a;}
*{margin:0;padding:0;box-sizing:border-box}body{background:#000}
.stage{position:relative;width:var(--w);height:var(--h);overflow:hidden;
background:linear-gradient(165deg,#f5eaff 0%,#e0d0f5 55%,#c8b5e8 100%);
color:var(--ink);font-family:'Inter',Arial,sans-serif;-webkit-font-smoothing:antialiased}
.fold{position:absolute;pointer-events:none;opacity:.9}
.fold svg{width:100%;height:100%}
.fold.a{top:0;left:0;width:520px;height:520px}
.fold.b{bottom:0;right:0;width:560px;height:560px;transform:rotate(180deg)}
.fold.c{top:40%;right:0;width:320px;height:320px;transform:rotate(90deg);opacity:.55}
.stage::after{content:"";position:absolute;inset:0;background:radial-gradient(75% 55% at 50% 50%,rgba(0,0,0,0) 60%,rgba(60,30,90,.18) 100%);pointer-events:none}
.safe{position:absolute;inset:320px 120px 340px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;z-index:2}
.quote{font-family:'Fraunces',Georgia,serif;font-style:italic;font-weight:700;font-size:104px;line-height:1.12;letter-spacing:-.4px}
.author{margin-top:56px;font-size:26px;font-weight:500;letter-spacing:.3em;text-transform:uppercase;color:var(--accent)}
.brand{position:absolute;bottom:160px;left:0;right:0;text-align:center;font-size:18px;letter-spacing:.44em;text-transform:uppercase;color:rgba(106,90,122,.85);z-index:3}
</style></head><body>
<div class="stage">
<svg class="fold a" viewBox="0 0 400 400" fill="none" stroke="#7c3aed" stroke-width="1.3">
<path d="M0 0 L200 0 L200 200 Z" fill="rgba(124,58,237,.10)"/>
<path d="M0 0 L0 200 L200 200 Z" fill="rgba(124,58,237,.16)"/>
<path d="M200 0 L400 0 L400 200 L200 200 Z" fill="rgba(124,58,237,.06)"/>
<path d="M0 200 L200 200 L200 400 L0 400 Z" fill="rgba(124,58,237,.08)"/>
<path d="M200 200 L400 200 L400 400 L200 400 Z" fill="rgba(124,58,237,.12)"/>
</svg>
<svg class="fold b" viewBox="0 0 400 400" fill="none" stroke="#7c3aed" stroke-width="1.3">
<path d="M0 0 L200 0 L200 200 Z" fill="rgba(124,58,237,.10)"/>
<path d="M0 0 L0 200 L200 200 Z" fill="rgba(124,58,237,.16)"/>
<path d="M200 0 L400 0 L400 200 L200 200 Z" fill="rgba(124,58,237,.06)"/>
<path d="M0 200 L200 200 L200 400 L0 400 Z" fill="rgba(124,58,237,.08)"/>
<path d="M200 200 L400 200 L400 400 L200 400 Z" fill="rgba(124,58,237,.12)"/>
</svg>
<svg class="fold c" viewBox="0 0 400 400" fill="none" stroke="#7c3aed" stroke-width="1.3">
<path d="M0 0 L200 0 L200 200 Z" fill="rgba(124,58,237,.10)"/>
<path d="M0 0 L0 200 L200 200 Z" fill="rgba(124,58,237,.16)"/>
</svg>
<div class="safe">
<p class="quote">Fold a new path when the old one tears.</p>
<p class="author">Unknown</p>
</div><p class="brand">Daily Motivation</p></div>
</body></html>
