<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Quote 17</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Inter:wght@500&display=swap" rel="stylesheet">
<style>
:root{--w:1080px;--h:1920px;--ink:#eef2ff;--accent:#8b9dff;--soft:#8a90b8;}
*{margin:0;padding:0;box-sizing:border-box}body{background:#000}
.stage{position:relative;width:var(--w);height:var(--h);overflow:hidden;
background:
radial-gradient(60% 40% at 75% 20%,#2a1b5c 0%,transparent 55%),
radial-gradient(50% 40% at 20% 75%,#132a5c 0%,transparent 55%),
linear-gradient(180deg,#05060f 0%,#0a0e24 50%,#04050c 100%);
color:var(--ink);font-family:'Inter',Arial,sans-serif;-webkit-font-smoothing:antialiased}
.stage::before{content:"";position:absolute;inset:0;
background-image:
radial-gradient(1.6px 1.6px at 12% 18%,#fff 50%,transparent 51%),
radial-gradient(1.4px 1.4px at 78% 12%,#fff 50%,transparent 51%),
radial-gradient(1.8px 1.8px at 33% 42%,#cfd8ff 50%,transparent 51%),
radial-gradient(1.3px 1.3px at 88% 60%,#fff 50%,transparent 51%),
radial-gradient(1.6px 1.6px at 8% 72%,#fff 50%,transparent 51%),
radial-gradient(1.5px 1.5px at 62% 82%,#cfd8ff 50%,transparent 51%),
radial-gradient(1.2px 1.2px at 44% 8%,#fff 50%,transparent 51%),
radial-gradient(1.7px 1.7px at 92% 88%,#fff 50%,transparent 51%);
opacity:.85;pointer-events:none}
.stage::after{content:"";position:absolute;inset:0;background:radial-gradient(65% 50% at 50% 50%,rgba(0,0,0,0) 55%,rgba(0,0,0,.55) 100%);pointer-events:none}
.safe{position:absolute;inset:300px 100px 320px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;z-index:2}
.orbit{font-size:44px;color:var(--accent);margin-bottom:40px;letter-spacing:16px}
.quote{font-family:'Orbitron',Arial,sans-serif;font-weight:900;font-size:82px;line-height:1.18;letter-spacing:-.5px;text-shadow:0 0 34px rgba(139,157,255,.5)}
.author{margin-top:56px;font-size:28px;font-weight:500;letter-spacing:.3em;text-transform:uppercase;color:var(--accent)}
.brand{position:absolute;bottom:80px;left:0;right:0;text-align:center;font-size:20px;letter-spacing:.44em;text-transform:uppercase;color:rgba(138,144,184,.75);z-index:2}
</style></head><body>
<div class="stage"><div class="safe">
<p class="orbit">✦ ✧ ✦</p>
<p class="quote">Shoot for the moon. Even if you miss, you&rsquo;ll land among the stars.</p>
<p class="author">Norman Vincent Peale</p>
</div><p class="brand">Daily Motivation</p></div>
</body></html>
