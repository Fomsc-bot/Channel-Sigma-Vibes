<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Quote 09</title>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,600;0,700;1,700&family=Inter:wght@500&display=swap" rel="stylesheet">
<style>
:root{--w:1080px;--h:1920px;--ink:#2b2419;--accent:#8b2e1f;--soft:#6b5f4a;}
*{margin:0;padding:0;box-sizing:border-box}body{background:#000}
.stage{position:relative;width:var(--w);height:var(--h);overflow:hidden;
background:
radial-gradient(80% 60% at 50% 30%,rgba(255,250,235,.9) 0%,rgba(245,235,210,0) 70%),
linear-gradient(180deg,#efe3c6 0%,#e2d2ab 55%,#cdb887 100%);
color:var(--ink);font-family:'Inter',Arial,sans-serif;-webkit-font-smoothing:antialiased}
.stage::after{content:"";position:absolute;inset:0;background:radial-gradient(70% 55% at 50% 50%,rgba(0,0,0,0) 55%,rgba(90,60,20,.18) 100%);pointer-events:none}
.safe{position:absolute;inset:320px 110px 340px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;z-index:2}
.orn{font-family:'EB Garamond',Georgia,serif;font-size:44px;color:var(--accent);margin-bottom:44px;letter-spacing:10px}
.quote{font-family:'EB Garamond',Georgia,serif;font-weight:700;font-size:96px;line-height:1.16;letter-spacing:-.3px}
.author{margin-top:56px;font-size:28px;font-weight:500;letter-spacing:.28em;text-transform:uppercase;color:var(--accent)}
.brand{position:absolute;bottom:160px;left:0;right:0;text-align:center;font-size:18px;letter-spacing:.42em;text-transform:uppercase;color:var(--soft);z-index:2}
</style></head><body>
<div class="stage"><div class="safe">
<p class="orn">❦</p>
<p class="quote">It always seems impossible until it&rsquo;s done.</p>
<p class="author">Nelson Mandela</p>
</div><p class="brand">Daily Motivation</p></div>
</body></html>
