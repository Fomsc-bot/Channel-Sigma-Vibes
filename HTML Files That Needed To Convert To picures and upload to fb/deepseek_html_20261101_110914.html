<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Quote 20</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@500&display=swap" rel="stylesheet">
<style>
:root{--w:1080px;--h:1920px;--ink:#ffffff;--accent:#ffffff;--soft:#c8c8c8;}
*{margin:0;padding:0;box-sizing:border-box}body{background:#000}
.stage{position:relative;width:var(--w);height:var(--h);overflow:hidden;
background:url('https://images.unsplash.com/photo-1506905925346-21bda4d32df4?auto=format&fit=crop&w=1080&q=80') center/cover no-repeat;
filter:grayscale(100%) contrast(1.08);
color:var(--ink);font-family:'Inter',Arial,sans-serif;-webkit-font-smoothing:antialiased}
.stage::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.55) 0%,rgba(0,0,0,.4) 40%,rgba(0,0,0,.78) 100%);z-index:1}
.safe{position:absolute;inset:300px 100px 320px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;z-index:2}
.quote{font-family:'Bebas Neue',Arial,sans-serif;font-size:140px;line-height:1.0;letter-spacing:2px;text-transform:uppercase}
.rule{width:120px;height:2px;background:var(--accent);margin:52px 0 44px}
.author{font-size:26px;font-weight:500;letter-spacing:.32em;text-transform:uppercase;color:var(--soft)}
.brand{position:absolute;bottom:80px;left:0;right:0;text-align:center;font-size:18px;letter-spacing:.44em;text-transform:uppercase;color:rgba(200,200,200,.75);z-index:2}
</style></head><body>
<div class="stage"><div class="safe">
<p class="quote">Stay strong</p>
<div class="rule"></div>
<p class="author">Unknown</p>
</div><p class="brand">Daily Motivation</p></div>
</body></html>
