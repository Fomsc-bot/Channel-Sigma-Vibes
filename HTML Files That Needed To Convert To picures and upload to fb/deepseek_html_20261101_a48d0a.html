<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Quote 25</title>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--w:1080px;--h:1920px;--ink:#fff;--bg:#b91c1c;--accent:#fde047;--soft:#ffd5d5;}
*{margin:0;padding:0;box-sizing:border-box}body{background:#000}
.stage{position:relative;width:var(--w);height:var(--h);overflow:hidden;
background:
repeating-linear-gradient(45deg,rgba(255,255,255,.04) 0 40px,transparent 40px 80px),
linear-gradient(165deg,#dc2626 0%,#b91c1c 55%,#7f1010 100%);
color:var(--ink);font-family:'Inter',Arial,sans-serif;-webkit-font-smoothing:antialiased}
.stage::before{content:"";position:absolute;inset:0;background:radial-gradient(70% 50% at 50% 50%,rgba(0,0,0,0) 55%,rgba(0,0,0,.42) 100%);pointer-events:none}
.safe{position:absolute;inset:300px 100px 320px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;z-index:2}
.alert{display:inline-block;font-size:22px;font-weight:700;letter-spacing:.44em;text-transform:uppercase;background:var(--accent);color:#7f1010;padding:16px 34px;border-radius:6px;margin-bottom:52px;box-shadow:0 10px 30px rgba(0,0,0,.35)}
.quote{font-family:'Anton',Arial,sans-serif;font-size:116px;line-height:1.04;text-transform:uppercase;letter-spacing:-1.5px;text-shadow:0 6px 24px rgba(0,0,0,.35)}
.author{margin-top:56px;font-size:28px;font-weight:700;letter-spacing:.3em;text-transform:uppercase;color:var(--accent)}
.brand{position:absolute;bottom:80px;left:0;right:0;text-align:center;font-size:19px;letter-spacing:.44em;text-transform:uppercase;color:rgba(255,213,213,.8);z-index:2}
</style></head><body>
<div class="stage"><div class="safe">
<p class="alert">Read this</p>
<p class="quote">Stop doubting yourself. You&rsquo;re already capable.</p>
<p class="author">Unknown</p>
</div><p class="brand">Daily Motivation</p></div>
</body></html>
