<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Quote 57</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=Inter:wght@500&display=swap" rel="stylesheet">
<style>
:root{--w:1080px;--h:1920px;--ink:#ffffff;--accent:#a78bfa;--soft:#8a8aa0;}
*{margin:0;padding:0;box-sizing:border-box}body{background:#000}
.stage{position:relative;width:var(--w);height:var(--h);overflow:hidden;background:#0a0a12;
color:var(--ink);font-family:'Inter',Arial,sans-serif;-webkit-font-smoothing:antialiased}
.grid{position:absolute;inset:0;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(6,1fr);gap:1px;background:rgba(167,139,250,.12)}
.cell{background:#0a0a12;position:relative;overflow:hidden}
.cell::before{content:"";position:absolute;inset:0;background:linear-gradient(135deg,rgba(167,139,250,.06),rgba(167,139,250,0))}
.cell.on::after{content:"";position:absolute;inset:0;background:radial-gradient(circle at 50% 50%,rgba(167,139,250,.28),transparent 70%)}
.overlay{position:absolute;inset:0;background:radial-gradient(70% 50% at 50% 50%,rgba(10,10,18,.55) 0%,rgba(10,10,18,.85) 70%,rgba(10,10,18,.95) 100%);z-index:1}
.safe{position:absolute;inset:300px 100px 320px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;z-index:2}
.tag{font-size:20px;letter-spacing:.5em;text-transform:uppercase;color:var(--accent);margin-bottom:48px;font-weight:600;padding:10px 22px;border:1px solid rgba(167,139,250,.4)}
.quote{font-family:'Space Grotesk',Arial,sans-serif;font-weight:700;font-size:100px;line-height:1.12;letter-spacing:-1px}
.author{margin-top:56px;font-size:26px;font-weight:500;letter-spacing:.3em;text-transform:uppercase;color:var(--accent)}
.brand{position:absolute;bottom:80px;left:0;right:0;text-align:center;font-size:18px;letter-spacing:.44em;text-transform:uppercase;color:rgba(138,138,160,.75);z-index:2}
</style></head><body>
<div class="stage">
<div class="grid">
<div class="cell on"></div><div class="cell"></div><div class="cell"></div>
<div class="cell"></div><div class="cell on"></div><div class="cell"></div>
<div class="cell on"></div><div class="cell"></div><div class="cell on"></div>
<div class="cell"></div><div class="cell"></div><div class="cell"></div>
<div class="cell on"></div><div class="cell on"></div><div class="cell"></div>
<div class="cell"></div><div class="cell"></div><div class="cell on"></div>
</div>
<div class="overlay"></div>
<div class="safe">
<p class="tag">Framework</p>
<p class="quote">Structure creates freedom.</p>
<p class="author">Unknown</p>
</div><p class="brand">Daily Motivation</p></div>
</body></html>
