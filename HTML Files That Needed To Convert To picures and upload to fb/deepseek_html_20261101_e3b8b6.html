<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Quote 14</title>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Inter:wght@500&display=swap" rel="stylesheet">
<style>
:root{--w:1080px;--h:1920px;--ink:#2a2b2e;--accent:#c0582b;--soft:#6c6e73;}
*{margin:0;padding:0;box-sizing:border-box}body{background:#000}
.stage{position:relative;width:var(--w);height:var(--h);overflow:hidden;
background:
repeating-linear-gradient(180deg,rgba(0,0,0,.035) 0 1px,transparent 1px 44px),
linear-gradient(180deg,#fdfaf1 0%,#f7f0dd 60%,#efe4ca 100%);
color:var(--ink);font-family:'Inter',Arial,sans-serif;-webkit-font-smoothing:antialiased}
.stage::after{content:"";position:absolute;inset:0;background:radial-gradient(75% 55% at 50% 50%,rgba(0,0,0,0) 60%,rgba(120,90,40,.14) 100%);pointer-events:none}
.safe{position:absolute;inset:320px 110px 340px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;z-index:2}
.pin{width:22px;height:22px;border-radius:50%;background:var(--accent);box-shadow:0 6px 14px rgba(150,60,20,.35);margin-bottom:56px}
.quote{font-family:'Caveat',cursive;font-weight:700;font-size:118px;line-height:1.06;letter-spacing:-.5px}
.author{margin-top:56px;font-size:26px;font-weight:500;letter-spacing:.26em;text-transform:uppercase;color:var(--accent)}
.brand{position:absolute;bottom:160px;left:0;right:0;text-align:center;font-size:18px;letter-spacing:.42em;text-transform:uppercase;color:var(--soft);z-index:2}
</style></head><body>
<div class="stage"><div class="safe">
<div class="pin"></div>
<p class="quote">Small steps every day.</p>
<p class="author">Daily Motivation</p>
</div><p class="brand">Daily Motivation</p></div>
</body></html>
