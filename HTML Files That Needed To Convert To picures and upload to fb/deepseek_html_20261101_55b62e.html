<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Quote 58</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900&family=Inter:wght@500&display=swap" rel="stylesheet">
<style>
:root{--w:1080px;--h:1920px;--ink:#3a1a05;--accent:#c2410c;--soft:#7a4a2a;}
*{margin:0;padding:0;box-sizing:border-box}body{background:#000}
.stage{position:relative;width:var(--w);height:var(--h);overflow:hidden;
background:radial-gradient(circle at 50% 45%,#fef3c7 0%,#fde68a 30%,#fbbf24 60%,#f59e0b 100%);
color:var(--ink);font-family:'Inter',Arial,sans-serif;-webkit-font-smoothing:antialiased}
.rays{position:absolute;top:45%;left:50%;transform:translate(-50%,-50%);width:2200px;height:2200px;
background:repeating-conic-gradient(from 0deg,rgba(194,65,12,.14) 0 6deg,transparent 6deg 18deg);
border-radius:50%;pointer-events:none}
.rays::before{content:"";position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle,rgba(254,243,199,0) 0%,rgba(254,243,199,.4) 40%,rgba(254,243,199,.9) 65%,#fef3c7 78%)}
.stage::after{content:"";position:absolute;inset:0;background:radial-gradient(70% 50% at 50% 50%,rgba(0,0,0,0) 60%,rgba(120,50,10,.22) 100%);pointer-events:none}
.safe{position:absolute;inset:300px 110px 340px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;z-index:2}
.star{font-size:56px;color:var(--accent);margin-bottom:44px;letter-spacing:10px}
.quote{font-family:'Playfair Display',Georgia,serif;font-weight:900;font-size:104px;line-height:1.12;letter-spacing:-.5px}
.quote em{font-style:italic;color:var(--accent)}
.author{margin-top:56px;font-size:28px;font-weight:500;letter-spacing:.3em;text-transform:uppercase;color:var(--accent)}
.brand{position:absolute;bottom:80px;left:0;right:0;text-align:center;font-size:18px;letter-spacing:.44em;text-transform:uppercase;color:rgba(122,74,42,.85);z-index:2}
</style></head><body>
<div class="stage"><div class="rays"></div><div class="safe">
<p class="star">✦ ✦ ✦</p>
<p class="quote">Let your <em>light</em> shine without permission.</p>
<p class="author">Unknown</p>
</div><p class="brand">Daily Motivation</p></div>
</body></html>
