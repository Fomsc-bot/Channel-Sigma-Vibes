<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Quote 45</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--w:1080px;--h:1920px;--ink:#111;--accent:#ef4444;--accent2:#2563eb;--soft:#555;}
*{margin:0;padding:0;box-sizing:border-box}body{background:#000}
.stage{position:relative;width:var(--w);height:var(--h);overflow:hidden;background:#f4f1ea;
color:var(--ink);font-family:'Inter',Arial,sans-serif;-webkit-font-smoothing:antialiased}
.shape{position:absolute;pointer-events:none}
.circle{width:420px;height:420px;border-radius:50%;background:var(--accent);top:-120px;right:-120px;mix-blend-mode:multiply;opacity:.9}
.tri{width:0;height:0;border-left:260px solid transparent;border-right:260px solid transparent;border-bottom:440px solid var(--accent2);bottom:-80px;left:-140px;transform:rotate(-12deg);opacity:.85}
.sq{width:180px;height:180px;background:#facc15;top:340px;left:80px;transform:rotate(15deg);mix-blend-mode:multiply;opacity:.9}
.bar{width:100%;height:14px;background:var(--ink);bottom:380px;left:0;opacity:.9}
.safe{position:absolute;inset:300px 100px 320px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;z-index:2}
.kicker{font-size:20px;font-weight:700;letter-spacing:.5em;text-transform:uppercase;color:var(--ink);margin-bottom:44px;background:#fff;padding:12px 26px;border:3px solid var(--ink)}
.quote{font-family:'Archivo Black',Arial,sans-serif;font-size:104px;line-height:1.08;letter-spacing:-1.5px;text-transform:uppercase;color:var(--ink)}
.author{margin-top:56px;font-size:26px;font-weight:700;letter-spacing:.3em;text-transform:uppercase;color:var(--accent)}
.brand{position:absolute;bottom:80px;left:0;right:0;text-align:center;font-size:18px;letter-spacing:.44em;text-transform:uppercase;color:rgba(85,85,85,.85);z-index:2}
</style></head><body>
<div class="stage"><div class="shape circle"></div><div class="shape tri"></div><div class="shape sq"></div><div class="shape bar"></div><div class="safe">
<p class="kicker">Design your life</p>
<p class="quote">Create more than you consume.</p>
<p class="author">Unknown</p>
</div><p class="brand">Daily Motivation</p></div>
</body></html>
