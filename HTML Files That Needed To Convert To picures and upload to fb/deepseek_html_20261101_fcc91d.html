<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Quote 39</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;1,700&family=Inter:wght@500&display=swap" rel="stylesheet">
<style>
:root{--w:1080px;--h:1920px;--ink:#1a1a1a;--accent:#9b1c2c;--soft:#5a5550;}
*{margin:0;padding:0;box-sizing:border-box}body{background:#000}
.stage{position:relative;width:var(--w);height:var(--h);overflow:hidden;
background:linear-gradient(180deg,#fbf8f2 0%,#f2ece0 55%,#e8dfcc 100%);
color:var(--ink);font-family:'Inter',Arial,sans-serif;-webkit-font-smoothing:antialiased}
.stage::after{content:"";position:absolute;inset:0;background:radial-gradient(75% 55% at 50% 50%,rgba(0,0,0,0) 60%,rgba(80,60,40,.14) 100%);pointer-events:none}
.frame{position:absolute;inset:80px;border:3px solid var(--accent);pointer-events:none}
.frame::before{content:"";position:absolute;inset:14px;border:1px solid rgba(155,28,44,.4);pointer-events:none}
.safe{position:absolute;inset:320px 140px 340px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;z-index:2}
.diamond{width:16px;height:16px;background:var(--accent);transform:rotate(45deg);margin-bottom:48px}
.quote{font-family:'Cormorant Garamond',Georgia,serif;font-style:italic;font-weight:700;font-size:104px;line-height:1.12;letter-spacing:-.4px}
.author{margin-top:56px;font-size:26px;font-weight:500;letter-spacing:.3em;text-transform:uppercase;color:var(--accent)}
.brand{position:absolute;bottom:160px;left:0;right:0;text-align:center;font-size:18px;letter-spacing:.44em;text-transform:uppercase;color:rgba(90,85,80,.8);z-index:2}
</style></head><body>
<div class="stage"><div class="frame"></div><div class="safe">
<div class="diamond"></div>
<p class="quote">Confidence isn&rsquo;t loud. It&rsquo;s consistent.</p>
<p class="author">Unknown</p>
</div><p class="brand">Daily Motivation</p></div>
</body></html>
