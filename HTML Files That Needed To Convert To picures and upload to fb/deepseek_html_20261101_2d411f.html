<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Quote 29</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;800&family=Inter:wght@500&display=swap" rel="stylesheet">
<style>
:root{--w:1080px;--h:1920px;--ink:#ffffff;--accent:#ffd166;--soft:rgba(255,255,255,.8);}
*{margin:0;padding:0;box-sizing:border-box}body{background:#000}
.stage{position:relative;width:var(--w);height:var(--h);overflow:hidden;
background:linear-gradient(180deg,#0f172a 0%,#1e1b4b 50%,#0b0f26 100%);
color:var(--ink);font-family:'Inter',Arial,sans-serif;-webkit-font-smoothing:antialiased}
.ribbon{position:absolute;left:-20%;right:-20%;height:520px;border-radius:50%;
background:linear-gradient(90deg,#7c3aed,#ec4899,#f59e0b,#10b981,#3b82f6);
filter:blur(60px);opacity:.65;pointer-events:none}
.r1{top:180px;transform:rotate(-14deg)}
.r2{bottom:120px;transform:rotate(12deg);opacity:.5}
.safe{position:absolute;inset:300px 100px 320px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;z-index:2}
.dot{width:12px;height:12px;border-radius:50%;background:var(--accent);margin-bottom:56px;box-shadow:0 0 26px 6px rgba(255,209,102,.55)}
.quote{font-family:'Outfit',Arial,sans-serif;font-weight:800;font-size:104px;line-height:1.1;letter-spacing:-1.2px;text-shadow:0 6px 30px rgba(0,0,0,.45)}
.author{margin-top:56px;font-size:28px;font-weight:500;letter-spacing:.28em;text-transform:uppercase;color:var(--soft)}
.brand{position:absolute;bottom:80px;left:0;right:0;text-align:center;font-size:18px;letter-spacing:.44em;text-transform:uppercase;color:rgba(255,255,255,.55);z-index:2}
</style></head><body>
<div class="stage"><div class="ribbon r1"></div><div class="ribbon r2"></div><div class="safe">
<div class="dot"></div>
<p class="quote">Energy flows where attention goes.</p>
<p class="author">Tony Robbins</p>
</div><p class="brand">Daily Motivation</p></div>
</body></html>
