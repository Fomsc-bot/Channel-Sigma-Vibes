<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Quote 26</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;1,700&family=Inter:wght@500&display=swap" rel="stylesheet">
<style>
:root{--w:1080px;--h:1920px;--ink:#2a3530;--accent:#6b8e7f;--soft:#7c8a83;}
*{margin:0;padding:0;box-sizing:border-box}body{background:#000}
.stage{position:relative;width:var(--w);height:var(--h);overflow:hidden;
background:linear-gradient(180deg,#eef2ee 0%,#dfe7df 55%,#cbd7cc 100%);
color:var(--ink);font-family:'Inter',Arial,sans-serif;-webkit-font-smoothing:antialiased}
.zen{position:absolute;bottom:0;left:0;right:0;height:520px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;pointer-events:none;opacity:.55}
.stone{border-radius:50%;background:linear-gradient(160deg,#b9c9bc,#7f9688);box-shadow:inset 0 -6px 14px rgba(0,0,0,.18),0 10px 20px rgba(40,60,50,.18)}
.s1{width:260px;height:110px;margin-bottom:6px}
.s2{width:200px;height:86px;margin-bottom:6px}
.s3{width:140px;height:64px}
.safe{position:absolute;inset:300px 100px 480px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;z-index:2}
.circle{width:70px;height:70px;border:2px solid var(--accent);border-radius:50%;margin-bottom:52px;position:relative}
.circle::before{content:"";position:absolute;inset:14px;border-radius:50%;background:var(--accent);opacity:.35}
.quote{font-family:'Cormorant Garamond',Georgia,serif;font-style:italic;font-weight:700;font-size:96px;line-height:1.16;letter-spacing:-.4px}
.author{margin-top:52px;font-size:28px;font-weight:500;letter-spacing:.28em;text-transform:uppercase;color:var(--accent)}
.brand{position:absolute;bottom:80px;left:0;right:0;text-align:center;font-size:18px;letter-spacing:.44em;text-transform:uppercase;color:rgba(124,138,131,.85);z-index:3}
</style></head><body>
<div class="stage">
<div class="zen"><div class="stone s1"></div><div class="stone s2"></div><div class="stone s3"></div></div>
<div class="safe">
<div class="circle"></div>
<p class="quote">Peace is the result of retraining your mind to process life as it is.</p>
<p class="author">Wayne Dyer</p>
</div><p class="brand">Daily Motivation</p></div>
</body></html>
