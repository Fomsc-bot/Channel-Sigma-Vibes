<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Quote 63</title>
<link href="https://fonts.googleapis.com/css2?family=Special+Elite&family=Playfair+Display:ital,wght@0,700;0,900&display=swap" rel="stylesheet">
<style>
:root{--w:1080px;--h:1920px;--ink:#1a2535;--accent:#b91c1c;--soft:#5a6575;}
*{margin:0;padding:0;box-sizing:border-box}body{background:#000}
.stage{position:relative;width:var(--w);height:var(--h);overflow:hidden;
background:
repeating-linear-gradient(45deg,rgba(26,37,53,.035) 0 2px,transparent 2px 8px),
linear-gradient(180deg,#f4f1e8 0%,#e8e2d0 55%,#d8cfb5 100%);
color:var(--ink);font-family:'Special Elite',monospace;-webkit-font-smoothing:antialiased}
.stamp{position:absolute;background:#fdfbf6;box-shadow:0 10px 30px rgba(40,30,15,.35);z-index:2;
-webkit-mask:radial-gradient(circle at 8px 8px,transparent 6px,#000 7px) -8px -8px/16px 16px;
mask:radial-gradient(circle at 8px 8px,transparent 6px,#000 7px) -8px -8px/16px 16px}
.stamp.s1{top:120px;left:90px;width:240px;height:300px;transform:rotate(-6deg);background:linear-gradient(160deg,#0e7490,#155e75)}
.stamp.s1::after{content:"✦";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:90px;color:rgba(255,255,255,.7)}
.stamp.s2{top:180px;right:90px;width:220px;height:280px;transform:rotate(5deg);background:linear-gradient(160deg,#b91c1c,#7f1d1d)}
.stamp.s2::after{content:"★";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:80px;color:rgba(255,255,255,.75)}
.stamp.s3{bottom:180px;left:120px;width:200px;height:260px;transform:rotate(3deg);background:linear-gradient(160deg,#7c2d12,#9a3412)}
.stamp.s3::after{content:"✿";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:76px;color:rgba(255,255,255,.75)}
.frame{position:absolute;inset:440px 110px 340px;border:2px dashed var(--accent);background:rgba(253,251,246,.85);z-index:1}
.safe{position:absolute;inset:480px 150px 380px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;z-index:3}
.quote{font-family:'Playfair Display',Georgia,serif;font-style:italic;font-weight:700;font-size:82px;line-height:1.16;letter-spacing:-.4px}
.author{margin-top:44px;font-size:22px;letter-spacing:.3em;text-transform:uppercase;color:var(--accent)}
.brand{position:absolute;bottom:120px;left:0;right:0;text-align:center;font-size:16px;letter-spacing:.44em;text-transform:uppercase;color:rgba(90,101,117,.85);z-index:3}
</style></head><body>
<div class="stage">
<div class="stamp s1"></div><div class="stamp s2"></div><div class="stamp s3"></div>
<div class="frame"></div>
<div class="safe">
<p class="quote">Collect moments, not things.</p>
<p class="author">Unknown</p>
</div><p class="brand">Daily Motivation</p></div>
</body></html>
