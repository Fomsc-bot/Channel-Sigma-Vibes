<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Quote 67</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,900&family=Inter:wght@500&display=swap" rel="stylesheet">
<style>
:root{--w:1080px;--h:1920px;--ink:#3a1e0a;--accent:#b45309;--soft:#7a5030;}
*{margin:0;padding:0;box-sizing:border-box}body{background:#000}
.stage{position:relative;width:var(--w);height:var(--h);overflow:hidden;
background:
radial-gradient(60% 40% at 20% 15%,#fde68a 0%,transparent 55%),
radial-gradient(55% 45% at 85% 80%,#dc2626 0%,transparent 55%),
linear-gradient(165deg,#f59e0b 0%,#c2410c 55%,#7c2d12 100%);
color:var(--ink);font-family:'Inter',Arial,sans-serif;-webkit-font-smoothing:antialiased}
.leaf{position:absolute;width:180px;height:180px;pointer-events:none}
.leaf svg{width:100%;height:100%}
.l1{top:120px;left:-40px;transform:rotate(-25deg);opacity:.7}
.l2{top:280px;right:-50px;transform:rotate(35deg);opacity:.55;width:140px;height:140px}
.l3{bottom:200px;left:60px;transform:rotate(15deg);opacity:.45;width:120px;height:120px}
.l4{bottom:80px;right:40px;transform:rotate(-40deg);opacity:.6;width:160px;height:160px}
.stage::after{content:"";position:absolute;inset:0;background:radial-gradient(70% 50% at 50% 50%,rgba(0,0,0,0) 55%,rgba(60,20,5,.35) 100%);pointer-events:none}
.safe{position:absolute;inset:300px 110px 340px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;z-index:2}
.kicker{font-size:22px;letter-spacing:.5em;text-transform:uppercase;color:#fef3c7;margin-bottom:44px;font-weight:600;text-shadow:0 2px 10px rgba(0,0,0,.4)}
.quote{font-family:'Playfair Display',Georgia,serif;font-style:italic;font-weight:900;font-size:100px;line-height:1.12;letter-spacing:-.5px;color:#fef3c7;text-shadow:0 4px 24px rgba(0,0,0,.45)}
.author{margin-top:56px;font-size:28px;font-weight:500;letter-spacing:.3em;text-transform:uppercase;color:#fde68a}
.brand{position:absolute;bottom:80px;left:0;right:0;text-align:center;font-size:18px;letter-spacing:.44em;text-transform:uppercase;color:rgba(253,230,138,.85);z-index:2}
</style></head><body>
<div class="stage">
<div class="leaf l1"><svg viewBox="0 0 200 200" fill="none" stroke="#fde68a" stroke-width="1.6"><path d="M100 20 C50 60 30 140 100 190 C170 140 150 60 100 20Z"/><path d="M100 30 L100 185"/><path d="M100 80 L60 60 M100 80 L140 60 M100 130 L55 110 M100 130 L145 110"/></svg></div>
<div class="leaf l2"><svg viewBox="0 0 200 200" fill="none" stroke="#fde68a" stroke-width="1.6"><path d="M100 20 C50 60 30 140 100 190 C170 140 150 60 100 20Z"/><path d="M100 30 L100 185"/></svg></div>
<div class="leaf l3"><svg viewBox="0 0 200 200" fill="none" stroke="#fde68a" stroke-width="1.6"><path d="M100 20 C50 60 30 140 100 190 C170 140 150 60 100 20Z"/><path d="M100 30 L100 185"/></svg></div>
<div class="leaf l4"><svg viewBox="0 0 200 200" fill="none" stroke="#fde68a" stroke-width="1.6"><path d="M100 20 C50 60 30 140 100 190 C170 140 150 60 100 20Z"/><path d="M100 30 L100 185"/><path d="M100 80 L60 60 M100 80 L140 60 M100 130 L55 110 M100 130 L145 110"/></svg></div>
<div class="safe">
<p class="kicker">Let it fall</p>
<p class="quote">Change is the only constant. Embrace it.</p>
<p class="author">Heraclitus</p>
</div><p class="brand">Daily Motivation</p></div>
</body></html>
