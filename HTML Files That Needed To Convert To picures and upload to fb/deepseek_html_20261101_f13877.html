<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Quote 23</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,600;1,700&family=Inter:wght@500&display=swap" rel="stylesheet">
<style>
:root{--w:1080px;--h:1920px;--ink:#3a2438;--accent:#c4527e;--soft:#8a6a80;}
*{margin:0;padding:0;box-sizing:border-box}body{background:#000}
.stage{position:relative;width:var(--w);height:var(--h);overflow:hidden;
background:linear-gradient(180deg,#fdf2f6 0%,#f9e2ec 55%,#f3d0e0 100%);
color:var(--ink);font-family:'Inter',Arial,sans-serif;-webkit-font-smoothing:antialiased}
.wash{position:absolute;border-radius:50%;filter:blur(90px);opacity:.7}
.wash.a{width:640px;height:640px;background:#ffb3d1;top:-100px;left:-160px}
.wash.b{width:560px;height:560px;background:#ffe0a3;bottom:-60px;right:-140px}
.wash.c{width:420px;height:420px;background:#b3e0ff;top:48%;left:62%}
.safe{position:absolute;inset:300px 100px 320px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;z-index:2}
.kicker{font-size:22px;letter-spacing:.42em;text-transform:uppercase;color:var(--accent);margin-bottom:44px;font-weight:600}
.quote{font-family:'Fraunces',Georgia,serif;font-style:italic;font-weight:700;font-size:98px;line-height:1.14;letter-spacing:-.4px}
.author{margin-top:56px;font-size:28px;font-weight:500;letter-spacing:.26em;text-transform:uppercase;color:var(--soft)}
.brand{position:absolute;bottom:80px;left:0;right:0;text-align:center;font-size:18px;letter-spacing:.42em;text-transform:uppercase;color:rgba(138,106,128,.75);z-index:2}
</style></head><body>
<div class="stage"><div class="wash a"></div><div class="wash b"></div><div class="wash c"></div><div class="safe">
<p class="kicker">Gentle reminder</p>
<p class="quote">You are allowed to be both a masterpiece and a work in progress.</p>
<p class="author">Sophia Bush</p>
</div><p class="brand">Daily Motivation</p></div>
</body></html>
