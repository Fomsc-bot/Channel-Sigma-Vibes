<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Quote 10</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,600;1,900&family=Inter:wght@500&display=swap" rel="stylesheet">
<style>
:root{--w:1080px;--h:1920px;--ink:#2e2640;--accent:#7c5cff;--soft:#6c6484;}
*{margin:0;padding:0;box-sizing:border-box}body{background:#000}
.stage{position:relative;width:var(--w);height:var(--h);overflow:hidden;
background:radial-gradient(90% 65% at 50% 30%,#efe9ff 0%,#e6ddff 45%,#d6c9f5 100%);
color:var(--ink);font-family:'Inter',Arial,sans-serif;-webkit-font-smoothing:antialiased}
.blob{position:absolute;border-radius:50%;filter:blur(80px);opacity:.55}
.blob.a{width:520px;height:520px;background:#ffc2e2;top:180px;left:-140px}
.blob.b{width:600px;height:600px;background:#9ad7ff;bottom:140px;right:-180px}
.safe{position:absolute;inset:300px 100px 320px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;z-index:2}
.kicker{font-size:22px;font-weight:600;letter-spacing:.4em;text-transform:uppercase;color:var(--accent);margin-bottom:44px}
.quote{font-family:'Fraunces',Georgia,serif;font-style:italic;font-weight:900;font-size:96px;line-height:1.14;letter-spacing:-.4px}
.author{margin-top:56px;font-size:28px;font-weight:500;letter-spacing:.26em;text-transform:uppercase;color:var(--soft)}
.brand{position:absolute;bottom:80px;left:0;right:0;text-align:center;font-size:18px;letter-spacing:.42em;text-transform:uppercase;color:rgba(108,100,132,.75);z-index:2}
</style></head><body>
<div class="stage"><div class="blob a"></div><div class="blob b"></div><div class="safe">
<p class="kicker">Soft reminder</p>
<p class="quote">You don&rsquo;t have to be perfect to be worthy of love.</p>
<p class="author">Unknown</p>
</div><p class="brand">Daily Motivation</p></div>
</body></html>
