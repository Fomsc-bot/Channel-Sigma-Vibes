<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Quote 59</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;1,700&family=Inter:wght@500&display=swap" rel="stylesheet">
<style>
:root{--w:1080px;--h:1920px;--ink:#1c1c1c;--accent:#4a4a4a;--soft:#6a6a6a;}
*{margin:0;padding:0;box-sizing:border-box}body{background:#000}
.stage{position:relative;width:var(--w);height:var(--h);overflow:hidden;
background:linear-gradient(180deg,#fbfaf6 0%,#f2f0e9 55%,#e6e3d8 100%);
color:var(--ink);font-family:'Inter',Arial,sans-serif;-webkit-font-smoothing:antialiased}
.wash{position:absolute;border-radius:50%;background:radial-gradient(circle,rgba(30,30,30,.18) 0%,rgba(30,30,30,.06) 45%,transparent 75%);pointer-events:none;filter:blur(8px)}
.wash.a{width:520px;height:380px;top:180px;left:-160px;transform:rotate(-15deg)}
.wash.b{width:420px;height:320px;bottom:200px;right:-140px;transform:rotate(22deg);opacity:.8}
.wash.c{width:260px;height:200px;top:60px;right:120px;opacity:.5}
.ink{position:absolute;top:120px;right:180px;width:60px;height:60px;border-radius:50%;background:radial-gradient(circle at 40% 40%,#1c1c1c,#0a0a0a);opacity:.85;pointer-events:none}
.stage::after{content:"";position:absolute;inset:0;background:radial-gradient(75% 55% at 50% 50%,rgba(0,0,0,0) 60%,rgba(60,50,30,.12) 100%);pointer-events:none}
.safe{position:absolute;inset:320px 120px 340px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;z-index:2}
.seal{width:60px;height:60px;background:var(--accent);border-radius:6px;display:flex;align-items:center;justify-content:center;color:#fbfaf6;font-family:'Cormorant Garamond',serif;font-weight:700;font-size:32px;margin-bottom:56px;transform:rotate(-3deg)}
.quote{font-family:'Cormorant Garamond',Georgia,serif;font-style:italic;font-weight:700;font-size:108px;line-height:1.1;letter-spacing:-.5px}
.author{margin-top:56px;font-size:26px;font-weight:500;letter-spacing:.3em;text-transform:uppercase;color:var(--accent)}
.brand{position:absolute;bottom:160px;left:0;right:0;text-align:center;font-size:18px;letter-spacing:.44em;text-transform:uppercase;color:rgba(106,106,106,.85);z-index:2}
</style></head><body>
<div class="stage">
<div class="wash a"></div><div class="wash b"></div><div class="wash c"></div>
<div class="ink"></div>
<div class="safe">
<div class="seal">禅</div>
<p class="quote">Empty your mind. Be formless, shapeless — like water.</p>
<p class="author">Bruce Lee</p>
</div><p class="brand">Daily Motivation</p></div>
</body></html>
