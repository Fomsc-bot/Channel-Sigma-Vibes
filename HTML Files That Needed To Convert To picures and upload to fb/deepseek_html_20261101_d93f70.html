<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Quote 15</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Inter:wght@500&display=swap" rel="stylesheet">
<style>
:root{--w:1080px;--h:1920px;--ink:#eaf6ff;--accent:#5eead4;--soft:#8fb2c8;}
*{margin:0;padding:0;box-sizing:border-box}body{background:#000}
.stage{position:relative;width:var(--w);height:var(--h);overflow:hidden;
background:
radial-gradient(80% 60% at 15% 10%,#0d3b66 0%,transparent 55%),
radial-gradient(70% 55% at 90% 25%,#1b6ca8 0%,transparent 55%),
radial-gradient(90% 65% at 55% 100%,#0a9396 0%,transparent 60%),
linear-gradient(180deg,#03131f 0%,#06263a 45%,#03202e 100%);
color:var(--ink);font-family:'Inter',Arial,sans-serif;-webkit-font-smoothing:antialiased}
.stage::before{content:"";position:absolute;inset:0;background:radial-gradient(70% 50% at 50% 50%,rgba(0,0,0,0) 55%,rgba(0,0,0,.45) 100%);pointer-events:none}
.safe{position:absolute;inset:300px 100px 320px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;z-index:2}
.wave{font-size:44px;color:var(--accent);margin-bottom:44px;letter-spacing:12px}
.quote{font-family:'DM Serif Display',Georgia,serif;font-size:104px;line-height:1.12;letter-spacing:-.6px}
.author{margin-top:56px;font-size:28px;font-weight:500;letter-spacing:.26em;text-transform:uppercase;color:var(--accent)}
.brand{position:absolute;bottom:80px;left:0;right:0;text-align:center;font-size:20px;letter-spacing:.42em;text-transform:uppercase;color:rgba(143,178,200,.8);z-index:2}
</style></head><body>
<div class="stage"><div class="safe">
<p class="wave">≈ ≈ ≈</p>
<p class="quote">The calm sea never made a skilled sailor.</p>
<p class="author">Franklin D. Roosevelt</p>
</div><p class="brand">Daily Motivation</p></div>
</body></html>
