<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Quote 27</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=Inter:wght@500&display=swap" rel="stylesheet">
<style>
:root{--w:1080px;--h:1920px;--ink:#ffffff;--accent:#a5f3fc;--soft:rgba(255,255,255,.75);}
*{margin:0;padding:0;box-sizing:border-box}body{background:#000}
.stage{position:relative;width:var(--w);height:var(--h);overflow:hidden;
background:
radial-gradient(60% 40% at 20% 15%,#7c3aed 0%,transparent 60%),
radial-gradient(55% 45% at 85% 30%,#ec4899 0%,transparent 60%),
radial-gradient(70% 55% at 50% 95%,#0ea5e9 0%,transparent 62%),
linear-gradient(160deg,#0b0b23 0%,#15103a 100%);
color:var(--ink);font-family:'Inter',Arial,sans-serif;-webkit-font-smoothing:antialiased}
.orb{position:absolute;border-radius:50%;filter:blur(100px);opacity:.6}
.orb.a{width:520px;height:520px;background:#22d3ee;top:120px;right:-140px}
.orb.b{width:480px;height:480px;background:#f472b6;bottom:160px;left:-140px}
.glass{position:absolute;inset:280px 80px 260px;border-radius:44px;
background:rgba(255,255,255,.08);
border:1px solid rgba(255,255,255,.22);
box-shadow:0 30px 80px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.25);
backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);z-index:2}
.safe{position:absolute;inset:340px 140px 340px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;z-index:3}
.kicker{font-size:22px;letter-spacing:.42em;text-transform:uppercase;color:var(--accent);margin-bottom:44px;font-weight:600}
.quote{font-family:'Space Grotesk',Arial,sans-serif;font-weight:700;font-size:96px;line-height:1.14;letter-spacing:-1px}
.author{margin-top:56px;font-size:27px;font-weight:500;letter-spacing:.28em;text-transform:uppercase;color:var(--soft)}
.brand{position:absolute;bottom:100px;left:0;right:0;text-align:center;font-size:18px;letter-spacing:.44em;text-transform:uppercase;color:rgba(255,255,255,.5);z-index:3}
</style></head><body>
<div class="stage"><div class="orb a"></div><div class="orb b"></div><div class="glass"></div><div class="safe">
<p class="kicker">Focus mode</p>
<p class="quote">Clarity comes from engagement, not thought.</p>
<p class="author">Marie Forleo</p>
</div><p class="brand">Daily Motivation</p></div>
</body></html>
