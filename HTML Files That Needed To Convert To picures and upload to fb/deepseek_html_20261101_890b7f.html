<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Quote 32</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,600;1,700&family=Inter:wght@500&display=swap" rel="stylesheet">
<style>
:root{
  /* CHANGE THESE 4 VALUES TO RESKIN THE WHOLE TEMPLATE */
  --bg-1:#fdf6ec; --bg-2:#f3e6d0;
  --ink:#2a2520; --accent:#a0522d;
}
:root{--w:1080px;--h:1920px;--soft:#7a6a58;}
*{margin:0;padding:0;box-sizing:border-box}body{background:#000}
.stage{position:relative;width:var(--w);height:var(--h);overflow:hidden;
background:linear-gradient(180deg,var(--bg-1) 0%,var(--bg-2) 100%);
color:var(--ink);font-family:'Inter',Arial,sans-serif;-webkit-font-smoothing:antialiased}
.corner{position:absolute;width:90px;height:90px;border:2px solid var(--accent);opacity:.55;pointer-events:none}
.corner.tl{top:70px;left:70px;border-right:none;border-bottom:none}
.corner.tr{top:70px;right:70px;border-left:none;border-bottom:none}
.corner.bl{bottom:70px;left:70px;border-right:none;border-top:none}
.corner.br{bottom:70px;right:70px;border-left:none;border-top:none}
.safe{position:absolute;inset:300px 120px 320px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;z-index:2}
.mark{font-size:26px;letter-spacing:.5em;text-transform:uppercase;color:var(--accent);margin-bottom:48px;font-weight:600}
.quote{font-family:'Fraunces',Georgia,serif;font-weight:600;font-size:102px;line-height:1.14;letter-spacing:-.6px}
.quote em{font-style:italic;color:var(--accent)}
.author{margin-top:56px;font-size:28px;font-weight:500;letter-spacing:.28em;text-transform:uppercase;color:var(--soft)}
.brand{position:absolute;bottom:160px;left:0;right:0;text-align:center;font-size:18px;letter-spacing:.44em;text-transform:uppercase;color:var(--soft);z-index:2}
</style></head><body>
<div class="stage">
<div class="corner tl"></div><div class="corner tr"></div>
<div class="corner bl"></div><div class="corner br"></div>
<div class="safe">
<p class="mark">Today&rsquo;s thought</p>
<p class="quote">The best time to start was <em>yesterday</em>. The next best time is now.</p>
<p class="author">Unknown</p>
</div><p class="brand">Daily Motivation</p></div>
</body></html>
