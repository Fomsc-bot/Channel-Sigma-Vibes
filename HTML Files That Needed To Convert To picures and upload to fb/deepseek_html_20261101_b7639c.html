<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Quote 48</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;0,700;1,700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--w:1080px;--h:1920px;--ink:#f4ecd8;--accent:#c9a24a;--soft:#7a6c4a;}
*{margin:0;padding:0;box-sizing:border-box}body{background:#000}
.stage{position:relative;width:var(--w);height:var(--h);overflow:hidden;
background:radial-gradient(100% 70% at 50% 25%,#15120c 0%,#080604 60%,#020202 100%);
color:var(--ink);font-family:'Inter',Arial,sans-serif;-webkit-font-smoothing:antialiased}
.corner{position:absolute;width:70px;height:70px;border:1.5px solid var(--accent);opacity:.7;pointer-events:none}
.corner.tl{top:80px;left:80px;border-right:none;border-bottom:none}
.corner.tr{top:80px;right:80px;border-left:none;border-bottom:none}
.corner.bl{bottom:80px;left:80px;border-right:none;border-top:none}
.corner.br{bottom:80px;right:80px;border-left:none;border-top:none}
.safe{position:absolute;inset:320px 130px 340px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;z-index:2}
.mark{font-size:24px;letter-spacing:.55em;text-transform:uppercase;color:var(--accent);margin-bottom:52px;font-weight:500}
.quote{font-family:'Cormorant Garamond',Georgia,serif;font-style:italic;font-weight:700;font-size:110px;line-height:1.1;letter-spacing:-.5px}
.author{margin-top:56px;font-size:24px;font-weight:400;letter-spacing:.34em;text-transform:uppercase;color:var(--accent)}
.brand{position:absolute;bottom:160px;left:0;right:0;text-align:center;font-size:16px;letter-spacing:.48em;text-transform:uppercase;color:rgba(122,108,74,.85);z-index:2}
</style></head><body>
<div class="stage">
<div class="corner tl"></div><div class="corner tr"></div>
<div class="corner bl"></div><div class="corner br"></div>
<div class="safe">
<p class="mark">Memento Vivere</p>
<p class="quote">Simplicity is the ultimate sophistication.</p>
<p class="author">Leonardo da Vinci</p>
</div><p class="brand">Daily Motivation</p></div>
</body></html>
