<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Quote 06</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--w:1080px;--h:1920px;--ink:#f5f5f0;--accent:#c6f432;--soft:#8a8f7d;}
*{margin:0;padding:0;box-sizing:border-box}body{background:#000}
.stage{position:relative;width:var(--w);height:var(--h);overflow:hidden;background:#1c1f1a;color:var(--ink);font-family:'Inter',Arial,sans-serif;-webkit-font-smoothing:antialiased}
.grid{position:absolute;inset:0;background-image:linear-gradient(rgba(198,244,50,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(198,244,50,.06) 1px,transparent 1px);background-size:80px 80px}
.safe{position:absolute;inset:300px 96px 320px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;z-index:2}
.kicker{font-size:22px;font-weight:700;letter-spacing:.4em;text-transform:uppercase;color:var(--accent);margin-bottom:44px;padding:12px 28px;border:2px solid var(--accent);border-radius:40px}
.quote{font-family:'Archivo Black',Arial,sans-serif;font-weight:900;font-size:94px;line-height:1.08;text-transform:uppercase;letter-spacing:-1.5px}
.author{margin-top:52px;font-size:28px;font-weight:500;letter-spacing:.26em;text-transform:uppercase;color:var(--soft)}
.brand{position:absolute;bottom:80px;left:0;right:0;text-align:center;font-size:20px;letter-spacing:.4em;text-transform:uppercase;color:rgba(245,245,240,.5);z-index:2}
</style></head><body>
<div class="stage"><div class="grid"></div><div class="safe">
<p class="kicker">Mindset</p>
<p class="quote">Discipline is choosing between what you want now and what you want most.</p>
<p class="author">Abraham Lincoln</p>
</div><p class="brand">Daily Motivation</p></div>
</body></html>
