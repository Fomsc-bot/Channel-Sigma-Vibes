<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Quote 52</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:wght@500&display=swap" rel="stylesheet">
<style>
:root{--w:1080px;--h:1920px;--ink:#e8f0ff;--accent:#38bdf8;--soft:#7a8aa8;}
*{margin:0;padding:0;box-sizing:border-box}body{background:#000}
.stage{position:relative;width:var(--w);height:var(--h);overflow:hidden;
background:
radial-gradient(50% 40% at 75% 15%,#1e3a8a 0%,transparent 55%),
radial-gradient(60% 50% at 20% 90%,#312e81 0%,transparent 60%),
linear-gradient(180deg,#050a1a 0%,#08162e 40%,#0a1c3a 100%);
color:var(--ink);font-family:'Inter',Arial,sans-serif;-webkit-font-smoothing:antialiased}
.stars{position:absolute;inset:0;pointer-events:none;opacity:.85;
background-image:
radial-gradient(1.4px 1.4px at 12% 8%,#fff 50%,transparent 51%),
radial-gradient(1.2px 1.2px at 72% 12%,#fff 50%,transparent 51%),
radial-gradient(1.3px 1.3px at 38% 22%,#cfd8ff 50%,transparent 51%),
radial-gradient(1.4px 1.4px at 85% 35%,#fff 50%,transparent 51%),
radial-gradient(1.2px 1.2px at 25% 48%,#fff 50%,transparent 51%)}
.buildings{position:absolute;bottom:0;left:0;right:0;height:460px;display:flex;align-items:flex-end;justify-content:space-between;padding:0 20px;pointer-events:none;opacity:.88}
.b{background:linear-gradient(180deg,#0d1a33 0%,#050a1a 100%);border-top:2px solid rgba(56,189,248,.35);border-radius:2px 2px 0 0;position:relative}
.b::before{content:"";position:absolute;inset:10px 6px;background-image:radial-gradient(2px 3px at 30% 20%,#fbbf24 50%,transparent 51%),radial-gradient(2px 3px at 70% 30%,#fbbf24 50%,transparent 51%),radial-gradient(2px 3px at 30% 50%,#38bdf8 50%,transparent 51%),radial-gradient(2px 3px at 60% 65%,#fbbf24 50%,transparent 51%),radial-gradient(2px 3px at 40% 85%,#38bdf8 50%,transparent 51%);background-size:34px 34px,34px 34px,34px 34px,34px 34px,34px 34px;opacity:.75}
.b1{width:80px;height:180px}.b2{width:110px;height:260px}.b3{width:70px;height:140px}.b4{width:130px;height:320px}.b5{width:90px;height:200px}.b6{width:100px;height:240px}.b7{width:70px;height:160px}.b8{width:120px;height:280px}
.stage::after{content:"";position:absolute;inset:0;background:radial-gradient(70% 50% at 50% 45%,rgba(0,0,0,0) 55%,rgba(0,0,0,.55) 100%);pointer-events:none}
.safe{position:absolute;inset:300px 100px 560px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;z-index:2}
.kicker{font-size:22px;letter-spacing:.5em;text-transform:uppercase;color:var(--accent);margin-bottom:44px;font-weight:600}
.quote{font-family:'Archivo Black',Arial,sans-serif;font-size:104px;line-height:1.08;letter-spacing:-1.5px;text-transform:uppercase;text-shadow:0 4px 30px rgba(0,0,0,.6)}
.author{margin-top:52px;font-size:26px;font-weight:500;letter-spacing:.3em;text-transform:uppercase;color:var(--accent)}
.brand{position:absolute;bottom:80px;left:0;right:0;text-align:center;font-size:18px;letter-spacing:.44em;text-transform:uppercase;color:rgba(122,138,168,.85);z-index:3}
</style></head><body>
<div class="stage"><div class="stars"></div>
<div class="buildings"><div class="b b1"></div><div class="b b2"></div><div class="b b3"></div><div class="b b4"></div><div class="b b5"></div><div class="b b6"></div><div class="b b7"></div><div class="b b8"></div></div>
<div class="safe">
<p class="kicker">After hours</p>
<p class="quote">Built quietly. Won loudly.</p>
<p class="author">Unknown</p>
</div><p class="brand">Daily Motivation</p></div>
</body></html>
