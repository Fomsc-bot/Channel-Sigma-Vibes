<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Quote 54</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;800&family=Inter:wght@500&display=swap" rel="stylesheet">
<style>
:root{--w:1080px;--h:1920px;--ink:#ffffff;--accent:#fef08a;--soft:rgba(255,255,255,.82);}
*{margin:0;padding:0;box-sizing:border-box}body{background:#000}
.stage{position:relative;width:var(--w);height:var(--h);overflow:hidden;
background:linear-gradient(180deg,#ef4444 0%,#f59e0b 22%,#eab308 40%,#22c55e 58%,#06b6d4 74%,#6366f1 88%,#a855f7 100%);
color:var(--ink);font-family:'Inter',Arial,sans-serif;-webkit-font-smoothing:antialiased}
.stage::before{content:"";position:absolute;inset:0;background:radial-gradient(70% 50% at 50% 50%,rgba(255,255,255,.14) 0%,rgba(0,0,0,0) 60%);pointer-events:none}
.stage::after{content:"";position:absolute;inset:0;background:radial-gradient(70% 50% at 50% 50%,rgba(0,0,0,0) 55%,rgba(0,0,0,.32) 100%);pointer-events:none}
.safe{position:absolute;inset:300px 100px 320px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;z-index:2}
.spark{font-size:56px;color:var(--accent);margin-bottom:48px;letter-spacing:10px;text-shadow:0 0 24px rgba(254,240,138,.65)}
.quote{font-family:'Outfit',Arial,sans-serif;font-weight:800;font-size:108px;line-height:1.1;letter-spacing:-1.2px;text-shadow:0 4px 28px rgba(0,0,0,.4)}
.author{margin-top:56px;font-size:28px;font-weight:500;letter-spacing:.28em;text-transform:uppercase;color:var(--soft)}
.brand{position:absolute;bottom:80px;left:0;right:0;text-align:center;font-size:18px;letter-spacing:.44em;text-transform:uppercase;color:rgba(255,255,255,.7);z-index:2}
</style></head><body>
<div class="stage"><div class="safe">
<p class="spark">✶ ✶ ✶</p>
<p class="quote">Feel the fear and do it anyway.</p>
<p class="author">Susan Jeffers</p>
</div><p class="brand">Daily Motivation</p></div>
</body></html>
