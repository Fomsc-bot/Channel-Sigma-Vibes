<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Quote 13</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@700&family=Inter:wght@500&display=swap" rel="stylesheet">
<style>
:root{--w:1080px;--h:1920px;--ink:#eaffff;--neon:#19f6e8;--pink:#ff2e88;--soft:#7da6a9;}
*{margin:0;padding:0;box-sizing:border-box}body{background:#000}
.stage{position:relative;width:var(--w);height:var(--h);overflow:hidden;background:radial-gradient(120% 80% at 50% 40%,#0b1520 0%,#04070c 65%,#000 100%);color:var(--ink);font-family:'Inter',Arial,sans-serif;-webkit-font-smoothing:antialiased}
.stage::before{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(25,246,232,.055) 1px,transparent 1px),linear-gradient(90deg,rgba(25,246,232,.055) 1px,transparent 1px);background-size:90px 90px}
.glow{position:absolute;border-radius:50%;filter:blur(140px);opacity:.55}
.glow.a{width:620px;height:620px;background:#19f6e8;top:120px;left:-200px}
.glow.b{width:560px;height:560px;background:#ff2e88;bottom:100px;right:-180px}
.safe{position:absolute;inset:300px 100px 320px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;z-index:2}
.kicker{font-size:22px;letter-spacing:.5em;text-transform:uppercase;color:var(--neon);margin-bottom:44px;text-shadow:0 0 22px rgba(25,246,232,.7)}
.quote{font-family:'Space Grotesk',Arial,sans-serif;font-weight:700;font-size:100px;line-height:1.1;letter-spacing:-1px;text-shadow:0 0 34px rgba(25,246,232,.35)}
.quote em{font-style:normal;color:var(--pink);text-shadow:0 0 30px rgba(255,46,136,.65)}
.author{margin-top:52px;font-size:28px;font-weight:500;letter-spacing:.26em;text-transform:uppercase;color:var(--soft)}
.brand{position:absolute;bottom:80px;left:0;right:0;text-align:center;font-size:20px;letter-spacing:.42em;text-transform:uppercase;color:rgba(125,166,169,.75);z-index:2}
</style></head><body>
<div class="stage"><div class="glow a"></div><div class="glow b"></div><div class="safe">
<p class="kicker">No excuses</p>
<p class="quote">Your only limit is <em>you</em>.</p>
<p class="author">Unknown</p>
</div><p class="brand">Daily Motivation</p></div>
</body></html>
