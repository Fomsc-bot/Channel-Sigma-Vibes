<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Quote 02</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;900&family=Inter:wght@500&display=swap" rel="stylesheet">
<style>
:root{--w:1080px;--h:1920px;--ink:#ffffff;--soft:rgba(255,255,255,.78);--accent:#ffd166;}
*{margin:0;padding:0;box-sizing:border-box}body{background:#000}
.stage{position:relative;width:var(--w);height:var(--h);overflow:hidden;color:var(--ink);
background:linear-gradient(155deg,#3a0ca3 0%,#7209b7 32%,#f72585 66%,#ff8f5a 100%);
-webkit-font-smoothing:antialiased;font-family:'Inter',Arial,sans-serif}
.stage::before{content:"";position:absolute;inset:0;background:radial-gradient(70% 50% at 50% 50%,rgba(0,0,0,0) 55%,rgba(0,0,0,.35) 100%);pointer-events:none}
.safe{position:absolute;inset:300px 96px 320px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.tag{font-size:22px;letter-spacing:.36em;text-transform:uppercase;color:var(--accent);margin-bottom:48px;font-weight:600}
.quote{font-family:'Montserrat',Arial,sans-serif;font-weight:900;font-size:104px;line-height:1.1;text-transform:uppercase;letter-spacing:-1px}
.author{margin-top:56px;font-size:30px;letter-spacing:.22em;text-transform:uppercase;color:var(--soft)}
.brand{position:absolute;bottom:80px;left:0;right:0;text-align:center;font-size:20px;letter-spacing:.4em;text-transform:uppercase;color:rgba(255,255,255,.6)}
</style></head><body>
<div class="stage"><div class="safe">
<p class="tag">Monday Motivation</p>
<p class="quote">Start where you are. Use what you have. Do what you can.</p>
<p class="author">Arthur Ashe</p>
</div><p class="brand">Daily Motivation</p></div>
</body></html>
