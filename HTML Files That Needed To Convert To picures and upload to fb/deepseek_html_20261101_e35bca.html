<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Quote 51</title>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Special+Elite&family=Inter:wght@500&display=swap" rel="stylesheet">
<style>
:root{--w:1080px;--h:1920px;--ink:#2b2118;--accent:#6f4e2a;--soft:#7a6a58;}
*{margin:0;padding:0;box-sizing:border-box}body{background:#000}
.stage{position:relative;width:var(--w);height:var(--h);overflow:hidden;
background:
linear-gradient(180deg,#f6ebd4 0%,#eedfc0 55%,#e2ce9f 100%);
color:var(--ink);font-family:'Inter',Arial,sans-serif;-webkit-font-smoothing:antialiased}
.stage::before{content:"";position:absolute;inset:0;
background-image:
repeating-linear-gradient(0deg,rgba(110,80,40,.045) 0 1px,transparent 1px 46px),
repeating-linear-gradient(90deg,rgba(110,80,40,.045) 0 1px,transparent 1px 46px);
pointer-events:none}
.stain{position:absolute;border-radius:50%;background:radial-gradient(circle at 40% 40%,rgba(120,80,40,.18) 0%,rgba(120,80,40,.08) 45%,rgba(120,80,40,.02) 70%,transparent 75%);pointer-events:none;filter:blur(3px)}
.stain.a{width:340px;height:340px;top:120px;right:80px;border-radius:46% 54% 60% 40%/48% 42% 58% 52%}
.stain.b{width:180px;height:180px;bottom:260px;left:60px;border-radius:52% 48% 44% 56%/40% 52% 48% 60%}
.stage::after{content:"";position:absolute;inset:0;background:radial-gradient(75% 55% at 50% 50%,rgba(0,0,0,0) 60%,rgba(90,60,20,.22) 100%);pointer-events:none}
.safe{position:absolute;inset:300px 120px 340px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;z-index:2}
.mark{font-family:'Special Elite',monospace;font-size:20px;letter-spacing:.42em;color:var(--accent);text-transform:uppercase;margin-bottom:52px}
.quote{font-family:'Caveat',cursive;font-weight:700;font-size:128px;line-height:1.02;letter-spacing:-1px}
.author{margin-top:56px;font-family:'Special Elite',monospace;font-size:26px;letter-spacing:.24em;text-transform:uppercase;color:var(--accent);border-top:2px solid rgba(111,78,42,.4);border-bottom:2px solid rgba(111,78,42,.4);padding:14px 28px}
.brand{position:absolute;bottom:80px;left:0;right:0;text-align:center;font-family:'Special Elite',monospace;font-size:16px;letter-spacing:.44em;text-transform:uppercase;color:rgba(122,106,88,.8);z-index:2}
</style></head><body>
<div class="stage"><div class="stain a"></div><div class="stain b"></div><div class="safe">
<p class="mark">Slow morning</p>
<p class="quote">You don&rsquo;t have to rush it. Start where you are.</p>
<p class="author">Unknown</p>
</div><p class="brand">Daily Motivation</p></div>
</body></html>
