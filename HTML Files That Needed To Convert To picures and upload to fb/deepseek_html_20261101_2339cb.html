<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Quote 40</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;700&family=Inter:wght@500&display=swap" rel="stylesheet">
<style>
:root{--w:1080px;--h:1920px;--ink:#eafff8;--accent:#5eead4;--soft:#8fb8b4;}
*{margin:0;padding:0;box-sizing:border-box}body{background:#000}
.stage{position:relative;width:var(--w);height:var(--h);overflow:hidden;
background:linear-gradient(180deg,#03121f 0%,#041a24 45%,#020a12 100%);
color:var(--ink);font-family:'Inter',Arial,sans-serif;-webkit-font-smoothing:antialiased}
.aurora{position:absolute;border-radius:50%;filter:blur(120px);opacity:.6;pointer-events:none}
.a1{width:800px;height:420px;background:#2dd4bf;top:60px;left:-180px;transform:rotate(-12deg)}
.a2{width:700px;height:380px;background:#818cf8;top:340px;right:-160px;transform:rotate(8deg)}
.a3{width:640px;height:320px;background:#22d3ee;bottom:220px;left:-100px;transform:rotate(-6deg);opacity:.4}
.stars{position:absolute;inset:0;pointer-events:none;opacity:.8;
background-image:
radial-gradient(1.4px 1.4px at 12% 8%,#fff 50%,transparent 51%),
radial-gradient(1.3px 1.3px at 78% 14%,#cff 50%,transparent 51%),
radial-gradient(1.5px 1.5px at 32% 22%,#fff 50%,transparent 51%),
radial-gradient(1.3px 1.3px at 88% 46%,#fff 50%,transparent 51%),
radial-gradient(1.4px 1.4px at 20% 70%,#cff 50%,transparent 51%),
radial-gradient(1.3px 1.3px at 62% 88%,#fff 50%,transparent 51%);
background-size:260px 260px,320px 320px,280px 280px,300px 300px,240px 240px,360px 360px}
.stage::after{content:"";position:absolute;inset:0;background:radial-gradient(70% 50% at 50% 50%,rgba(0,0,0,0) 55%,rgba(0,0,0,.55) 100%);pointer-events:none}
.safe{position:absolute;inset:300px 100px 320px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;z-index:2}
.star{font-size:48px;color:var(--accent);margin-bottom:48px;letter-spacing:12px;text-shadow:0 0 24px rgba(94,234,212,.7)}
.quote{font-family:'Outfit',Arial,sans-serif;font-weight:700;font-size:104px;line-height:1.1;letter-spacing:-1px;text-shadow:0 6px 30px rgba(0,0,0,.55)}
.author{margin-top:56px;font-size:28px;font-weight:500;letter-spacing:.28em;text-transform:uppercase;color:var(--accent)}
.brand{position:absolute;bottom:80px;left:0;right:0;text-align:center;font-size:18px;letter-spacing:.44em;text-transform:uppercase;color:rgba(143,184,180,.8);z-index:2}
</style></head><body>
<div class="stage"><div class="aurora a1"></div><div class="aurora a2"></div><div class="aurora a3"></div><div class="stars"></div><div class="safe">
<p class="star">✦ ✦ ✦</p>
<p class="quote">Chase the light. Even in the dark, it finds you.</p>
<p class="author">Unknown</p>
</div><p class="brand">Daily Motivation</p></div>
</body></html>
