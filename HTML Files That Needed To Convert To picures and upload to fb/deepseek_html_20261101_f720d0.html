<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Quote 35</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--w:1080px;--h:1920px;--ink:#ffffff;--accent:#e0e0e0;--soft:#9a9a9a;}
*{margin:0;padding:0;box-sizing:border-box}body{background:#000}
.stage{position:relative;width:var(--w);height:var(--h);overflow:hidden;background:#0c0c0c;
color:var(--ink);font-family:'Inter',Arial,sans-serif;-webkit-font-smoothing:antialiased}
.grid{position:absolute;inset:0;
background-image:
linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),
linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px);
background-size:60px 60px}
.grid::before,.grid::after{content:"";position:absolute;width:60px;height:60px;border:2px solid #fff}
.grid::before{top:120px;left:100px;border-right:none;border-bottom:none}
.grid::after{bottom:120px;right:100px;border-left:none;border-top:none}
.safe{position:absolute;inset:300px 100px 320px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;z-index:2}
.quote{font-family:'Bebas Neue',Arial,sans-serif;font-size:150px;line-height:1.0;letter-spacing:3px;text-transform:uppercase}
.quote .thin{display:block;font-family:'Inter',Arial,sans-serif;font-weight:400;font-size:32px;letter-spacing:.4em;text-transform:uppercase;color:var(--soft);margin-top:48px}
.author{margin-top:56px;font-size:24px;font-weight:500;letter-spacing:.3em;text-transform:uppercase;color:var(--accent)}
.brand{position:absolute;bottom:80px;left:0;right:0;text-align:center;font-size:18px;letter-spacing:.44em;text-transform:uppercase;color:rgba(154,154,154,.8);z-index:2}
</style></head><body>
<div class="stage"><div class="grid"></div><div class="safe">
<p class="quote">Rise<span class="thin">again. and again.</span></p>
<p class="author">Unknown</p>
</div><p class="brand">Daily Motivation</p></div>
</body></html>
