<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Quote 78</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
:root{--w:1080px;--h:1920px;--ink:#ffffff;--accent:#a78bfa;--soft:#c4b5fd;}
*{margin:0;padding:0;box-sizing:border-box}body{background:#000}
.stage{position:relative;width:var(--w);height:var(--h);overflow:hidden;
background:conic-gradient(from 180deg at 50% 50%,#6366f1,#8b5cf6,#ec4899,#f59e0b,#10b981,#06b6d4,#6366f1);
background-size:200% 200%;filter:saturate(1.15);
color:var(--ink);font-family:'Space Grotesk',Arial,sans-serif;-webkit-font-smoothing:antialiased}
.noise{position:absolute;inset:0;
background-image:
radial-gradient(1.6px 1.6px at 18% 22%,rgba(255,255,255,.5) 50%,transparent 51%),
radial-gradient(1.4px 1.4px at 72% 48%,rgba(0,0,0,.3) 50%,transparent 51%),
radial-gradient(1.6px 1.6px at 42% 78%,rgba(255,255,255,.4) 50%,transparent 51%),
radial-gradient(1.4px 1.4px at 88% 12%,rgba(0,0,0,.25) 50%,transparent 51%);
background-size:60px 60px,80px 80px,100px 100px,120px 120px;opacity:.75;mix-blend-mode:overlay;pointer-events:none}
.chrome{position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,255,255,.22) 0%,rgba(255,255,255,0) 30%,rgba(0,0,0,0) 60%,rgba(0,0,0,.25) 100%);pointer-events:none}
.stage::after{content:"";position:absolute;inset:0;background:radial-gradient(70% 50% at 50% 50%,rgba(0,0,0,0) 55%,rgba(0,0,0,.35) 100%);pointer-events:none}
.safe{position:absolute;inset:300px 100px 320px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;z-index:2}
.tag{font-family:'JetBrains Mono',monospace;font-size:20px;letter-spacing:.4em;text-transform:uppercase;color:#fff;background:rgba(0,0,0,.45);padding:12px 26px;margin-bottom:48px}
.quote{font-family:'Space Grotesk',Arial,sans-serif;font-weight:700;font-size:104px;line-height:1.1;letter-spacing:-1.2px;text-shadow:0 4px 30px rgba(0,0,0,.5),-2px 0 #f0abfc,2px 0 #22d3ee}
.author{margin-top:56px;font-size:26px;font-weight:500;letter-spacing:.3em;text-transform:uppercase;color:#fff;background:rgba(0,0,0,.4);padding:10px 22px}
.brand{position:absolute;bottom:80px;left:0;right:0;text-align:center;font-family:'JetBrains Mono',monospace;font-size:18px;letter-spacing:.44em;text-transform:uppercase;color:rgba(255,255,255,.85);z-index:3}
</style></head><body>
<div class="stage"><div class="noise"></div><div class="chrome"></div><div class="safe">
<p class="tag">Y2K // 2026</p>
<p class="quote">Stand out. There&rsquo;s only one you.</p>
<p class="author">Unknown</p>
</div><p class="brand">Daily Motivation</p></div>
</body></html>
