<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Quote 37</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900&family=Inter:wght@500&display=swap" rel="stylesheet">
<style>
:root{--w:1080px;--h:1920px;--ink:#f5e9c8;--accent:#d4af37;--soft:#a8b89c;}
*{margin:0;padding:0;box-sizing:border-box}body{background:#000}
.stage{position:relative;width:var(--w);height:var(--h);overflow:hidden;
background:
radial-gradient(70% 50% at 50% 20%,#0d4a3a 0%,transparent 60%),
linear-gradient(180deg,#0a3d2e 0%,#062a20 55%,#02140f 100%);
color:var(--ink);font-family:'Inter',Arial,sans-serif;-webkit-font-smoothing:antialiased}
.deco{position:absolute;left:50%;transform:translateX(-50%);width:420px;height:80px;pointer-events:none}
.deco.top{top:150px}
.deco.bot{bottom:150px;transform:translateX(-50%) rotate(180deg)}
.deco svg{width:100%;height:100%}
.safe{position:absolute;inset:320px 110px 340px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;z-index:2}
.quote{font-family:'Playfair Display',Georgia,serif;font-weight:900;font-size:100px;line-height:1.14;letter-spacing:-.4px}
.quote em{font-style:italic;color:var(--accent)}
.author{margin-top:56px;font-size:28px;font-weight:500;letter-spacing:.3em;text-transform:uppercase;color:var(--accent)}
.brand{position:absolute;bottom:80px;left:0;right:0;text-align:center;font-size:18px;letter-spacing:.46em;text-transform:uppercase;color:rgba(168,184,156,.8);z-index:2}
</style></head><body>
<div class="stage">
<div class="deco top"><svg viewBox="0 0 420 80" fill="none" stroke="#d4af37" stroke-width="1.6">
<path d="M10 40 L150 40 L180 10 L210 70 L240 10 L270 40 L410 40"/>
<circle cx="210" cy="40" r="4" fill="#d4af37"/>
</svg></div>
<div class="deco bot"><svg viewBox="0 0 420 80" fill="none" stroke="#d4af37" stroke-width="1.6">
<path d="M10 40 L150 40 L180 10 L210 70 L240 10 L270 40 L410 40"/>
<circle cx="210" cy="40" r="4" fill="#d4af37"/>
</svg></div>
<div class="safe">
<p class="quote">Success is not final, failure is not fatal: it is the <em>courage</em> to continue that counts.</p>
<p class="author">Winston Churchill</p>
</div><p class="brand">Daily Motivation</p></div>
</body></html>
