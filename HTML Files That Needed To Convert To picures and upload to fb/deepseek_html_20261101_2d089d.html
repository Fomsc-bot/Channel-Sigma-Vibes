<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Quote 62</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900;1,700&family=Inter:wght@500&display=swap" rel="stylesheet">
<style>
:root{--w:1080px;--h:1920px;--ink:#2a1810;--accent:#9a3412;--soft:#6a5040;}
*{margin:0;padding:0;box-sizing:border-box}body{background:#000}
.stage{position:relative;width:var(--w);height:var(--h);overflow:hidden;
background:linear-gradient(170deg,#f5e8c8 0%,#e8d4a8 55%,#d4bc82 100%);
color:var(--ink);font-family:'Inter',Arial,sans-serif;-webkit-font-smoothing:antialiased}
.stage::after{content:"";position:absolute;inset:0;background:radial-gradient(75% 55% at 50% 50%,rgba(0,0,0,0) 60%,rgba(80,50,20,.28) 100%);pointer-events:none}
.spine{position:absolute;top:0;bottom:0;left:0;width:34px;background:linear-gradient(90deg,#7a3a14 0%,#9a3412 60%,#7a3a14 100%);z-index:2;box-shadow:4px 0 14px rgba(0,0,0,.25)}
.spine::after{content:"";position:absolute;top:60px;left:50%;transform:translateX(-50%);width:2px;height:calc(100% - 120px);background:rgba(245,232,200,.35)}
.border{position:absolute;inset:80px 80px 100px 120px;border:2px solid var(--accent);z-index:1}
.border::before{content:"";position:absolute;inset:10px;border:1px solid rgba(154,52,18,.4)}
.safe{position:absolute;inset:300px 140px 360px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;z-index:3}
.top{position:absolute;top:200px;left:120px;right:80px;text-align:center;font-size:18px;letter-spacing:.5em;text-transform:uppercase;color:var(--accent);z-index:3}
.orn{font-family:'Playfair Display',Georgia,serif;font-size:40px;color:var(--accent);margin-bottom:48px}
.quote{font-family:'Playfair Display',Georgia,serif;font-style:italic;font-weight:900;font-size:96px;line-height:1.16;letter-spacing:-.4px}
.author{margin-top:56px;font-size:24px;font-weight:500;letter-spacing:.3em;text-transform:uppercase;color:var(--accent)}
.brand{position:absolute;bottom:150px;left:120px;right:80px;text-align:center;font-size:16px;letter-spacing:.44em;text-transform:uppercase;color:rgba(106,80,64,.85);z-index:3}
</style></head><body>
<div class="stage">
<div class="spine"></div>
<div class="border"></div>
<p class="top">Chapter One</p>
<div class="safe">
<p class="orn">❦</p>
<p class="quote">The journey of a thousand miles begins with a single step.</p>
<p class="author">Lao Tzu</p>
</div><p class="brand">Daily Motivation</p></div>
</body></html>
