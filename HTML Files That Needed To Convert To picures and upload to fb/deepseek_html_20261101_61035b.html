<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Quote 55</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900;1,700&family=Special+Elite&display=swap" rel="stylesheet">
<style>
:root{--w:1080px;--h:1920px;--ink:#1c2a1a;--accent:#8a6a1e;--soft:#4a5a3a;}
*{margin:0;padding:0;box-sizing:border-box}body{background:#000}
.stage{position:relative;width:var(--w);height:var(--h);overflow:hidden;
background:
radial-gradient(70% 50% at 50% 30%,#f4ecd8 0%,transparent 55%),
linear-gradient(180deg,#e8dcc0 0%,#d6c495 55%,#c2ac78 100%);
color:var(--ink);font-family:'Special Elite',monospace;-webkit-font-smoothing:antialiased}
.stage::after{content:"";position:absolute;inset:0;background:radial-gradient(70% 55% at 50% 50%,rgba(0,0,0,0) 55%,rgba(60,40,10,.26) 100%);pointer-events:none}
.badge{position:absolute;inset:160px 120px 340px;border:8px double var(--accent);border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:60px 80px;z-index:2;box-shadow:inset 0 0 0 4px rgba(138,106,30,.18)}
.badge::before{content:"";position:absolute;inset:20px;border:2px dashed rgba(138,106,30,.55);border-radius:50%;pointer-events:none}
.est{position:absolute;top:60px;left:0;right:0;text-align:center;font-size:18px;letter-spacing:.5em;text-transform:uppercase;color:var(--accent)}
.badge .orn{font-family:'Playfair Display',Georgia,serif;font-size:48px;color:var(--accent);margin-bottom:12px}
.quote{font-family:'Playfair Display',Georgia,serif;font-style:italic;font-weight:700;font-size:84px;line-height:1.16;letter-spacing:-.4px}
.author{margin-top:40px;font-size:22px;letter-spacing:.3em;text-transform:uppercase;color:var(--accent)}
.brand{position:absolute;bottom:120px;left:0;right:0;text-align:center;font-size:16px;letter-spacing:.44em;text-transform:uppercase;color:rgba(74,90,58,.85);z-index:2}
</style></head><body>
<div class="stage">
<div class="badge">
<p class="est">Authentic · Since 2026</p>
<p class="orn">✦</p>
<p class="quote">Make each day your masterpiece.</p>
<p class="author">John Wooden</p>
</div>
<p class="brand">Daily Motivation</p>
</div>
</body></html>
