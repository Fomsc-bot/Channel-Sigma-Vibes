<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Quote 76</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@700;800&family=Inter:wght@500&display=swap" rel="stylesheet">
<style>
:root{--w:1080px;--h:1920px;--ink:#ffffff;--accent:#fde047;--soft:#e0f2fe;}
*{margin:0;padding:0;box-sizing:border-box}body{background:#000}
.stage{position:relative;width:var(--w);height:var(--h);overflow:hidden;
background:linear-gradient(180deg,#1e40af 0%,#3b82f6 25%,#93c5fd 50%,#fbcfe8 75%,#fef3c7 100%);
color:var(--ink);font-family:'Inter',Arial,sans-serif;-webkit-font-smoothing:antialiased}
.cloud{position:absolute;border-radius:50%;background:radial-gradient(circle at 40% 40%,rgba(255,255,255,.95) 0%,rgba(255,255,255,.7) 40%,rgba(255,255,255,0) 75%);filter:blur(6px);pointer-events:none}
.c1{width:600px;height:340px;top:80px;left:-120px;opacity:.85}
.c2{width:480px;height:260px;top:280px;right:-160px;opacity:.7}
.c3{width:760px;height:400px;bottom:340px;left:-180px;opacity:.9}
.c4{width:520px;height:280px;bottom:120px;right:-120px;opacity:.8}
.sun{position:absolute;bottom:16%;left:50%;transform:translateX(-50%);width:280px;height:280px;border-radius:50%;background:radial-gradient(circle,#fff8dc 0%,#fef3c7 40%,#fde047 70%,rgba(253,224,71,0) 100%);box-shadow:0 0 160px 60px rgba(253,224,71,.55);pointer-events:none}
.stage::after{content:"";position:absolute;inset:0;background:radial-gradient(70% 50% at 50% 50%,rgba(0,0,0,0) 55%,rgba(0,0,0,.28) 100%);pointer-events:none}
.safe{position:absolute;inset:280px 100px 420px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;z-index:2}
.quote{font-family:'Outfit',Arial,sans-serif;font-weight:800;font-size:108px;line-height:1.1;letter-spacing:-1.2px;text-shadow:0 6px 30px rgba(0,0,0,.5),0 2px 6px rgba(30,64,175,.5)}
.author{margin-top:56px;font-size:28px;font-weight:500;letter-spacing:.3em;text-transform:uppercase;color:var(--accent);text-shadow:0 2px 10px rgba(0,0,0,.4)}
.brand{position:absolute;bottom:100px;left:0;right:0;text-align:center;font-size:18px;letter-spacing:.44em;text-transform:uppercase;color:rgba(224,242,254,.85);z-index:3}
</style></head><body>
<div class="stage">
<div class="cloud c1"></div><div class="cloud c2"></div>
<div class="cloud c3"></div><div class="cloud c4"></div>
<div class="sun"></div>
<div class="safe">
<p class="quote">Reach for the sky. You were never meant to stay low.</p>
<p class="author">Unknown</p>
</div><p class="brand">Daily Motivation</p></div>
</body></html>
