<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Quote 12</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;0,700;1,700&family=Inter:wght@500&display=swap" rel="stylesheet">
<style>
:root{--w:1080px;--h:1920px;--ink:#1f2226;--accent:#b08d3f;--soft:#5c6066;}
*{margin:0;padding:0;box-sizing:border-box}body{background:#000}
.stage{position:relative;width:var(--w);height:var(--h);overflow:hidden;
background:url('https://images.unsplash.com/photo-1519681393784-d120267933ba?auto=format&fit=crop&w=1080&q=80') center/cover no-repeat;
color:var(--ink);font-family:'Inter',Arial,sans-serif;-webkit-font-smoothing:antialiased}
.stage::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,255,255,.72) 0%,rgba(255,255,255,.55) 50%,rgba(255,255,255,.78) 100%)}
.card{position:absolute;inset:200px 90px 220px;background:rgba(255,255,255,.92);border:1px solid rgba(176,141,63,.5);z-index:2}
.card::before{content:"";position:absolute;inset:16px;border:1px solid rgba(176,141,63,.35);pointer-events:none}
.safe{position:absolute;inset:300px 130px 340px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;z-index:3}
.crown{font-size:48px;color:var(--accent);margin-bottom:40px}
.quote{font-family:'Cormorant Garamond',Georgia,serif;font-weight:700;font-size:96px;line-height:1.14;letter-spacing:-.4px}
.author{margin-top:52px;font-size:26px;font-weight:500;letter-spacing:.28em;text-transform:uppercase;color:var(--accent)}
.brand{position:absolute;bottom:120px;left:0;right:0;text-align:center;font-size:18px;letter-spacing:.42em;text-transform:uppercase;color:rgba(92,96,102,.85);z-index:3}
</style></head><body>
<div class="stage"><div class="card"></div><div class="safe">
<p class="crown">♛</p>
<p class="quote">Elegance is not standing out, but being remembered.</p>
<p class="author">Giorgio Armani</p>
</div><p class="brand">Daily Motivation</p></div>
</body></html>
