<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Quote 74</title>
<link href="https://fonts.googleapis.com/css2?family=Righteous&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--w:1080px;--h:1920px;--ink:#fef3c7;--pink:#f472b6;--cyan:#22d3ee;--soft:#c4b5fd;}
*{margin:0;padding:0;box-sizing:border-box}body{background:#000}
.stage{position:relative;width:var(--w);height:var(--h);overflow:hidden;
background:linear-gradient(180deg,#1e1b4b 0%,#4c1d95 40%,#7c3aed 65%,#ec4899 85%,#f472b6 100%);
color:var(--ink);font-family:'Space Grotesk',Arial,sans-serif;-webkit-font-smoothing:antialiased}
.sun{position:absolute;top:46%;left:50%;transform:translate(-50%,-50%);width:400px;height:400px;border-radius:50%;background:linear-gradient(180deg,#fef3c7 0%,#fbbf24 40%,#f472b6 75%,#ec4899 100%);box-shadow:0 0 100px 30px rgba(244,114,182,.45);pointer-events:none;overflow:hidden}
.sun::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,transparent 0 18px,rgba(30,27,75,.6) 18px 22px)}
.grid{position:absolute;bottom:0;left:-50%;right:-50%;height:420px;
background-image:
linear-gradient(rgba(34,211,238,.55) 1px,transparent 1px),
linear-gradient(90deg,rgba(34,211,238,.55) 1px,transparent 1px);
background-size:80px 60px;
transform:perspective(400px) rotateX(58deg);transform-origin:bottom center;pointer-events:none;
-webkit-mask:linear-gradient(180deg,transparent 0%,#000 60%)}
.safe{position:absolute;inset:300px 100px 400px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;z-index:2}
.kicker{font-size:22px;letter-spacing:.5em;text-transform:uppercase;color:var(--cyan);margin-bottom:44px;font-weight:600;text-shadow:0 0 16px rgba(34,211,238,.7)}
.quote{font-family:'Righteous',Arial,sans-serif;font-size:104px;line-height:1.1;letter-spacing:-1px;text-shadow:0 0 24px rgba(244,114,182,.7),0 4px 14px rgba(0,0,0,.4)}
.author{margin-top:56px;font-size:26px;font-weight:500;letter-spacing:.3em;text-transform:uppercase;color:var(--cyan)}
.brand{position:absolute;bottom:80px;left:0;right:0;text-align:center;font-size:18px;letter-spacing:.44em;text-transform:uppercase;color:rgba(196,181,253,.8);z-index:3}
</style></head><body>
<div class="stage"><div class="sun"></div><div class="grid"></div><div class="safe">
<p class="kicker">A E S T H E T I C</p>
<p class="quote">Vibe high. Stay rare.</p>
<p class="author">Unknown</p>
</div><p class="brand">Daily Motivation</p></div>
</body></html>
