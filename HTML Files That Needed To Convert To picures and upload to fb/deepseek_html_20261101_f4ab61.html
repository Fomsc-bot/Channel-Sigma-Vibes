<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Quote 24</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;1,700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--w:1080px;--h:1920px;--ink:#f4ecd8;--accent:#c9a24a;--soft:#8a7a55;}
*{margin:0;padding:0;box-sizing:border-box}body{background:#000}
.stage{position:relative;width:var(--w);height:var(--h);overflow:hidden;
background:radial-gradient(100% 70% at 50% 30%,#1a1712 0%,#0b0906 60%,#050403 100%);
color:var(--ink);font-family:'Inter',Arial,sans-serif;-webkit-font-smoothing:antialiased}
.frame{position:absolute;inset:100px;border:1px solid rgba(201,162,74,.4);pointer-events:none}
.frame::before{content:"";position:absolute;inset:14px;border:1px solid rgba(201,162,74,.18);pointer-events:none}
.safe{position:absolute;inset:340px 140px 340px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;z-index:2}
.line{width:80px;height:1px;background:var(--accent);margin-bottom:56px}
.line.bot{margin:56px 0 0}
.quote{font-family:'Playfair Display',Georgia,serif;font-weight:600;font-size:100px;line-height:1.16;letter-spacing:-.5px}
.author{margin-top:56px;font-size:26px;font-weight:500;letter-spacing:.3em;text-transform:uppercase;color:var(--accent)}
.brand{position:absolute;bottom:180px;left:0;right:0;text-align:center;font-size:17px;letter-spacing:.46em;text-transform:uppercase;color:rgba(138,122,85,.85);z-index:2}
</style></head><body>
<div class="stage"><div class="frame"></div><div class="safe">
<div class="line"></div>
<p class="quote">Quiet minds make the loudest moves.</p>
<p class="author">Unknown</p>
<div class="line bot"></div>
</div><p class="brand">Daily Motivation</p></div>
</body></html>
