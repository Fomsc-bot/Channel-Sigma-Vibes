<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Quote 03</title>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@700;900&family=Inter:wght@500&display=swap" rel="stylesheet">
<style>
:root{--w:1080px;--h:1920px;--ink:#ffffff;--accent:#f4d35e;}
*{margin:0;padding:0;box-sizing:border-box}body{background:#000}
.stage{position:relative;width:var(--w);height:var(--h);overflow:hidden;
background:url('https://images.unsplash.com/photo-1470071459604-3b5ec3a7fe05?auto=format&fit=crop&w=1080&q=80') center/cover no-repeat;
-webkit-font-smoothing:antialiased;font-family:'Inter',Arial,sans-serif}
.stage::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.35) 0%,rgba(0,0,0,.6) 50%,rgba(0,0,0,.78) 100%)}
.safe{position:absolute;inset:300px 96px 320px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;z-index:2}
.quote{font-family:'Roboto',Arial,sans-serif;font-weight:900;font-size:92px;line-height:1.15;color:var(--ink);text-shadow:0 4px 24px rgba(0,0,0,.65);letter-spacing:-.5px}
.accent-line{width:60px;height:3px;background:var(--accent);margin:52px 0 44px;border-radius:2px}
.author{font-size:30px;font-weight:500;letter-spacing:.24em;text-transform:uppercase;color:rgba(255,255,255,.86)}
.brand{position:absolute;bottom:80px;left:0;right:0;text-align:center;font-size:20px;letter-spacing:.4em;text-transform:uppercase;color:rgba(255,255,255,.6);z-index:2}
</style></head><body>
<div class="stage"><div class="safe">
<p class="quote">The only limit to our realization of tomorrow is our doubts of today.</p>
<div class="accent-line"></div>
<p class="author">Franklin D. Roosevelt</p>
</div><p class="brand">Daily Motivation</p></div>
</body></html>
