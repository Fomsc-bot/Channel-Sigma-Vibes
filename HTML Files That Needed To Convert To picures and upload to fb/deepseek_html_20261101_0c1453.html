<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Quote 36</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=Inter:wght@500&display=swap" rel="stylesheet">
<style>
:root{--w:1080px;--h:1920px;--ink:#1a1020;--accent:#7c3aed;--soft:#5a4a68;}
*{margin:0;padding:0;box-sizing:border-box}body{background:#000}
.stage{position:relative;width:var(--w);height:var(--h);overflow:hidden;
background:
radial-gradient(circle at 25% 25%,#ffd6f5 0%,transparent 45%),
radial-gradient(circle at 75% 30%,#c6f0ff 0%,transparent 45%),
radial-gradient(circle at 40% 80%,#e8d6ff 0%,transparent 50%),
radial-gradient(circle at 85% 78%,#d6ffe8 0%,transparent 45%),
linear-gradient(160deg,#f5eaff 0%,#dff0ff 45%,#ffeaf5 100%);
color:var(--ink);font-family:'Inter',Arial,sans-serif;-webkit-font-smoothing:antialiased}
.stage::before{content:"";position:absolute;inset:0;
background:
linear-gradient(120deg,rgba(255,182,240,.28) 0%,rgba(182,240,255,.28) 30%,rgba(220,182,255,.28) 60%,rgba(182,255,220,.28) 100%);
mix-blend-mode:soft-light;pointer-events:none}
.safe{position:absolute;inset:300px 100px 320px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;z-index:2}
.gem{width:80px;height:80px;margin-bottom:56px;background:conic-gradient(from 0deg,#ff9ee0,#9ed4ff,#c8a8ff,#9effd8,#ff9ee0);border-radius:22px;transform:rotate(45deg);box-shadow:0 14px 40px rgba(140,100,200,.35)}
.quote{font-family:'Space Grotesk',Arial,sans-serif;font-weight:700;font-size:100px;line-height:1.12;letter-spacing:-1px}
.author{margin-top:56px;font-size:28px;font-weight:500;letter-spacing:.28em;text-transform:uppercase;color:var(--accent)}
.brand{position:absolute;bottom:80px;left:0;right:0;text-align:center;font-size:18px;letter-spacing:.44em;text-transform:uppercase;color:rgba(90,74,104,.75);z-index:2}
</style></head><body>
<div class="stage"><div class="safe">
<div class="gem"></div>
<p class="quote">Your potential is endless. Act like it.</p>
<p class="author">Unknown</p>
</div><p class="brand">Daily Motivation</p></div>
</body></html>
