<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Quote 47</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;1,700&family=Inter:wght@500&display=swap" rel="stylesheet">
<style>
:root{--w:1080px;--h:1920px;--ink:#3a2410;--accent:#b45309;--soft:#7a5c38;}
*{margin:0;padding:0;box-sizing:border-box}body{background:#000}
.stage{position:relative;width:var(--w);height:var(--h);overflow:hidden;
background:linear-gradient(180deg,#fef3c7 0%,#fcd9a0 40%,#e8b87a 70%,#c98a4a 100%);
color:var(--ink);font-family:'Inter',Arial,sans-serif;-webkit-font-smoothing:antialiased}
.dune{position:absolute;left:-10%;right:-10%;border-radius:50% 50% 0 0;pointer-events:none}
.dune.d1{bottom:0;height:520px;background:linear-gradient(180deg,#d99552,#a8692e);opacity:.85}
.dune.d2{bottom:120px;left:-30%;height:420px;background:linear-gradient(180deg,#e8b87a,rgba(232,184,122,0));opacity:.7}
.dune.d3{bottom:240px;right:-30%;height:320px;background:linear-gradient(180deg,#f5d098,rgba(245,208,152,0));opacity:.55}
.stage::after{content:"";position:absolute;inset:0;background:radial-gradient(70% 55% at 50% 35%,rgba(255,245,220,.5) 0%,rgba(0,0,0,0) 60%),radial-gradient(70% 50% at 50% 50%,rgba(0,0,0,0) 55%,rgba(90,50,10,.22) 100%);pointer-events:none}
.safe{position:absolute;inset:300px 110px 420px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;z-index:2}
.quote{font-family:'Cormorant Garamond',Georgia,serif;font-style:italic;font-weight:700;font-size:104px;line-height:1.12;letter-spacing:-.4px}
.author{margin-top:56px;font-size:28px;font-weight:500;letter-spacing:.28em;text-transform:uppercase;color:var(--accent)}
.brand{position:absolute;bottom:80px;left:0;right:0;text-align:center;font-size:18px;letter-spacing:.44em;text-transform:uppercase;color:rgba(122,92,56,.85);z-index:3}
</style></head><body>
<div class="stage"><div class="dune d3"></div><div class="dune d2"></div><div class="dune d1"></div><div class="safe">
<p class="quote">The desert teaches patience. And patience builds strength.</p>
<p class="author">Unknown</p>
</div><p class="brand">Daily Motivation</p></div>
</body></html>
