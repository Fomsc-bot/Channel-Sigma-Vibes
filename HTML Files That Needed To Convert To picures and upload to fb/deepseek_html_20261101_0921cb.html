<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Quote 16</title>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{--w:1080px;--h:1920px;--ink:#fff;--dark:#0f0f10;--accent:#ffbe0b;--soft:#b9b9bd;}
*{margin:0;padding:0;box-sizing:border-box}body{background:#000}
.stage{position:relative;width:var(--w);height:var(--h);overflow:hidden;display:flex;flex-direction:column;color:var(--ink);font-family:'Inter',Arial,sans-serif;-webkit-font-smoothing:antialiased}
.top{flex:0 0 44%;background:var(--dark);position:relative;display:flex;align-items:flex-end;justify-content:center;padding-bottom:60px}
.top .kicker{font-size:22px;letter-spacing:.5em;text-transform:uppercase;color:var(--accent)}
.bottom{flex:1;background:linear-gradient(160deg,#ffbe0b 0%,#fb8500 100%);position:relative;display:flex;align-items:center;justify-content:center;padding:120px 100px 220px;text-align:center}
.quote{font-family:'Anton',Arial,sans-serif;font-weight:400;font-size:112px;line-height:1.06;letter-spacing:-1.5px;text-transform:uppercase;color:var(--dark)}
.author{position:absolute;bottom:200px;left:0;right:0;text-align:center;font-size:26px;font-weight:600;letter-spacing:.3em;text-transform:uppercase;color:rgba(15,15,16,.75)}
.brand{position:absolute;bottom:80px;left:0;right:0;text-align:center;font-size:18px;letter-spacing:.42em;text-transform:uppercase;color:rgba(15,15,16,.55)}
</style></head><body>
<div class="stage">
<div class="top"><p class="kicker">Real talk</p></div>
<div class="bottom">
<p class="quote">Dream big. Start small. Act now.</p>
<p class="author">Robin Sharma</p>
<p class="brand">Daily Motivation</p>
</div>
</div>
</body></html>
