<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Quote 04</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;700&display=swap" rel="stylesheet">
<style>
:root{--w:1080px;--h:1920px;--ink:#1a1a1a;--soft:#5a5a5a;--accent:#d9480f;}
*{margin:0;padding:0;box-sizing:border-box}body{background:#000}
.stage{position:relative;width:var(--w);height:var(--h);overflow:hidden;background:#fafafa;color:var(--ink);font-family:'Inter',Arial,sans-serif;-webkit-font-smoothing:antialiased;border:14px solid #1a1a1a}
.safe{position:absolute;inset:300px 96px 320px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.quote{font-family:'Inter',Arial,sans-serif;font-weight:300;font-size:82px;line-height:1.22;letter-spacing:-.3px;color:var(--ink)}
.quote strong{font-weight:700;color:var(--accent)}
.author{margin-top:56px;font-size:24px;font-weight:700;letter-spacing:.28em;text-transform:uppercase;color:var(--soft)}
.brand{margin-top:100px;font-size:18px;letter-spacing:.4em;text-transform:uppercase;color:#8a8a8a}
</style></head><body>
<div class="stage"><div class="safe">
<p class="quote"><strong>Progress</strong>, not perfection — every step counts.</p>
<p class="author">Unknown</p>
<p class="brand">Daily Motivation</p>
</div></div>
</body></html>
