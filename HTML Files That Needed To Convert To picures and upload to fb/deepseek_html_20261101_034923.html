<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Quote 22</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
:root{--w:1080px;--h:1920px;--ink:#e6f1ff;--accent:#4ec9f5;--soft:#6b8aab;}
*{margin:0;padding:0;box-sizing:border-box}body{background:#000}
.stage{position:relative;width:var(--w);height:var(--h);overflow:hidden;background:#0a1a2f;
color:var(--ink);font-family:'Space Grotesk',Arial,sans-serif;-webkit-font-smoothing:antialiased}
.grid{position:absolute;inset:0;
background-image:
linear-gradient(rgba(78,201,245,.10) 1px,transparent 1px),
linear-gradient(90deg,rgba(78,201,245,.10) 1px,transparent 1px),
linear-gradient(rgba(78,201,245,.05) 1px,transparent 1px),
linear-gradient(90deg,rgba(78,201,245,.05) 1px,transparent 1px);
background-size:120px 120px,120px 120px,40px 40px,40px 40px}
.grid::before,.grid::after{content:"";position:absolute;width:44px;height:44px;border:2px solid var(--accent)}
.grid::before{top:180px;left:80px;border-right:none;border-bottom:none}
.grid::after{bottom:180px;right:80px;border-left:none;border-top:none}
.safe{position:absolute;inset:300px 100px 320px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;z-index:2}
.label{font-family:'JetBrains Mono',monospace;font-size:22px;letter-spacing:.3em;color:var(--accent);margin-bottom:44px;text-transform:uppercase}
.quote{font-family:'Space Grotesk',Arial,sans-serif;font-weight:700;font-size:96px;line-height:1.14;letter-spacing:-1px}
.author{margin-top:56px;font-family:'JetBrains Mono',monospace;font-size:24px;letter-spacing:.24em;text-transform:uppercase;color:var(--soft)}
.brand{position:absolute;bottom:80px;left:0;right:0;text-align:center;font-family:'JetBrains Mono',monospace;font-size:18px;letter-spacing:.4em;text-transform:uppercase;color:rgba(107,138,171,.75);z-index:2}
</style></head><body>
<div class="stage"><div class="grid"></div><div class="safe">
<p class="label">// built different</p>
<p class="quote">Great things are built one decision at a time.</p>
<p class="author">Unknown</p>
</div><p class="brand">Daily Motivation</p></div>
</body></html>
