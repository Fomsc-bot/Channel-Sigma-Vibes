<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Quote 71</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,600;1,700&family=Inter:wght@500&display=swap" rel="stylesheet">
<style>
:root{--w:1080px;--h:1920px;--ink:#2a3a28;--accent:#5b8a4a;--soft:#7a8a75;}
*{margin:0;padding:0;box-sizing:border-box}body{background:#000}
.stage{position:relative;width:var(--w);height:var(--h);overflow:hidden;
background:
radial-gradient(60% 40% at 30% 20%,#f4f8ec 0%,transparent 60%),
radial-gradient(55% 45% at 80% 80%,#e8f0dd 0%,transparent 55%),
linear-gradient(170deg,#fbfcf6 0%,#edf2e2 55%,#dce6cc 100%);
color:var(--ink);font-family:'Inter',Arial,sans-serif;-webkit-font-smoothing:antialiased}
.wreath{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:740px;height:740px;pointer-events:none;opacity:.6}
.wreath svg{width:100%;height:100%}
.stage::after{content:"";position:absolute;inset:0;background:radial-gradient(75% 55% at 50% 50%,rgba(0,0,0,0) 60%,rgba(60,80,50,.14) 100%);pointer-events:none}
.safe{position:absolute;inset:380px 160px 380px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;z-index:2}
.orn{font-size:40px;color:var(--accent);margin-bottom:44px}
.quote{font-family:'Fraunces',Georgia,serif;font-style:italic;font-weight:700;font-size:92px;line-height:1.16;letter-spacing:-.4px}
.author{margin-top:56px;font-size:26px;font-weight:500;letter-spacing:.3em;text-transform:uppercase;color:var(--accent)}
.brand{position:absolute;bottom:160px;left:0;right:0;text-align:center;font-size:18px;letter-spacing:.44em;text-transform:uppercase;color:rgba(122,138,117,.85);z-index:2}
</style></head><body>
<div class="stage">
<div class="wreath"><svg viewBox="0 0 400 400" fill="none" stroke="#5b8a4a" stroke-width="1.4">
<circle cx="200" cy="200" r="150" stroke-dasharray="3 6"/>
<path d="M200 50 C220 80 240 100 240 130 C240 160 220 180 200 200"/>
<path d="M200 50 C180 80 160 100 160 130 C160 160 180 180 200 200"/>
<path d="M200 350 C220 320 240 300 240 270 C240 240 220 220 200 200"/>
<path d="M200 350 C180 320 160 300 160 270 C160 240 180 220 200 200"/>
<circle cx="200" cy="200" r="8" fill="#5b8a4a"/>
</svg></div>
<div class="safe">
<p class="orn">❀</p>
<p class="quote">Be gentle with yourself. You are a garden still growing.</p>
<p class="author">Unknown</p>
</div><p class="brand">Daily Motivation</p></div>
</body></html>
