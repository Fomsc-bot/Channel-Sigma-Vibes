<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Quote 66</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:wght@500&display=swap" rel="stylesheet">
<style>
:root{--w:1080px;--h:1920px;--ink:#f0e6d2;--accent:#fbbf24;--soft:#a8b0bc;}
*{margin:0;padding:0;box-sizing:border-box}body{background:#000}
.stage{position:relative;width:var(--w);height:var(--h);overflow:hidden;
background:
repeating-linear-gradient(90deg,rgba(255,255,255,.045) 0 2px,transparent 2px 4px),
repeating-linear-gradient(0deg,rgba(0,0,0,.12) 0 2px,transparent 2px 4px),
linear-gradient(160deg,#1e3a5f 0%,#1a2f4a 55%,#0f1e30 100%);
color:var(--ink);font-family:'Inter',Arial,sans-serif;-webkit-font-smoothing:antialiased}
.stitch{position:absolute;left:80px;right:80px;height:2px;background:repeating-linear-gradient(90deg,#fbbf24 0 12px,transparent 12px 20px);opacity:.55}
.stitch.t{top:140px}
.stitch.b{bottom:140px}
.patch{position:absolute;top:180px;right:80px;width:180px;height:180px;background:rgba(15,30,48,.85);border:3px dashed rgba(251,191,36,.55);border-radius:8px;display:flex;align-items:center;justify-content:center;font-family:'Archivo Black',Arial,sans-serif;font-size:64px;color:var(--accent);transform:rotate(6deg);z-index:2}
.stage::after{content:"";position:absolute;inset:0;background:radial-gradient(70% 50% at 50% 50%,rgba(0,0,0,0) 55%,rgba(0,0,0,.45) 100%);pointer-events:none}
.safe{position:absolute;inset:340px 110px 340px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;z-index:3}
.kicker{font-size:22px;letter-spacing:.5em;text-transform:uppercase;color:var(--accent);margin-bottom:44px;font-weight:600}
.quote{font-family:'Archivo Black',Arial,sans-serif;font-size:104px;line-height:1.08;letter-spacing:-1.5px;text-transform:uppercase;text-shadow:0 4px 20px rgba(0,0,0,.5)}
.author{margin-top:56px;font-size:26px;font-weight:500;letter-spacing:.3em;text-transform:uppercase;color:var(--accent)}
.brand{position:absolute;bottom:80px;left:0;right:0;text-align:center;font-size:18px;letter-spacing:.44em;text-transform:uppercase;color:rgba(168,176,188,.8);z-index:2}
</style></head><body>
<div class="stage"><div class="stitch t"></div><div class="stitch b"></div><div class="patch">01</div><div class="safe">
<p class="kicker">Built to last</p>
<p class="quote">Hard work beats talent when talent doesn&rsquo;t work hard.</p>
<p class="author">Tim Notke</p>
</div><p class="brand">Daily Motivation</p></div>
</body></html>
