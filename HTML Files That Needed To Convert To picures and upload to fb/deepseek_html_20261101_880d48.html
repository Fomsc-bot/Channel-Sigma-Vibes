<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Quote 65</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;1,700&family=Inter:wght@500&display=swap" rel="stylesheet">
<style>
:root{--w:1080px;--h:1920px;--ink:#1f1a24;--accent:#7a5a8a;--soft:#6a5a72;}
*{margin:0;padding:0;box-sizing:border-box}body{background:#000}
.stage{position:relative;width:var(--w);height:var(--h);overflow:hidden;
background:
radial-gradient(60% 40% at 25% 20%,#f4eef8 0%,transparent 55%),
radial-gradient(50% 40% at 80% 75%,#e8dff0 0%,transparent 60%),
linear-gradient(160deg,#faf7fc 0%,#ece2f0 55%,#d6c8dc 100%);
color:var(--ink);font-family:'Inter',Arial,sans-serif;-webkit-font-smoothing:antialiased}
.vein{position:absolute;pointer-events:none;opacity:.35}
.vein svg{width:100%;height:100%}
.vein.a{top:0;left:0;width:600px;height:600px}
.vein.b{bottom:0;right:0;width:700px;height:700px;transform:rotate(180deg)}
.vein.c{top:40%;left:30%;width:400px;height:400px;opacity:.22}
.stage::after{content:"";position:absolute;inset:0;background:radial-gradient(75% 55% at 50% 50%,rgba(0,0,0,0) 60%,rgba(60,40,70,.18) 100%);pointer-events:none}
.safe{position:absolute;inset:320px 120px 340px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;z-index:2}
.orn{font-size:44px;color:var(--accent);margin-bottom:48px;letter-spacing:10px}
.quote{font-family:'Cormorant Garamond',Georgia,serif;font-style:italic;font-weight:700;font-size:108px;line-height:1.1;letter-spacing:-.5px}
.author{margin-top:56px;font-size:26px;font-weight:500;letter-spacing:.3em;text-transform:uppercase;color:var(--accent)}
.brand{position:absolute;bottom:160px;left:0;right:0;text-align:center;font-size:18px;letter-spacing:.44em;text-transform:uppercase;color:rgba(106,90,114,.85);z-index:2}
</style></head><body>
<div class="stage">
<svg class="vein a" viewBox="0 0 600 600" fill="none" stroke="#7a5a8a" stroke-width="1.2">
<path d="M-20 80 C120 140 220 60 340 160 C420 230 520 200 620 280"/>
<path d="M-20 160 C140 220 240 140 360 240 C440 310 540 280 620 360" stroke-width=".8"/>
<path d="M-20 260 C160 300 260 220 380 320 C460 390 540 360 620 440" stroke-width=".6"/>
</svg>
<svg class="vein b" viewBox="0 0 600 600" fill="none" stroke="#7a5a8a" stroke-width="1.2">
<path d="M-20 80 C120 140 220 60 340 160 C420 230 520 200 620 280"/>
<path d="M-20 160 C140 220 240 140 360 240 C440 310 540 280 620 360" stroke-width=".8"/>
</svg>
<svg class="vein c" viewBox="0 0 600 600" fill="none" stroke="#7a5a8a" stroke-width="1">
<path d="M-20 280 C140 340 260 240 380 340 C460 410 540 380 620 460"/>
</svg>
<div class="safe">
<p class="orn">✦ ✦ ✦</p>
<p class="quote">Elegance is refusal.</p>
<p class="author">Diana Vreeland</p>
</div><p class="brand">Daily Motivation</p></div>
</body></html>
