<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Quote 07</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,600;1,700&family=Inter:wght@500&display=swap" rel="stylesheet">
<style>
:root{--w:1080px;--h:1920px;--ink:#20301f;--accent:#5a7d4b;--soft:#68786a;}
*{margin:0;padding:0;box-sizing:border-box}body{background:#000}
.stage{position:relative;width:var(--w);height:var(--h);overflow:hidden;background:linear-gradient(180deg,#eef2e3 0%,#d9e4c5 55%,#b9cfa0 100%);color:var(--ink);font-family:'Inter',Arial,sans-serif;-webkit-font-smoothing:antialiased}
.stage::before{content:"";position:absolute;inset:0;background:radial-gradient(80% 60% at 50% 40%,rgba(255,255,255,.65) 0%,rgba(255,255,255,0) 70%)}
.safe{position:absolute;inset:300px 96px 320px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;z-index:2}
.leaf{font-size:56px;margin-bottom:32px}
.quote{font-family:'Cormorant Garamond',Georgia,serif;font-style:italic;font-weight:700;font-size:96px;line-height:1.14;letter-spacing:-.5px}
.author{margin-top:56px;font-size:28px;font-weight:500;letter-spacing:.26em;text-transform:uppercase;color:var(--soft)}
.brand{margin-top:100px;font-size:18px;letter-spacing:.4em;text-transform:uppercase;color:var(--accent)}
</style></head><body>
<div class="stage"><div class="safe">
<div class="leaf">🌿</div>
<p class="quote">Almost everything will work again if you unplug it for a few minutes — including you.</p>
<p class="author">Anne Lamott</p>
<p class="brand">Daily Motivation</p>
</div></div>
</body></html>
