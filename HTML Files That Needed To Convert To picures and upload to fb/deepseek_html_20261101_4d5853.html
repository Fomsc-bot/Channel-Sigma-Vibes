<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Quote 41</title>
<link href="https://fonts.googleapis.com/css2?family=Black+Ops+One&family=Inter:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--w:1080px;--h:1920px;--ink:#f5f5f0;--accent:#facc15;--soft:#8a8a82;}
*{margin:0;padding:0;box-sizing:border-box}body{background:#000}
.stage{position:relative;width:var(--w);height:var(--h);overflow:hidden;
background:
radial-gradient(60% 40% at 20% 15%,#2a2a2a 0%,transparent 55%),
linear-gradient(165deg,#181818 0%,#0e0e0e 55%,#050505 100%);
color:var(--ink);font-family:'Inter',Arial,sans-serif;-webkit-font-smoothing:antialiased}
.spray{position:absolute;border-radius:50%;filter:blur(60px);opacity:.35;pointer-events:none}
.spray.a{width:400px;height:400px;background:#facc15;top:120px;right:-120px}
.spray.b{width:360px;height:360px;background:#f97316;bottom:140px;left:-120px;opacity:.25}
.tape{position:absolute;width:260px;height:46px;background:rgba(250,204,21,.85);transform:rotate(-8deg);box-shadow:0 4px 14px rgba(0,0,0,.5);z-index:3}
.tape.a{top:130px;left:-60px}
.tape.b{bottom:180px;right:-60px;transform:rotate(6deg)}
.safe{position:absolute;inset:300px 100px 320px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;z-index:2}
.kicker{font-size:22px;font-weight:700;letter-spacing:.5em;text-transform:uppercase;color:var(--accent);margin-bottom:48px}
.quote{font-family:'Black Ops One',Arial,sans-serif;font-size:110px;line-height:1.06;letter-spacing:-1.5px;text-transform:uppercase;color:var(--ink);text-shadow:4px 4px 0 #f97316,8px 8px 0 rgba(0,0,0,.6)}
.author{margin-top:56px;font-size:26px;font-weight:700;letter-spacing:.3em;text-transform:uppercase;color:var(--accent)}
.brand{position:absolute;bottom:80px;left:0;right:0;text-align:center;font-size:18px;letter-spacing:.44em;text-transform:uppercase;color:rgba(138,138,130,.85);z-index:2}
</style></head><body>
<div class="stage"><div class="spray a"></div><div class="spray b"></div><div class="tape a"></div><div class="tape b"></div><div class="safe">
<p class="kicker">No days off</p>
<p class="quote">Show up. Even when it&rsquo;s hard.</p>
<p class="author">Unknown</p>
</div><p class="brand">Daily Motivation</p></div>
</body></html>
